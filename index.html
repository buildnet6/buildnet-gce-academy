        ]
      },
      { id:"arms", name:"Organs of Government and Separation of Powers",
        hook:"Think of a football match: one group writes the rulebook before the season starts (Legislature), one group actually plays the match and carries out those rules on the pitch (Executive), and the referee steps in to settle disputes about what a rule actually means mid-game (Judiciary). If one person tried to do all three jobs at once, write the rules, play the match, AND referee it, the match would be badly, obviously unfair. That's not a cute exaggeration - it's almost word-for-word how the French philosopher Montesquieu argued the case in 1748, and most of the world's constitutions, Nigeria's included, still follow his blueprint today.",
        obj:["Identify the three arms of government, their real composition, and their specific functions","Explain checks and balances with concrete examples of one arm restraining another","Distinguish separation of powers from the related but different idea of federalism","Discuss the dangers of concentrating power in a single arm, with real historical examples"],
        exp:[
          {t:"The three arms, in real terms", b:"The Legislature isn't an abstract idea - in Nigeria it's the National Assembly, split into the Senate and House of Representatives, and its main job is making, amending and repealing laws. The Executive is the President, Vice President, and the ministries/agencies that actually run the country day to day, enforcing whatever the Legislature has passed. The Judiciary is the courts, from Magistrate Courts up through the Supreme Court, and its job is interpreting what a law actually means when two people disagree about it, and deciding whether a law or an executive action is even constitutional in the first place."},
          {t:"Checks and balances - not just theory, actual mechanics", b:"Each arm has real, specific tools to restrain the others, not just a vague 'watching' relationship. The Legislature can refuse to pass the Executive's budget, or impeach a sitting President. The Executive can veto a bill the Legislature passes (though the Legislature can often override that veto with enough votes). The Judiciary can strike down a law as unconstitutional, even one the President signed and the Assembly passed. None of these are hypothetical - each has actually happened in Nigeria's Fourth Republic."},
          {t:"Separation of powers vs. federalism - a common mix-up", b:"Students often confuse these two ideas because both are about 'dividing power', but they divide it along completely different lines. Separation of powers divides power by FUNCTION (who makes laws vs who enforces them vs who interprets them) within one level of government. Federalism divides power by LEVEL/TERRITORY, between a central government and states or regions. Nigeria uses both at once: separation of powers exists at both the federal AND state levels, and federalism separately divides authority between Abuja and the 36 states."},
          {t:"What happens when one arm gets too much power", b:"History gives blunt warnings here. Military governments in Nigeria (1966-1979, 1983-1999) collapsed the three arms into one - the Head of State ruled by decree, meaning there was no separate Legislature to say no and no independent Judiciary that could safely rule against the government. That's the textbook definition of what separation of powers exists specifically to prevent: a single, unchecked hand controlling every stage of a decision, from writing the rule to enforcing it to judging it."}
        ],
        err:["Assuming one arm can operate without any oversight from the others","Confusing the roles of the legislature and judiciary - remember, legislature WRITES, judiciary INTERPRETS","Mixing up separation of powers (division by function) with federalism (division by territory/level)","Thinking a presidential veto is always final - most systems allow the legislature to override it with a strong enough majority"],
        qs:[
          Q("The arm of government responsible for making laws is the",["Legislature","Executive","Judiciary","Civil Service"],0,"The legislature (e.g. a parliament or national assembly) enacts laws.","Easy"),
          Q("The arm of government responsible for interpreting laws is the",["Judiciary","Executive","Legislature","Police"],0,"Courts interpret and apply the law.","Easy"),
          Q("Which arm of government mainly implements and enforces laws?",["The Executive","The Legislature","The Judiciary","The Electorate"],0,"The executive branch carries out and enforces laws.","Easy"),
          Q("A key difference between separation of powers and federalism is that separation of powers divides authority by",["function (law-making, enforcement, interpretation), while federalism divides it by territory or level","territory, while federalism divides it by function","population size only","religion and ethnicity"],0,"Separation of powers splits government by function; federalism splits it between central and regional/state levels.","Medium"),
          Q("When military governments suspended Nigeria's constitution and ruled by decree, the arm of government that was most clearly eliminated in practice was the",["Legislature, since decrees bypassed the need for a National Assembly to pass laws","Executive, since the military still needed to govern","Judiciary, since courts continued operating exactly as before","None - all three arms continued functioning normally"],0,"Military rule by decree removed the law-making role of an elected legislature entirely, concentrating that power in the executive.","Hard")
        ]
      },
      { id:"citizenship", name:"Citizenship and Constitutional Status of Individuals",
        hook:"Being 'born into' a family club membership, citizenship by birth, is different from moving to a new town, applying, and eventually being accepted into the local club later in life, naturalisation. Both routes get a person genuinely in, just through very different doors, and Government as a subject expects you to know exactly which door leads where.",
        obj:["Explain the four ways of acquiring citizenship, using the correct technical terms","Distinguish citizenship by birth (jus soli) from citizenship by descent (jus sanguinis)","Explain how citizenship can be lost, not just gained","Explain the rights, duties and obligations that come with citizenship"],
        exp:[
          {t:"Ways to acquire citizenship", b:"Birth, descent, registration or naturalisation, different doors into the same destination: belonging to a state, the same way a person can join a family club by being born into it, being related to a member, formally registering, or later qualifying and applying."},
          {t:"jus soli vs jus sanguinis - the exact terms WAEC uses", b:"Citizenship by BIRTH (being born within a country's territory) is technically called jus soli, Latin for 'right of the soil'. Citizenship by DESCENT (having a parent who is already a citizen, regardless of where you're born) is called jus sanguinis, 'right of blood'. Nigeria's constitution actually uses descent quite broadly, a child born abroad to Nigerian parents is still Nigerian by descent, which is a distinct legal category from being born on Nigerian soil."},
          {t:"Citizenship can also be LOST, not just gained", b:"Most students only study how citizenship is acquired and forget it can also end. Renunciation is voluntary, a person formally gives up their citizenship, often to take on another country's. Deprivation is involuntary, the state strips citizenship, typically reserved for cases like fraud in the original naturalisation application or serious disloyalty such as treason. This is a genuinely testable angle WAEC uses to catch students who've only memorised the 'gaining' side."},
          {t:"Rights and duties - a two-way relationship", b:"Citizenship grants rights, like protection and participation, but also imposes duties, such as obeying laws and paying taxes, the same package deal that comes with genuine club membership rather than just being a visitor. The exam angle here: a right is something the STATE owes the citizen (protection, fair trial), while a duty is something the CITIZEN owes the state (taxes, national service) - confusing which direction an obligation flows is a common, avoidable error."}
        ],
        err:["Confusing naturalisation with citizenship by birth","Assuming citizenship carries rights but no responsibilities","Forgetting citizenship can be LOST through renunciation or deprivation, not just gained","Mixing up jus soli (birth) with jus sanguinis (descent) - soli sounds like 'soil', sanguinis relates to blood/family"],
        qs:[
          Q("Citizenship acquired automatically because a person is born within a country's territory is citizenship by",["birth","registration","naturalisation","marriage only"],0,"Citizenship by birth (jus soli) is based on place of birth.","Easy"),
          Q("A foreigner who fulfils legal requirements and is granted citizenship has acquired it by",["naturalisation","birth","descent","default"],0,"Naturalisation is the legal process by which a foreign national becomes a citizen.","Medium"),
          Q("A duty typically owed by citizens to their state includes",["obeying the law and paying taxes","exemption from all laws","unconditional political power","freedom from all civic responsibility"],0,"Citizenship comes with duties, not just rights.","Easy"),
          Q("Citizenship acquired through having a parent who is already a citizen, regardless of where the child is born, is technically known as citizenship by",["jus soli","jus sanguinis","naturalisation","registration"],1,"Jus sanguinis ('right of blood') is citizenship by descent through a parent.","Medium"),
          Q("The involuntary stripping of a person's citizenship by the state, typically for fraud or serious disloyalty, is known as",["renunciation","deprivation","naturalisation","registration"],1,"Deprivation is the state-initiated, involuntary loss of citizenship.","Hard"),
          Q("The basic human rights of citizens in a state include",["security for multi-national businesses","free social services, speech and religion","the right to life, liberty and property","freedom of movement only"],2,"Life, liberty and property are the classic core formulation of basic human/citizenship rights.","Medium",VP),
          Q("The underlying principle behind the concept of separation of powers is to",["increase the overall workload of government","preserve citizens' fundamental liberties by preventing arbitrariness by any single organ","eliminate the judiciary entirely","concentrate all power in the executive"],1,"Separation of powers exists mainly to prevent any one arm of government from acting arbitrarily, thereby protecting citizens' liberties.","Medium",VP),
          Q("One of the functions of the executive arm of government is the",["interpretation of laws passed by the legislature","maintenance of law and order","making of new laws","amendment of the constitution"],1,"Maintaining law and order is a core executive function, distinct from law-making (legislature) or interpretation (judiciary).","Medium",VP),
          Q("The judiciary's role as protector of citizens' rights is primarily demonstrated by its function of",["adjudicating disputes between arms of government, citizens and organisations","making laws for the country","enforcing tax collection","commanding the armed forces"],0,"The judiciary protects rights chiefly by fairly adjudicating disputes involving government, citizens, and organisations.","Medium",VP)
        ]
      },
      { id:"parties", name:"Political Parties and Party Systems",
        hook:"During a school election, one candidate's supporters wear matching badges, hand out flyers, and campaign as an organised team, while another candidate simply hopes people vote for him because they like him personally. The organised team, working together toward actually winning power and then governing, is closer to what a real political party does - whether a country allows just one legal team, two dominant ones, or several honestly competing, shapes how real that contest actually is.",
        obj:["Explain the full range of functions political parties perform, not just campaigning","Distinguish one-party, two-party and multi-party systems, with real country examples","Explain why one-party systems tend to reduce government accountability","Distinguish interest articulation from interest aggregation, a subtle but testable pair"],
        exp:[
          {t:"Functions of parties - the full list", b:"Political parties do far more than just campaign: they mobilise and represent citizens' interests, select and present candidates, educate voters on issues, form governments when they win, and act as a watchdog/opposition when they lose, holding the winning party accountable. That last function, opposition and accountability, is often what students forget, but it's central to why party systems matter at all."},
          {t:"Interest articulation vs interest aggregation - a subtle distinction", b:"Interest ARTICULATION is individual groups voicing their specific concerns (farmers wanting subsidies, teachers wanting better pay). Interest AGGREGATION is what parties specifically do: taking all those scattered, sometimes conflicting demands and combining them into one coherent policy platform a broad coalition of voters can support. A party that only articulates (repeats demands back) without aggregating (building a workable compromise) usually struggles to win broad elections."},
          {t:"Party systems, with real examples", b:"A one-party system has only one legal party, limiting real choice, examples include many African states in the decades just after independence, and China today. A two-party system is dominated by two major parties, the USA's Democrats and Republicans being the classic case. A multi-party system has several parties genuinely competing, common across much of Europe and in Nigeria's current Fourth Republic, where APC, PDP, Labour Party and others all field candidates."},
          {t:"Why one-party systems struggle with accountability", b:"Without a legal opposition able to genuinely contest power, there's no real electoral consequence for governing badly, elections become a formality rather than a genuine choice. This is precisely why WAEC essay questions on this topic often ask you to evaluate one-party systems: the standard, testable criticism isn't that they're automatically corrupt, it's that they remove the built-in incentive competitive systems create for good performance."}
        ],
        err:["Assuming a country with many registered parties automatically has real political competition","Confusing a party system with a single election result","Mixing up interest articulation (voicing a demand) with interest aggregation (combining demands into a workable platform)"],
        qs:[
          Q("A key function of political parties is to",["mobilise and represent citizens' interests in government","collect taxes directly","enforce court judgments","print currency"],0,"Parties aggregate and represent the interests of groups of citizens.","Easy"),
          Q("A political system where several parties genuinely compete for power is called a",["multi-party system","one-party system","military system","theocracy"],0,"Multi-party systems feature genuine competition among several parties.","Easy"),
          Q("A 'manifesto' refers to",["a political party's statement of policies and intentions","a court ruling","a national anthem","a type of tax"],0,"A manifesto outlines what a party promises to do if elected.","Easy"),
          Q("Taking scattered, sometimes conflicting demands from different groups and combining them into one coherent policy platform is known as",["interest aggregation","interest articulation","judicial review","electoral malpractice"],0,"Aggregation is specifically the combining of diverse demands into a workable platform, a core party function.","Hard"),
          Q("A commonly cited weakness of one-party systems is that they",["remove the electoral incentive for good government performance, since there is no real alternative to vote for","always lead to immediate economic collapse","are illegal under international law","cannot ever pass any legislation"],0,"Without genuine competition, there's less built-in consequence for poor governance.","Medium")
        ]
      },
      { id:"electoral", name:"The Electoral Process",
        hook:"Think about how your class picks a prefect: someone has to decide who's eligible to vote, candidates have to campaign under the same rules, votes have to be counted honestly by someone nobody suspects of favouritism, and that same neutral person has to announce the winner without any pressure from either side. Scale that whole process up to an entire country, and you have the electoral process.",
        obj:["Explain the meaning, types and purposes of elections","Identify features of a free and fair election and the role of an electoral commission"],
        exp:[
          {t:"Suffrage", b:"Suffrage just means the right to vote. 'Universal adult suffrage' means basically every adult citizen gets a vote, rather than voting being limited to a select few, like landowners in the past, or only certain 'popular' students being allowed a say in the class election."},
          {t:"Electoral commission", b:"It's the 'neutral referee' of the whole election, organising voting, counting results, and declaring winners independently of any one political party, the national equivalent of a trusted, unbiased teacher counting the class prefect votes instead of a friend of one candidate."}
        ],
        err:["Assuming an election is automatically democratic just because voting took place","Confusing the electoral commission's role with a political party's role"],
        qs:[
          Q("The right to vote in an election is known as",["suffrage","sovereignty","legitimacy","suffrage restriction"],0,"Suffrage is the legal right to participate in voting.","Easy"),
          Q("Which of these is a feature of a free and fair election?",["Independent monitoring and secret ballot","Only one candidate allowed to campaign","Results announced before voting ends","Voters told who to vote for by soldiers"],0,"Free and fair elections require transparency, independent oversight and genuine choice.","Medium"),
          Q("The body primarily responsible for organising and supervising elections is the",["Electoral Commission","Legislature","Judiciary","Central Bank"],0,"Electoral commissions are established specifically to run elections impartially.","Easy")
        ]
      },
      { id:"pressuregroups", name:"Pressure Groups and Public Opinion",
        hook:"A radio phone-in show flooded with callers all complaining about rising fuel prices is 'public opinion' in action, loud, widespread, but informal. The transport workers' union then organising an actual protest about those same fuel prices is a pressure group trying to convert that scattered public grumbling into real, organised pressure for change.",
        obj:["Distinguish pressure groups from political parties","Explain how public opinion is formed and measured"],
        exp:[
          {t:"Pressure groups", b:"Their goal is to influence decisions on a specific issue, like the transport union pushing back on fuel prices, without ever trying to become the government itself or contest an election."},
          {t:"Public opinion", b:"It's the collective view of a significant portion of the population on an issue, like the fuel price complaints flooding the phone-in show, often measured through polls, media commentary or public debate rather than through a formal vote."}
        ],
        err:["Assuming pressure groups always seek to win elections","Assuming public opinion can only be measured through formal polls"],
        qs:[
          Q("An example of a pressure group would be",["a trade union lobbying for workers' rights","the ruling political party","the national parliament","the judiciary"],0,"Trade unions represent specific interests without seeking to govern directly.","Medium"),
          Q("Public opinion is commonly measured through",["opinion polls and surveys","court rulings only","military reports","tax records"],0,"Polls and surveys are standard tools for gauging public opinion.","Easy"),
          Q("Unlike political parties, pressure groups mainly",["seek to influence government policy without contesting elections","always contest and win elections","form the government directly","have no interest in policy"],0,"Pressure groups lobby for specific interests but don't typically seek office.","Medium")
        ]
      },
      { id:"pubadmin", name:"Public Administration",
        hook:"Long after politicians finish campaigning, win, and get sworn in with much fanfare, it's the same civil service staff, quietly unaffected by who won, who actually process the paperwork, keep ministries running, and implement whatever policy the newly elected government decides on.",
        obj:["Explain the meaning and role of the civil service, including its principle of neutrality","Explain the meaning and purpose of public corporations and local government","Identify local government's main sources of funding"],
        exp:[
          {t:"Civil service", b:"These are the permanent, professional staff who implement government policy regardless of which party is currently in power, providing continuity between administrations the way a school's non-teaching staff keep the building running smoothly no matter which new principal is appointed."},
          {t:"Civil service neutrality - the specific defining principle", b:"A core, defining feature of the civil service is POLITICAL NEUTRALITY (sometimes called anonymity): civil servants are expected to serve whichever elected government is currently in power impartially, without publicly taking sides or campaigning for any party. This is precisely what allows a civil service worker who served one administration to continue serving, professionally and without conflict, once a completely different party wins the next election."},
          {t:"Public corporations", b:"A public corporation is a semi-autonomous business set up by an Act of Parliament to deliver essential services at a reduced cost, run a bit like a business but ultimately answerable to the public good rather than to shareholders chasing maximum profit."},
          {t:"Local government's sources of funding", b:"Local governments typically rely on three main funding sources: statutory allocation (a share of revenue distributed from the federal or state government), internally generated revenue (local rates, market fees, and levies collected directly), and grants (special, often one-off, funding for specific projects). Overdependence on statutory allocation, rather than building up internally generated revenue, is a commonly cited weakness of many local governments."}
        ],
        err:["Confusing the civil service with elected politicians","Assuming local government has unlimited independence from the centre","Forgetting political neutrality as the specific defining principle of civil service conduct","Naming only one source of local government funding when three distinct types exist"],
        qs:[
          Q("The body of permanent, professional government staff who implement policy regardless of the ruling party is the",["civil service","judiciary","electoral commission","opposition party"],0,"The civil service provides continuity of administration.","Easy"),
          Q("A public corporation is best described as",["a semi-autonomous business entity established by an Act of Parliament to provide essential services at a reduced cost","a private company owned by shareholders","a political party","a court of law"],0,"This matches the standard definition of a public corporation.","Medium",VP),
          Q("A key problem often associated with local government in many countries is",["inadequate funding and limited autonomy","excessive independence from the centre","too much revenue","absence of any responsibilities"],0,"Local governments commonly struggle with funding and limited autonomy.","Medium"),
          Q("The principle that civil servants should serve any elected government impartially, without publicly taking political sides, is known as",["political neutrality (or anonymity)","federalism","judicial review","separation of powers"],0,"Political neutrality allows civil servants to serve successive, differing governments professionally.","Medium"),
          Q("Which of the following is NOT typically a source of local government funding?",["Foreign direct investment in private companies","Statutory allocation from central government","Internally generated revenue (rates, fees, levies)","Grants for specific projects"],0,"Foreign direct investment in private companies is unrelated to local government funding sources.","Medium")
        ]
      },
      { id:"precolonial", name:"Pre-Colonial Political Systems",
        hook:"Before any colonial map was ever drawn across West Africa, a Yoruba town already had its Oba and council, a Hausa city already had its Emir, while an Igbo community nearby settled disputes through councils of elders and age-grade groups instead of a single ruler at all. Long before outsiders arrived, West Africa already had sophisticated, home-grown systems of governance, just organised in genuinely different ways from place to place.",
        obj:["Describe centralized and decentralized pre-colonial political systems in West Africa"],
        exp:[
          {t:"Centralized systems", b:"Groups like the Hausa/Fulani and Yoruba had structured hierarchies with recognised rulers, Emirs, Obas, and defined chains of authority beneath them, similar to a school with a clear principal and vice-principal structure."},
          {t:"Decentralized systems", b:"Groups like the Igbo often ran affairs through councils of elders and age-grade systems rather than a single central ruler, power was more spread out, closer to a school run by a rotating committee of respected senior students rather than one fixed head boy."}
        ],
        err:["Assuming all pre-colonial West African societies had a single monarch","Treating pre-colonial systems as identical across all ethnic groups"],
        qs:[
          Q("A pre-colonial political system with a clear, centralized ruler such as an Emir or Oba is best described as",["centralized","decentralized","confederal","socialist"],0,"Centralized systems have a clear, recognised single ruler.","Medium"),
          Q("The pre-colonial Igbo political system is often described as largely",["decentralized, relying on councils of elders","a single absolute monarchy","a one-party democracy","a military dictatorship"],0,"The Igbo system was generally decentralized, based on councils and age-grades.","Medium"),
          Q("Pre-colonial political systems in West Africa were generally organised around",["indigenous structures suited to each group's own traditions","constitutions copied directly from Europe","identical systems across all ethnic groups","no leadership structures at all"],0,"Each society developed its own indigenous governance structures.","Easy"),
          Q("Bureaucracy refers to",["the official routine and administrative procedures observed in carrying out functions in the civil service","a system of hereditary rule","a type of military government","an electoral voting system"],0,"Bureaucracy describes the formal, routine administrative procedures that run the civil service.","Medium",VP),
          Q("Which of the following is NOT a function of the Public Service Commission?",["Imposition of income tax on citizens","Recruitment of civil servants","Promotion of civil servants","Discipline of civil servants"],0,"The Public Service Commission handles civil service personnel matters; taxation is not within its remit.","Medium",VP)
        ]
      },
      { id:"colonial", name:"Colonial Administration",
        hook:"Ruling a vast territory from thousands of miles away, with no fast ships, phones or internet, forced colonial powers to choose a genuine strategy: send their own officials to govern every single local detail directly, or work through existing local rulers who already commanded real respect and knew the terrain.",
        obj:["Distinguish British indirect rule from French assimilation and association policies","Explain why indirect rule succeeded better in some parts of Nigeria than others","Explain the French shift from assimilation to the softer 'association' policy over time"],
        exp:[
          {t:"Indirect rule", b:"The British often governed through existing local chiefs and rulers, using them as the 'face' of colonial authority at the local level, since those rulers already had the community's trust and detailed local knowledge no distant official could match."},
          {t:"Why indirect rule worked unevenly across Nigeria", b:"Indirect rule worked reasonably well in Northern Nigeria, where centralised emirate systems already had a single recognised ruler the British could simply work through. It worked far more poorly in much of Igbo-land, where traditional authority was genuinely decentralised across many small communities with no single overall chief. The British response, appointing 'warrant chiefs' with authority the community never actually recognised, caused deep resentment and directly contributed to events like the 1929 Aba Women's Riot. This uneven fit is a specific, testable weakness of indirect rule as a strategy."},
          {t:"Assimilation, and its later softening into 'association'", b:"The French approach initially aimed to turn colonial subjects into full French citizens who adopted French culture and law directly, effectively replacing local systems rather than working through them. In practice this proved expensive and only ever applied to a small, educated elite (the 'evolues'). France later shifted toward 'association', a middle path that still centralised administrative control tightly from Paris, but worked more pragmatically alongside local elites rather than insisting on full cultural assimilation for everyone."}
        ],
        err:["Confusing indirect rule with assimilation","Assuming all colonial powers used identical administrative strategies","Assuming indirect rule worked equally well everywhere - it fit centralised societies (like Northern Nigeria's emirates) far better than decentralised ones (like much of Igbo-land)"],
        qs:[
          Q("The British colonial policy of governing through existing local rulers and chiefs was called",["indirect rule","assimilation","association","federation"],0,"Indirect rule used existing local structures under British oversight.","Medium"),
          Q("The French colonial policy aiming to turn subjects into French citizens adopting French culture was called",["assimilation","indirect rule","protectorate","trusteeship"],0,"Assimilation sought to integrate subjects fully into French culture and citizenship.","Medium"),
          Q("A key reason often given for European colonialism in Africa includes",["the desire for raw materials, markets and political prestige","a request from African rulers to be colonized","purely religious motives with no economic interest","random chance"],0,"Economic and political motives were central to colonial expansion.","Easy"),
          Q("One negative effect of colonialism on the people of West Africa over the years was the",["introduction of a modern idea of governance","creation of large political units cutting across ethnic lines","development of political institutions","change of the socio-political systems of living"],1,"Colonial boundaries often lumped diverse ethnic groups into single states, a widely cited negative effect.","Hard",VP),
          Q("A common practice found in the governance structure of the pre-independence constitutions of the British West African colonies was",["a system of full local government","unlimited franchise for all citizens","centralized power with no local input","state-directed social development programmes"],0,"British pre-independence constitutions commonly established local government structures across the colonies.","Hard",VP),
          Q("Indirect rule tended to work more smoothly in societies that",["already had centralised, recognised traditional rulers, such as Northern Nigeria's emirates","had no traditional leadership structures at all","were entirely urbanised","spoke only English"],0,"Indirect rule relied on an existing recognised local ruler to govern through, which fit centralised systems best.","Hard",VP),
          Q("The imposition of unrecognised 'warrant chiefs' in parts of decentralised Igbo-land contributed directly to",["the 1929 Aba Women's Riot","the founding of ECOWAS","the Berlin Conference of 1884","the Nigerian civil war of 1967"],0,"Resentment against warrant chiefs imposed without traditional legitimacy was a direct cause of the Aba Women's Riot.","Hard",VP)
        ]
      },
      { id:"nationalism", name:"Nationalism in West Africa",
        hook:"Before any West African country won independence, ordinary market traders, teachers and soldiers first had to genuinely start believing independence was even possible, whispered at first in small conversations before it grew into an open political demand. That gradual shift, from private doubt to public movement, is exactly what nationalism describes.",
        obj:["Distinguish proto-nationalism from post-World War II nationalism","Identify factors that fuelled nationalist movements"],
        exp:[
          {t:"Proto-nationalism", b:"Early, less organised resistance to colonial rule, often based on protecting specific local interests rather than a unified national movement, the whispered early conversations before the idea had fully caught on."},
          {t:"Post-WWII nationalism", b:"After World War II, nationalism grew stronger and more organised, returning soldiers who had fought abroad, new political parties, and a growing global anti-colonial mood all fuelled a much bigger, bolder push for independence."}
        ],
        err:["Assuming nationalism appeared suddenly with no earlier proto-nationalist roots","Overlooking the role of returning soldiers in post-war nationalism"],
        qs:[
          Q("Nationalism after the Second World War in West Africa was mainly characterised by",["stronger, more organised movements pushing for independence","complete disappearance of anti-colonial sentiment","a return to purely local, disorganised protest","total support for continued colonial rule"],0,"Post-war nationalism was more organised and widespread.","Medium"),
          Q("Early, less coordinated resistance to colonial rule before major organised nationalism is often called",["proto-nationalism","neo-colonialism","federalism","totalitarianism"],0,"Proto-nationalism describes earlier, less organised resistance.","Medium"),
          Q("A key factor that fuelled growing nationalism after World War II was",["the experiences and expectations of returning African soldiers","a total absence of political parties","stronger colonial military presence only","reduced global attention to colonialism"],0,"Returning soldiers brought new expectations that fuelled nationalist sentiment.","Medium")
        ]
      },
      { id:"nigeria", name:"Constitutional Developments (Pre- and Post-Independence)",

          {t:"Pre-independence constitutions", b:"Constitutions like the Richards (1946) and Macpherson (1951) constitutions gradually introduced more Nigerian representation and regional structure before full independence, small but deliberate steps rather than one sudden leap."},
          {t:"Post-independence constitutions", b:"The 1960 Independence Constitution, the 1963 Republican Constitution, which removed the British monarch as head of state, and later the 1979 and 1999 Constitutions each reshaped Nigeria's system of government further, the training wheels coming off in stages."}
        ],
        err:["Treating all pre-independence constitutions as identical","Confusing the 1960 Independence Constitution with the 1963 Republican Constitution"],
        qs:[
          Q("Nigeria gained independence from British colonial rule in",["1960","1963","1970","1954"],0,"Nigeria became independent on 1 October 1960.","Easy"),
          Q("Nigeria became a republic, removing the British monarch as head of state, in",["1963","1960","1979","1999"],0,"Nigeria became a republic in 1963.","Medium"),
          Q("Nigeria's current (Fourth) Republic, based on the 1999 Constitution, began with",["the return of civilian rule in 1999","the 1960 independence ceremony","continued military rule","a monarchy being restored"],0,"The Fourth Republic began with civilian rule in 1999.","Medium")
        ]
      },
      { id:"partyhistory", name:"Development of Major Political Parties",
        hook:"Ask an elderly relative from the West which party their grandparents supported around independence, and an elderly relative from the North the same question, and you'll likely get two very different answers, not by accident, but because Nigeria's earliest major parties formed heavily around specific regions rather than one shared national identity, a pattern that still quietly echoes in political alignment today.",
        obj:["Describe the formation, objectives and challenges of early major political parties"],
        exp:[
          {t:"Early parties", b:"Parties such as the NCNC, Action Group (AG) and Northern People's Congress (NPC) each drew much of their support from a particular region, shaping Nigeria's early party politics along regional lines, exactly the pattern that surfaces when you ask two grandparents from different regions the same question."},
          {t:"Achievements & failures", b:"These parties helped organise the push toward independence and self-government, but their strong regional bases also contributed to political tension between regions, tension that didn't simply disappear once independence was won."}
        ],
        err:["Assuming Nigeria's earliest parties were organised around national ideology rather than region","Overlooking the tensions this regional basis created"],
        qs:[
          Q("Nigeria's earliest major political parties were largely organised around",["regional and ethnic bases of support","a single unifying national ideology","religious denominations only","foreign-controlled agendas"],0,"Early parties drew support along regional/ethnic lines.","Medium"),
          Q("A key achievement of early Nigerian political parties was",["mobilising support for self-government and independence","preventing independence entirely","abolishing all elections","merging into one party voluntarily"],0,"They played a key role in the push for independence.","Medium"),

      { id:"militaryrule", name:"Military Rule",

      { id:"fedunitary_wa", name:"Federal/Unitary Systems in West Africa",

        exp:[

      { id:"foreignpolicy", name:"Foreign Policies",
        hook:"When a new principal takes over a school, one of their first real decisions is how to treat neighbouring schools, as rivals to out-compete, or as partners to collaborate with on shared events. A country's foreign policy is basically the exact same kind of strategic decision, just scaled up: its strategy for how it wants to be treated, and how it plans to treat others, on the world stage.",
        obj:["Explain the meaning and determinants of foreign policy","Identify advantages and disadvantages of foreign policy choices","Distinguish foreign policy objectives from the specific instruments used to pursue them","Name Nigeria's specific, historically stated foreign policy principles"],
        exp:[
          {t:"Meaning & factors", b:"Foreign policy covers a country's guiding principles in dealing with other nations, shaped by factors like economic interests, historical ties, geography and security concerns, the national version of the new principal weighing up history and resources before deciding how to treat the school next door."},
          {t:"Objectives vs instruments - a distinction WAEC tests directly", b:"Foreign policy OBJECTIVES are the goals a country wants to achieve (national security, economic prosperity, regional leadership). INSTRUMENTS are the specific tools used to actually pursue those goals: diplomacy and negotiation, economic aid or sanctions, treaties and alliances, and in extreme cases, military action. A common exam trap is listing an instrument (like 'diplomacy') when asked for an objective, or vice versa, since they answer different questions: WHAT you want versus HOW you get it."},
          {t:"Nigeria's specific stated foreign policy principles", b:"Nigeria's foreign policy has historically rested on named, specific pillars: Africa as the centrepiece of foreign policy (Afrocentrism, prioritising African affairs and unity above all else), respect for the sovereignty and territorial integrity of other states, non-alignment (refusing to fully side with either bloc during the Cold War), promotion of African unity and decolonisation, and peaceful settlement of international disputes. These named principles are specific, quotable content WAEC directly tests, not just general goodwill."},
          {t:"Advantages & disadvantages", b:"A strong foreign policy can attract investment, aid and alliances, the way a collaborative principal might attract joint sponsorships, but can also draw a country into costly commitments or conflicts if poorly managed."}
        ],
        err:["Assuming foreign policy is fixed and never changes","Overlooking economic interests as a driver of foreign policy","Confusing a foreign policy OBJECTIVE (the goal) with an INSTRUMENT (the tool used to pursue it)","Forgetting the specific named principles of Nigerian foreign policy, like Afrocentrism and non-alignment"],
        qs:[
          Q("A country's foreign policy is best described as",["its guiding principles and strategy for relations with other nations","its internal tax policy only","a purely military document","a policy that never changes over time"],0,"Foreign policy guides a country's relations with others.","Easy"),
          Q("A key factor shaping a country's foreign policy is often its",["economic interests and historical ties","choice of national anthem","school curriculum","local government boundaries"],0,"Economic and historical factors strongly shape foreign policy.","Medium"),
          Q("A potential disadvantage of an overly ambitious foreign policy is that it may",["draw a country into costly conflicts or commitments","guarantee permanent peace","eliminate the need for diplomacy","have zero economic cost"],0,"Ambitious foreign commitments can carry real costs and risks.","Medium"),
          Q("The process of international integration arising from the inter-change of world views, products, ideas and other aspects of culture is known as",["national interest","globalization","geopolitics","interest aggregation"],1,"This is the standard definition of globalization.","Medium",VP),
          Q("West African states should take the determination of foreign policy seriously mainly in order to",["enhance regional cooperation","reduce cultural diversity","reduce economic and market dependency entirely","increase dependency on foreign aid"],0,"Careful foreign policy determination helps states build stronger regional cooperation.","Hard",VP),

          Q("Diplomacy, economic aid, treaties and (in extreme cases) military action are all examples of foreign policy",["instruments, the specific tools used to pursue a country's goals","objectives, the actual goals themselves","constitutions","electoral systems"],0,"These are the tools (instruments) used to pursue foreign policy objectives, not the objectives themselves.","Hard"),
          Q("Nigeria's foreign policy has historically named which of the following as its 'centrepiece'?",["Africa","Europe","The United Nations Security Council","The Commonwealth"],0,"Nigeria's foreign policy has long stated Africa as the centrepiece, prioritising African affairs and unity.","Medium",VP)

      { id:"intlorgs_gov", name:"International Organizations (UNO, OAU, Commonwealth, ECOWAS)",
        hook:"No single West African country can tackle regional trade, peacekeeping or global diplomacy entirely alone, the same way no single class in a large school can organise an inter-school sports competition without coordinating with every other class first. That's exactly why groups like ECOWAS and the United Nations exist: strength and coordination in numbers.",
        obj:["Explain the aims and functions of the UNO, OAU/AU, Commonwealth and ECOWAS"],
        exp:[
          {t:"UNO & OAU/AU", b:"The United Nations aims to maintain global peace and cooperation among all member states worldwide; the Organization of African Unity, now the African Union, was formed specifically to promote unity and cooperation among African states at a continental level."},
          {t:"The UN Security Council's veto power - a specific, testable feature", b:"Within the UN, the Security Council has five PERMANENT members (the USA, UK, France, Russia and China) who each hold a VETO, the power to single-handedly block any Security Council resolution, regardless of how every other member votes. This specific feature is frequently cited as a structural weakness of the UN, since it means the world's most powerful states can block collective action even when the vast majority of the world disagrees with them."},
