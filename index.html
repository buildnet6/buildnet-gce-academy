      { id:"prose", name:"Non-African Prose: To Kill a Mockingbird & Path of Lucas",
        summary:[
          {t:"To Kill a Mockingbird - the full story", b:"Scout Finch, a young girl in the small, racially segregated town of Maycomb, Alabama during the Great Depression, narrates two eventful years of her childhood alongside her older brother Jem and their friend Dill. Their widowed father, Atticus Finch, a principled small-town lawyer, is appointed to defend Tom Robinson, a Black man falsely accused of assaulting a white woman, Mayella Ewell. Atticus takes the case seriously and defends Tom properly despite fierce backlash from much of the white community, who consider it shameful for a white lawyer to genuinely try to win a case for a Black defendant. Through the trial, Scout and Jem are exposed for the first time to the deep, ugly racism running through their town's justice system, watching as clear evidence of Tom's innocence is ultimately overridden by an all-white jury's prejudice, and Tom is convicted anyway. Tom is later shot dead attempting to escape prison, a tragic waste that devastates the Finch family and crystallises the novel's argument about the human cost of racial injustice. Running alongside the trial is a second, quieter story about Boo Radley, a reclusive neighbour the children have always feared based on local rumour and their own overactive imaginations, but who turns out, by the novel's end, to be gentle and protective, ultimately saving Jem and Scout's lives from a violent attack. Both Tom and Boo function as 'mockingbirds' in the novel's own terms, innocent figures harmed or misjudged despite having done nothing wrong, and the title's central image ties the two storylines together into one argument about prejudice, innocence, and moral courage."},
          {t:"Path of Lucas - the full story", b:"Lucas Clarkson narrates his own life story out loud while sitting beside the hospital bed of his daughter Lucy, who lies in a coma following a serious car accident, hoping that somehow she can still hear him. Told in a non-chronological, circling structure that moves back and forth across different periods of his life, the novel gradually reveals Lucas's journey: his upbringing on his family's farm, his marriage to Isabelle, and the heavy toll of caring for her after she develops a severe psychotic depression that Lucas refuses to have institutionalised, choosing instead to care for her himself at great personal cost. Along the way, Lucas is forced to abandon his own dream of becoming a certified mechanic in order to keep his family and the family farm afloat, while his close friend Steve goes on to become a pilot, a path Lucas quietly wishes could have been more like his own. The novel, closely based on the real life of the author's own father, builds a portrait of a man whose heroism is entirely quiet and unglamorous, made up of years of unnoticed sacrifice rather than any single dramatic act. As Lucas's narration eventually catches up to the present moment at Lucy's bedside, the novel closes on the question of whether his lifetime of sacrifice will be rewarded with his daughter's recovery, leaving readers with a meditation on endurance, sacrifice and hope in the face of circumstances entirely outside one's control."}
        ],
        hook:"Imagine watching a courtroom drama through the eyes of a curious 8-year-old who doesn't fully understand the adult world's unfairness yet - that puzzled, innocent viewpoint is exactly how Harper Lee tells 'To Kill a Mockingbird' through young Scout. 'Path of Lucas: The Journey He Endured', the other prescribed option, follows an entirely different protagonist through its own kind of hardship. Whichever one your class actually studied, WAEC only ever asks about that single text - so mixing details between the two on exam day is a mistake that's completely avoidable with careful, focused revision.",
        obj:["Discuss themes in the studied Non-African Prose text","Analyse the narrative perspective used in the studied novel"],
        exp:[
          {t:"To Kill a Mockingbird (Harper Lee)", b:"Scout Finch is only about six years old when her father Atticus, a small-town Alabama lawyer, takes on the legal defence of Tom Robinson, a Black man falsely accused of assaulting a white woman. Told entirely through young Scout's eyes, the novel uses her growing confusion and eventual understanding of her town's racism to force readers to see clearly what many adults have simply learned to look past. Atticus's quiet insistence on defending Tom properly, whatever it costs his family's standing in town, makes him one of literature's most famous models of moral courage."},
          {t:"Path of Lucas (Susanne Bellefeuille)", b:"Lucas Clarkson tells his life story out loud, sitting beside the hospital bed of his daughter Lucy, who lies in a coma after a car accident. As he talks, the novel loops back through his own life - his marriage to Isabelle, who later suffers a severe psychotic breakdown he refuses to institutionalise her for, his abandoned dream of becoming a certified mechanic, and the string of sacrifices he makes to hold his family together. Based closely on the real experiences of the author's own father, the novel argues that quiet, everyday sacrifice can be its own form of heroism."},
          {t:"Scout's narration", b:"A child narrator is like watching a movie through a slightly foggy lens - some things are seen clearly, others misunderstood, and that gap is part of the story's power."}
        ],
        err:["Treating a child narrator's account as fully objective","Mixing up details between the two prescribed Non-African Prose options"],
        qs:[
          Q("'To Kill a Mockingbird' is narrated from the point of view of",["Scout Finch, a young girl","Atticus Finch, a lawyer","Tom Robinson, the accused","An unnamed adult narrator"],0,"The novel is narrated by Scout, recalling her childhood.","Easy"),
          Q("Atticus Finch defends Tom Robinson mainly to demonstrate",["moral courage and a commitment to justice","a desire for fame in the town","personal financial gain","revenge against his neighbours"],0,"Atticus takes the case despite social pressure, upholding his principles.","Medium"),
          Q("The 'mockingbird' in the title is a symbol for",["innocent characters who are harmed despite doing no wrong","the town of Maycomb itself","the legal system as a whole","Scout's teacher"],0,"Both Tom Robinson and Boo Radley are 'mockingbirds' harmed despite their innocence.","Hard"),
          Q("'Path of Lucas: The Journey He Endured' is written by",["Susanne Bellefeuille","Harper Lee","Pede Hollist","Elma Shaw"],0,"Susanne Bellefeuille is the author of this Non-African Prose option.","Easy"),
          Q("'Path of Lucas' is narrated by Lucas as he sits beside",["his comatose daughter Lucy's hospital bed","his dying father's bedside","his wife's hospital bed","his own hospital bed"],0,"Lucas tells his life story to Lucy as she lies in a coma.","Medium"),
          Q("Lucas's most defining sacrifice in the novel involves giving up his dream of becoming a",["certified mechanic","lawyer","doctor","pilot"],0,"Lucas abandons his mechanic ambitions to care for his family and his father's farm - his friend Steve becomes the pilot instead.","Medium")
        ]
      },
      { id:"legacydrama1", name:"Extra Practice - Drama: A Midsummer Night's Dream & Look Back in Anger",
        legacy:true,

        obj:["Practise identifying speaker, addressee and situation in a Shakespearean context question","Practise reasoning through unfamiliar Shakespearean language using plot logic","Practise character and theme questions on class conflict in a realist play"],
        exp:[
          {t:"Context questions work the same on any play", b:"Whether it's this play or your actual set text, WAEC's context questions always ask the same three things: who is speaking, who are they speaking to, and what does this moment reveal? Practising that skill here transfers directly."},
          {t:"The plot in brief", b:"Two pairs of Athenian lovers (Hermia/Lysander and Helena/Demetrius) flee into a forest, where fairy mischief from Puck and Oberon scrambles who loves whom, before everything resolves happily."},
          {t:"Look Back in Anger (John Osborne)", b:"Jimmy Porter, a bitter, university-educated young man running a sweet-stall, is married to Alison, whose comfortable upper-middle-class background he resents deeply. Jimmy repeatedly attacks Alison's family, especially her mother, for their snobbery and privilege, while Alison typically endures his tirades passively, quietly continuing her ironing rather than fighting back. The strain eventually drives Alison away, encouraged by her visiting friend Helena, though the marriage's stormy cycle continues. Themes: class conflict, the frustration of post-war young men without real outlets for their anger, the corrosive effect of resentment on intimacy."}

        err:["Trying to memorise this play as if it were examinable - it is not on your current syllabus","Missing that a character's own words can be biased or mistaken about the situation"],
        qs:[
          Q("In the extract beginning 'The wildest hath not such a heart as you,' the speaker is",["Egeus","Lysander","Helena","Titania"],2,"Helena speaks these lines to Demetrius, comparing his cruelty unfavourably to wild beasts.","Medium",VP_LEGACY),
          Q("In that same extract, the addressee is",["Demetrius","Hermia","Oberon","Puck"],0,"Helena is addressing Demetrius, who has been rejecting and insulting her.","Medium",VP_LEGACY),
          Q("In the line 'The wildest hath not such a heart as you,' 'the wildest' refers to",["good people","the least cruel man","wild beasts","the most deceptive spirit"],2,"Helena argues even a wild beast has more heart/mercy than Demetrius is showing her.","Hard",VP_LEGACY),
          Q("Hermia and Lysander go into the wood mainly because",["it is their favourite spot","they are fleeing a harsh Athenian law forcing Hermia to marry Demetrius","they want privacy","the wood is considered romantic"],1,"Athenian law would have forced Hermia to marry Demetrius or face severe punishment, so the couple flees.","Medium",VP_LEGACY),
          Q("After Hermia confides her escape plan to her, Helena soon decides to",["keep the secret loyally","betray Hermia by telling Demetrius","join the couple in exile","report the plan to Theseus"],1,"Helena tells Demetrius hoping to win his gratitude and affection, which sets off the play's forest chaos.","Hard",VP_LEGACY),
          Q("In John Osborne's 'Look Back in Anger', Jimmy Porter is best characterised by his",["bitter resentment of the class privilege enjoyed by his wife's family","eager desire to join the upper class himself","complete indifference to social class","warm admiration for his father-in-law Colonel Redfern"],0,"Jimmy's anger is fuelled by deep resentment of the class privilege and 'sponginess' he perceives in Alison's upper-middle-class background.","Medium",VP_LEGACY),
          Q("Alison's typical reaction to Jimmy's verbal attacks on her family is to",["calmly endure them, often continuing her ironing rather than fighting back","immediately leave him after the very first attack","attack his own family in return","report him to the authorities"],0,"Alison largely absorbs Jimmy's tirades passively, a pattern that only breaks later with Helena's encouragement.","Medium",VP_LEGACY)

      { id:"legacydrama3", name:"Extra Practice - African Drama: Let Me Die Alone & The Lion and the Jewel",
        legacy:true,
        hook:"Two previous-cycle African plays that make an excellent contrasting pair: one is a serious historical tragedy about a real queen's rise to power, the other a comic clash between tradition and Western-style 'modernity' in a Yoruba village - both classic WAEC territory for theme and character questions.",
        obj:["Practise theme questions on power, gender and tradition in African drama","Practise character-contrast questions between a traditionalist and a self-styled moderniser"],
        exp:[
          {t:"Let Me Die Alone (John Kolosa Kargbo)", b:"Based on the real historical Madam Yoko, the play follows Chief Gbanya of the Mende people, who promises during an intimate moment to eventually hand his chieftaincy to his wife Yoko rather than a male heir. After British Governor Rowe publicly humiliates and flogs Gbanya over a political dispute, Gbanya's brother-in-law Lamboi and the medicine man Musa poison him, fearing a woman ruler. Gbanya's dying wish still names Yoko as his successor, and she goes on to become a powerful real historical chief, joining the women's Sande society to consolidate her authority. Themes: gender and power, colonial interference in African leadership, betrayal."},
          {t:"The Lion and the Jewel (Wole Soyinka)", b:"In a Yoruba village, the young, Western-educated schoolteacher Lakunle wants to marry the beautiful Sidi without paying the traditional bride price, seeing the custom as backward. Meanwhile Baroka, the village's shrewd, aging Bale (chief), schemes to win Sidi for himself, using his clever aide Sadiku to lower Sidi's guard. Sidi initially mocks the wrinkled Baroka, favouring the modern Lakunle, but Baroka triumphs anyway through cunning, not force. Themes: tradition versus superficial modernity, the gap between claiming progress and actually understanding it."}
        ],
        err:["Assuming 'modern' Lakunle is automatically the play's hero simply for opposing tradition","Missing that Yoko's story is based on a real historical figure, not a purely fictional invention"],
        qs:[
          Q("In 'Let Me Die Alone', Chief Gbanya promises to eventually hand his chieftaincy to",["his wife Yoko","his brother-in-law Lamboi","the British Governor","his son"],0,"Gbanya promises Yoko the chieftaincy during an intimate moment, a promise that drives the play's central conflict.","Medium",VP_LEGACY),
          Q("Chief Gbanya is ultimately killed by",["poison administered by Lamboi and Musa","a battle wound","Governor Rowe's soldiers","an accident while hunting"],0,"Fearing a woman ruler, Lamboi and the medicine man Musa poison Gbanya.","Medium",VP_LEGACY),
          Q("'Let Me Die Alone' is based on the real historical figure of",["Madam Yoko, a Mende chief in Sierra Leone","Queen Amina of Zazzau","Yaa Asantewaa of Ashanti","Moremi of Ile-Ife"],0,"The play dramatises the real life of Madam Yoko, a 19th-century Mende paramount chief.","Medium",VP_LEGACY),
          Q("In 'The Lion and the Jewel', Lakunle refuses to pay Sidi's bride price mainly because he",["considers the custom backward and unnecessary in modern times","cannot afford it","has already paid it secretly","is forbidden to by his family"],0,"Lakunle sees himself as modern and educated, rejecting the bride price as an outdated tradition.","Medium",VP_LEGACY),
          Q("Baroka ultimately wins Sidi over through",["cunning and strategy, aided by Sadiku, rather than force","a duel with Lakunle","paying an enormous bride price","kidnapping her"],0,"Baroka's victory comes from clever scheming, not physical force or wealth alone.","Medium",VP_LEGACY),
          Q("A recurring view expressed by the men in 'Let Me Die Alone', including Gbanya and Lamboi, is that",["women are unfit to rule and should focus on domestic and physical roles instead","women should be given full military command","only women can be trusted with the chieftaincy","tradition required a queen to rule alongside a king"],0,"Gbanya, Lamboi and Ndapi repeatedly voice the belief that a woman is unsuited to lead the chiefdom, valuing Yoko mainly for her body and dancing instead.","Hard",VP_LEGACY)

      { id:"basic", name:"Definition and Scope of Economics",
        hook:"Fifteen-year-old Kelvin has exactly ₦2,000 in his pocket on the way home from school, and the okada stand and the suya stand are both calling his name - but he only has enough for one. Whichever he picks, the thing he didn't choose is his opportunity cost, not the naira he spent, but the suya or the ride he gave up instead. Multiply Kelvin's small daily dilemma by an entire nation deciding how to spend its budget, and you've got the exact same basic problem economics exists to study.",

        exp:[
          {t:"Scarcity", b:"Scarcity isn't about being poor - even the richest country on Earth can't have unlimited amounts of everything at once, the same way even a wealthy classmate still can't be in two places after school at the same time. It just means wants are endless but resources, including time and money, are not."},
          {t:"Opportunity cost", b:"It's the 'road not taken' - when Kelvin picks the suya, the opportunity cost isn't the ₦500 he spent, it's the okada ride home he gave up instead. Every choice, however small, quietly has one of these attached."},
          {t:"Economic activities", b:"Production makes goods, like the suya seller grilling meat; distribution moves them to where they're needed, like Kelvin walking to the stand; and consumption is actually using them up, Kelvin eating it. Every job in the economy fits somewhere in this same three-step chain."}

      { id:"systems", name:"Types and Basic Features of Economic Systems",

      { id:"consumer", name:"Theory of Consumer Behaviour",
        hook:"Amara's mum buys her a plate of jollof rice after a long school day, and the first few spoonfuls taste incredible - but by the last few, she's eating mostly out of habit rather than real enjoyment, and would honestly rather stop. That shrinking satisfaction with every extra spoonful, even though the rice itself hasn't changed, is exactly what economists mean by diminishing marginal utility.",
        obj:["Explain total and marginal utility with numerical examples","Relate the law of diminishing marginal utility to the shape of the demand curve","State and apply the condition for consumer equilibrium across multiple goods","Explain the water-diamond paradox and why it puzzled economists for over a century"],
        exp:[
          {t:"Total vs marginal utility", b:"Total utility is Amara's overall satisfaction from the whole plate so far; marginal utility is the EXTRA satisfaction from just the next spoonful, and it usually shrinks the more she's already eaten, even while her total satisfaction keeps climbing a little. If you plotted it, total utility keeps rising (just more slowly) while marginal utility keeps falling, and can even turn negative if she genuinely overeats."},
          {t:"Diminishing marginal utility", b:"This is the 'law of the last spoonful' - as a person consumes more of something, each additional unit generally brings less extra satisfaction than the one before, exactly why nobody enjoys their tenth spoonful of rice as much as their first. This single idea is the real foundation underneath why demand curves slope downward: since each extra unit is worth less to you, you'll only buy more of it if the price also drops to match that shrinking value."},
          {t:"Consumer equilibrium - how a rational buyer splits limited money", b:"A consumer with a fixed income and multiple things to buy (say, rice and meat) reaches equilibrium when the marginal utility per naira spent is EQUAL across every good they buy - MUrice/Price of rice = MUmeat/Price of meat. If rice were giving more extra satisfaction per naira than meat, a rational consumer would simply buy more rice and less meat until the two ratios balance out. This equalising condition is the formal, testable version of 'spending your money wisely'."},
          {t:"The water-diamond paradox - a genuine historical puzzle", b:"Adam Smith himself was stumped by this: water is essential to life yet nearly free, while diamonds are practically useless yet extremely expensive. The resolution came from marginal thinking, not total value: water is so abundant that the MARGINAL unit (one more cup) is barely worth anything to you, while diamonds are so scarce that even one more unit still carries huge marginal value. Price tracks marginal utility, not how essential something is overall - a distinction that trips up almost every student encountering it for the first time."}
        ],
        err:["Confusing total utility (which keeps rising) with marginal utility (which falls)","Assuming diminishing marginal utility means total satisfaction falls too","Believing a good's price reflects how essential or useful it is overall, rather than its marginal (extra-unit) value","Forgetting that consumer equilibrium compares utility PER NAIRA spent, not raw utility totals between goods"],
        qs:[
          Q("The law of diminishing marginal utility states that as a person consumes more units of a good,",["the extra satisfaction from each additional unit tends to fall","total satisfaction always falls","price must rise continuously","supply automatically increases"],0,"Diminishing marginal utility describes falling EXTRA satisfaction per additional unit.","Medium"),
          Q("'Marginal utility' refers to",["the additional satisfaction gained from consuming one more unit of a good","the total cost of a good","the average price of a good over a year","the government's tax revenue"],0,"Marginal utility is the extra satisfaction from one more unit.","Easy"),
          Q("As marginal utility from a good falls, a consumer is generally",["only willing to pay a lower price for more units","willing to pay a higher price for more units","completely indifferent to price","required by law to stop buying"],0,"Falling marginal utility explains why demand curves slope downward.","Hard"),
          Q("A consumer reaches equilibrium when spending across two goods X and Y when",["marginal utility per naira spent on X equals marginal utility per naira spent on Y","total utility from X equals total utility from Y","the price of X equals the price of Y","all income is spent on a single good"],0,"Equilibrium requires MUx/Px = MUy/Py, not equal total utilities or equal prices.","Hard"),
          Q("The water-diamond paradox is best resolved by understanding that",["price reflects marginal utility, and water's abundance makes its marginal unit worth very little despite its overall importance","water is actually worth more than diamonds in every market","diamonds have no real utility at all","total utility, not marginal utility, determines price"],0,"Water's abundance drives its marginal utility (and price) down, despite its high total usefulness; diamonds' scarcity keeps their marginal utility high.","Hard")
        ]

      { id:"demand", name:"Demand",
        hook:"Every year, right before Christmas, the price of chicken at Ngozi's local market creeps up day by day, not because chicken suddenly became harder to raise, but because suddenly everyone wants one at the same time. That rush in buyer appetite, pushing price upward purely through demand, is exactly what economists study under this topic.",
        obj:["Explain the law of demand and its full list of determinants","Distinguish a shift of the demand curve from a movement along it","Explain what 'ceteris paribus' means and why economists rely on it constantly","Distinguish normal goods from inferior goods, and explain the rare Giffen good exception"],
        exp:[
          {t:"Law of demand", b:"When garri suddenly gets expensive, fewer people buy as much of it, price and quantity demanded usually move in opposite directions, the same inverse relationship behind Ngozi's pricier Christmas chicken."},
          {t:"'Ceteris paribus' - the phrase behind every demand law", b:"This Latin phrase means 'other things being equal' or 'all else unchanged', and it's doing more work than students realise. The law of demand only holds ceteris paribus: if price rises AND income rises AND a festival hits all at once, quantity demanded might actually increase despite the higher price, not because the law is wrong, but because 'other things' didn't stay equal. Every demand and supply law taught in this syllabus implicitly carries this same hidden condition."},
          {t:"Determinants of demand, the full list", b:"Beyond price itself: income (more income usually means more buying), tastes and preferences, the price of related goods (substitutes and complements), population size, and expectations about future prices (if people expect fuel prices to rise next week, they buy more today). WAEC often wants the FULL list here, not just one or two examples."},
          {t:"Normal vs inferior goods - and the Giffen exception", b:"A NORMAL good sees demand rise as income rises (better rice as you earn more). An INFERIOR good sees demand FALL as income rises, because people switch away from it once they can afford better alternatives (a very cheap starch staple people move away from as they get wealthier). A Giffen good is a rare, extreme case of an inferior good where a PRICE RISE actually increases quantity demanded, the one genuine exception to the law of demand, because the good is such a huge part of a poor household's budget that a price rise effectively makes them poorer, forcing them to buy even MORE of that cheap staple and cut other spending instead."},
          {t:"Shifts vs movements", b:"A price change slides you along the SAME demand curve, like chicken prices ticking up as Christmas approaches. A change in something else, income, taste, a festival on the calendar, actually moves the WHOLE curve to a new position, which is why demand for chicken spikes every December regardless of its price that week."}
        ],
        err:["Confusing a shift of the curve with a movement along it","Assuming price is the only determinant of demand","Forgetting the law of demand only holds 'ceteris paribus' - other things being equal","Mixing up inferior goods (demand falls as income rises) with Giffen goods (demand rises as PRICE rises, a much rarer, more extreme case)"],
        qs:[
          Q("According to the law of demand, as price rises, quantity demanded generally",["falls, other things being equal","rises","stays the same","becomes infinite"],0,"Demand and price are inversely related, ceteris paribus.","Easy"),

          Q("Which of these would most likely cause the ENTIRE demand curve for a good to shift, rather than just a movement along it?",["A rise in consumers' income","A fall in the good's own price","A rise in the good's own price","No change in any factor"],0,"A change in income shifts the whole curve; only a change in the good's own price causes a movement along it.","Medium"),
          Q("Price(₦): 10, 20, 30, 40 with quantity demanded 50, 35, 20, 5 and quantity supplied 25, 35, 45, 55 respectively. At what price is excess supply equal to 25?",["₦10","₦20","₦30","₦40"],2,"At ₦30, supply(45) minus demand(20) = 25, the excess supply asked for.","Medium",VP),
          Q("If the quantity demanded of a commodity increases from 20 units to 30 units when price increases from ₦4.00 to ₦5.00, the elasticity of demand is",["0.50","0.65","2.00","2.50"],2,"Percentage change in quantity (50%) divided by percentage change in price (25%) gives 2.00.","Hard",VP),
          Q("Two goods that have joint demand, meaning one is typically used together with the other, such as bread and butter, are known as",["complementary goods","substitute goods","inferior goods","normal goods"],0,"Complementary goods are consumed jointly, so demand for one rises alongside demand for the other.","Medium",VP),
          Q("Goods that can be used in place of one another, such that a rise in the price of one increases demand for the other, are called",["substitute goods","complementary goods","giffen goods","luxury goods"],0,"Substitute goods compete for the same need, so consumers switch toward the cheaper one.","Medium",VP),
          Q("The phrase 'ceteris paribus', frequently used alongside the law of demand, means",["other things being equal, or unchanged","the price is always rising","supply always exceeds demand","demand is perfectly elastic"],0,"Ceteris paribus is the Latin phrase meaning 'other things being equal', a condition underlying most demand and supply laws.","Medium"),
          Q("A Giffen good is unusual because",["a rise in its price actually leads to an increase in the quantity demanded, unlike ordinary goods","its demand is completely unaffected by price","it is always a luxury good","its supply curve slopes downward"],0,"Giffen goods are a rare exception to the law of demand, where higher prices paradoxically increase quantity demanded due to the good's dominant share of a poor household's budget.","Hard")
        ]

      { id:"supply", name:"Supply",
        hook:"After an unusually good rainy season, farmers near Kwame's village suddenly have far more maize to sell than expected, and traders start offering slightly lower prices simply because there's so much of it available at once. That flood of maize hitting the market, purely because growing conditions changed, is supply responding to something other than price.",
        obj:["Explain the law of supply and its full list of determinants","Distinguish a shift of the supply curve from a movement along it","Explain price elasticity of supply and why it differs across goods","Explain why supply often responds differently in the short run versus the long run"],
        exp:[
          {t:"Law of supply", b:"As price rises, producers are usually willing to supply more, because higher prices make it more worthwhile to produce and sell extra units, though in Kwame's village's case, an unusually good harvest increased supply even before any price change happened."},
          {t:"Determinants of supply, the full list", b:"Input/production costs, technology, weather (as in Kwame's village), the price of related goods (a farmer growing yam might switch land to cassava if cassava prices rise), the number of sellers in the market, and government policy (taxes discourage supply, subsidies encourage it) can all shift how much producers are willing to supply, entirely separate from the good's own price. WAEC often expects the FULL list here, not just one or two examples."},

      { id:"pricedet", name:"Theory of Price Determination",
        hook:"In a busy Saturday market, no single trader gets to simply announce the price of tomatoes and have everyone obey - instead, haggling between dozens of buyers and sellers gradually settles on a price both sides can actually live with. That settling point, reached without anyone officially deciding it, is exactly what economists call equilibrium.",
        obj:["Explain how equilibrium price and quantity are determined, including the adjustment process itself","Explain the effects of price ceilings and price floors, with real examples","Explain why price ceilings commonly lead to black markets forming"],
        exp:[
          {t:"Equilibrium", b:"It's the price where sellers are happy to sell and buyers are happy to buy, like a tug-of-war rope that's stopped moving because both sides are pulling with equal strength, nobody declared a winner, the rope simply found its resting point."},
          {t:"How equilibrium is actually REACHED, not just what it is", b:"If price starts too high, sellers offer more than buyers want (a surplus), so sellers competing for buyers start lowering prices until the surplus disappears. If price starts too low, buyers want more than sellers offer (a shortage), so buyers competing for the scarce good bid the price up until the shortage disappears. This isn't a one-time event, it's a continuous, self-correcting adjustment process, which is exactly why WAEC sometimes asks you to EXPLAIN how equilibrium is reached, not just define it."},
          {t:"Price controls, with a real example", b:"A maximum price, or price ceiling, stops prices rising above a set level, often to protect buyers, but can cause shortages if sellers no longer find it worthwhile to supply enough. Nigeria's fuel subsidy regime, which kept petrol prices artificially low for years, is a real-world price ceiling case study, it protected consumers from high pump prices, but also famously produced recurring fuel scarcity, since importers found selling at the capped price unprofitable relative to actual costs. A minimum price, or price floor, protects producers instead, but can leave unsold surplus sitting on shelves."},
          {t:"Price ceilings and black markets - a predictable side effect", b:"When a price ceiling creates a genuine shortage, some buyers become willing to pay MORE than the legal maximum just to actually get the good, and some sellers become willing to secretly sell above the ceiling to meet that demand. This illegal but predictable secondary market is a black market, a direct, textbook consequence of price ceilings that WAEC frequently expects as part of a full answer on the effects of price controls."}
        ],
        err:["Assuming government-fixed prices have no side effects","Confusing a price ceiling with a price floor","Describing equilibrium only as a fixed point, without explaining the adjustment process that gets prices there","Forgetting that price ceilings, not price floors, are the ones that typically cause black markets"],
        qs:[
          Q("Market equilibrium occurs where",["quantity demanded equals quantity supplied","price is at its highest","supply exceeds demand","the government sets a fixed price"],0,"Equilibrium is where the demand and supply curves intersect.","Medium"),
          Q("A government-imposed maximum price set below the equilibrium price is likely to cause",["a shortage of the good","a surplus of the good","no change at all","the good to disappear from demand entirely"],0,"Below-equilibrium price ceilings encourage more buying but less selling, creating shortages.","Hard"),

      { id:"production", name:"Production, Theory of Cost and Revenue",
        hook:"A tailor stitching one school uniform at a time spends far more time and cloth per shirt than a factory mass-producing fifty identical uniforms at once, buying fabric in bulk and reusing the same setup for every piece. That saving from doing things at a larger scale is exactly what economists call economies of scale, though push the factory too far past its comfortable size, and costs can start creeping back up again.",
        obj:["Identify the factors of production and the specific reward each one earns","Distinguish fixed, variable, marginal and average cost","Explain the law of diminishing returns and how it differs from economies of scale","Distinguish the short run from the long run in production"],
        exp:[
          {t:"Factors of production, and what each one is PAID", b:"Everything that goes into producing anything falls into four buckets, each with its own specific reward: land earns RENT, labour earns WAGES, capital earns INTEREST, and entrepreneurship earns PROFIT (the reward for organising everything and bearing the risk). WAEC frequently tests this exact pairing, matching each factor to its correct specific reward, not just naming the four factors."},
          {t:"Cost concepts", b:"Fixed costs don't change with output, like the tailor's monthly shop rent whether they sew one shirt or fifty; variable costs do change, like the actual fabric used per shirt. Total cost is simply both added together."},
          {t:"Diminishing returns vs economies of scale - a common mix-up", b:"The LAW OF DIMINISHING RETURNS applies in the SHORT RUN, when you keep adding more of one variable input (like workers) to a FIXED amount of another (like a single workshop), each extra worker eventually adds less extra output than the one before, since they're now crowding a space that can't expand. ECONOMIES OF SCALE, by contrast, describe what happens in the LONG RUN when a firm scales up ALL its inputs together, generally lowering average cost, at least until diseconomies of scale set in from being too large to manage efficiently. These sound similar but describe genuinely different situations."},
          {t:"Short run vs long run in production", b:"The SHORT RUN is any period where at least one factor of production (usually capital, like the factory building itself) is fixed and can't be changed. The LONG RUN is a period long enough that a firm can adjust every input, including building an entirely new factory. This distinction underlies why diminishing returns (a short-run concept) and economies of scale (a long-run concept) don't contradict each other, they describe production decisions on different time horizons."}
        ],
        err:["Confusing fixed cost with variable cost","Confusing marginal cost with average cost","Mixing up diminishing returns (short-run, one fixed input) with diseconomies of scale (long-run, all inputs scaled up)","Forgetting the specific reward each factor of production earns (land=rent, labour=wages, capital=interest, entrepreneurship=profit)"],
        qs:[
          Q("Which of these is NOT one of the four traditional factors of production?",["Land","Labour","Capital","Inflation"],3,"Land, labour, capital and entrepreneurship are the four factors; inflation is not one of them.","Easy"),
          Q("A cost that does not change regardless of how much a firm produces, such as rent, is called a",["fixed cost","variable cost","marginal cost","average cost"],0,"Fixed costs remain constant regardless of output level.","Easy"),
          Q("The extra cost of producing one more unit of output is called the",["marginal cost","total cost","fixed cost","average revenue"],0,"Marginal cost is specifically the cost of one additional unit.","Medium"),
          Q("Diseconomies of scale are best explained as a situation where an increase in output causes",["average cost to rise","average cost to fall","marginal revenue to rise","the firm to close immediately"],0,"Diseconomies of scale describe rising average cost once a firm grows beyond its optimal size.","Medium",VP),
          Q("The production cost that varies inversely with output - falling as output rises - is",["average cost","average fixed cost","marginal cost","average variable cost"],1,"Average fixed cost falls as output rises because the same fixed cost is spread over more units.","Hard",VP),
          Q("The specific reward earned by the factor of production 'capital' is",["interest","rent","wages","profit"],0,"Capital earns interest, distinct from land's rent, labour's wages, and entrepreneurship's profit.","Medium"),
          Q("The law of diminishing returns applies specifically",["in the short run, when more of a variable input is added to a fixed input","only in the long run, when all inputs can be adjusted","only to agricultural production","only when a firm is making a loss"],0,"Diminishing returns is a short-run concept involving a fixed input alongside a variable one.","Hard"),
          Q("The 'long run' in production is best defined as a period in which",["a firm can adjust every factor of production, including fixed ones like factory buildings","only variable costs can change","prices remain fixed by government","only labour costs matter"],0,"The long run is long enough for a firm to adjust ALL inputs, not just variable ones.","Medium")
        ]
      },
      { id:"market", name:"Market Structures",

          {t:"Oligopoly", b:"A few big players dominate, think of the handful of major telecom networks. Each one watches the others closely, because a price change or new offer from one immediately affects how the rest respond."}

      { id:"disttrade", name:"Distributive Trade",

        obj:["Distinguish the roles of wholesalers and retailers","Identify problems affecting distribution","Explain the full range of functions a middleman performs, beyond just breaking bulk"],
        exp:[
          {t:"Wholesalers vs retailers", b:"A wholesaler buys in bulk directly from producers and sells in smaller bulk to retailers; a retailer, like the small shop near Yetunde's house, then sells in small quantities directly to the final consumer."},

          {t:"Role of distribution", b:"Good distribution gets goods from where they're made to where they're actually needed, in a form and at a time that's genuinely useful, a truckload of rice sitting untouched at a distant farm helps no one cooking dinner in the city tonight."}

          Q("The final link in the distribution chain, selling directly to consumers, is the",["retailer","wholesaler","producer","importer"],0,"Retailers sell directly to the final consumer.","Easy"),

      { id:"poplabour", name:"Population and Labour Market",

      { id:"natincome", name:"National Income",
        hook:"When two uncles argue at a family gathering about whether the country is 'doing well economically', they're often really arguing about how to measure and interpret a single number, national income, without either of them realising that's the actual disagreement underneath it all.",
        obj:["Distinguish GDP, GNP and NNP","Identify the limitations of national income data","Explain the three approaches to measuring national income, and why they should agree","Distinguish GDP from GDP per capita, and explain why the difference matters"],
        exp:[
          {t:"GDP vs GNP", b:"GDP measures output produced WITHIN a country's borders, regardless of who owns the businesses doing the producing. GNP instead measures output produced BY a country's own citizens and companies, regardless of where in the world they happen to be operating."},
          {t:"Three approaches, one answer", b:"National income can be measured three different ways, that should all arrive at roughly the same figure: the OUTPUT approach (summing the value added by every sector of the economy), the INCOME approach (summing all incomes earned, wages, rent, interest, profit), and the EXPENDITURE approach (summing all spending, on consumption, investment, government spending and net exports). They agree because they're really just three different vantage points on the exact same economic activity, what's produced becomes income for someone, which then gets spent."},
          {t:"Avoiding double counting - why 'value added' matters", b:"If a farmer sells cocoa beans to a factory for ₦100, and the factory turns them into chocolate sold for ₦300, simply adding ₦100+₦300 would count the beans' value TWICE. The correct approach counts only the VALUE ADDED at each stage: ₦100 for the farmer, and ₦200 (300 minus the 100 cost of beans) for the factory, giving a true total of ₦300, not ₦400. This is exactly why the output approach is described as summing 'net contributions', not simply adding up every sale in the economy."},
          {t:"GDP vs GDP per capita - why the difference matters", b:"Raw GDP tells you the total size of an economy; GDP PER CAPITA divides that total by population, giving a rough sense of average income per person. A country with a huge population and huge total GDP can still have LOW GDP per capita if that output is spread across hundreds of millions of people, while a small, wealthy country can have modest total GDP but very high GDP per capita. WAEC sometimes tests this exact distinction: 'bigger economy' and 'richer average citizen' are not automatically the same claim."},
          {t:"Limitations", b:"National income figures don't capture everything that actually matters, they miss unpaid work like a mother's housework, informal or unrecorded market trade, and say nothing about how evenly that income is actually shared among everyone in the country."}
        ],
        err:["Confusing GDP with GNP","Assuming national income figures capture all economic activity","Adding up sales at every production stage without adjusting for value added, causing double counting","Assuming a country with a large total GDP automatically means its average citizen is wealthy"],
        qs:[
          Q("Gross Domestic Product (GDP) measures the value of output produced",["within a country's borders, regardless of who owns the producing businesses","only by government-owned companies","only in agriculture","only by citizens living abroad"],0,"GDP is based on location of production, not ownership.","Medium"),
          Q("A key limitation of national income figures is that they often",["fail to capture unpaid or informal economic activity","are always 100% accurate","only apply to rich countries","cannot be calculated at all"],0,"Informal and unpaid work are commonly excluded from national income statistics.","Medium"),
          Q("Gross National Product (GNP) differs from GDP mainly in that GNP includes output produced by",["a country's citizens and companies wherever in the world they operate","only foreign companies operating locally","only the government","only exports"],0,"GNP is based on ownership/nationality rather than location.","Hard"),
          Q("The output approach to computing national income calculates GDP mainly by",["adding together the values of the net contributions of all sectors of the economy","adding all household incomes only","summing government expenditure alone","adding only export earnings"],0,"The output approach sums the net output contributed by each sector of the economy.","Hard",VP),
          Q("Gross National Product (GNP) less the provision for the wear and tear of assets (depreciation) is called the",["net present value","net national product","net factor income from abroad","net indirect taxes"],1,"GNP minus depreciation gives the Net National Product (NNP).","Medium",VP),
          Q("The three approaches to measuring national income (output, income, and expenditure) should, in theory,",["all arrive at approximately the same total figure","give three completely unrelated figures","only be used in developed countries","measure entirely different things with no connection"],0,"All three approaches measure the same underlying economic activity from different angles, so they should agree.","Medium"),
          Q("To avoid double counting when calculating national income by the output approach, economists sum each sector's",["value added, not the full sale price at every stage of production","total sales revenue at every single stage","import bill only","population size"],0,"Only counting value added at each stage avoids counting the same output's value more than once.","Hard"),
          Q("A country could have a very large total GDP but a low GDP per capita mainly because",["its output is spread across a very large population","its currency is strong","it has no natural resources","it exports very little"],0,"GDP per capita divides total GDP by population, so a huge population can pull the average down even with high total output.","Medium")
        ]
      },
      { id:"moneyinfl", name:"Money and Inflation",
        hook:"Before money existed, if a farmer had yams but wanted a goat, they needed to track down someone who owned a goat and ALSO happened to want yams that exact week, a genuine nightmare of coincidence. Money was invented purely to solve that awkward matching problem, once and for all.",
        obj:["Explain the functions of money","Explain the meaning, causes and effects of inflation","Distinguish demand-pull inflation from cost-push inflation","Explain who specifically gains and who loses from inflation"],
        exp:[
          {t:"Functions of money", b:"Money is a middle-man, a medium of exchange replacing that awkward yam-for-goat hunt; a piggy bank you can trust, a store of value; and a common price-tag language, a unit of account, all rolled into one."},
          {t:"Inflation", b:"If your ₦500 buys visibly less garri this year than it did last year, prices in general are rising, and that steady, broad rise is inflation quietly shrinking the real value of the money sitting in your pocket."},
          {t:"Demand-pull vs cost-push inflation - two different causes", b:"DEMAND-PULL inflation happens when buyers collectively want more goods than the economy can currently produce, 'too much money chasing too few goods', bidding prices up (a Christmas rush across the whole economy, not just one market). COST-PUSH inflation happens instead when producers' own costs rise, higher fuel or raw material prices, forcing them to raise prices just to stay profitable, even without any change in buyer demand. WAEC frequently asks students to identify which TYPE a described scenario represents."},
          {t:"Who wins and who loses from inflation", b:"Inflation doesn't hurt everyone equally: DEBTORS often benefit, since they repay loans later with money that's worth less in real terms than what they borrowed. SAVERS and people on FIXED INCOMES (like pensioners) tend to lose, since their money's real purchasing power shrinks while their income stays the same. This uneven impact is exactly why inflation is treated as a serious economic and social concern, not simply a number going up."}
        ],
        err:["Forgetting 'unit of account' as a function of money","Confusing inflation with a one-off price rise in a single good","Mixing up demand-pull (too much demand) with cost-push (rising production costs) inflation","Assuming inflation harms everyone in society equally"],
        qs:[
          Q("Which of these is NOT a tool of monetary policy?",["Open market operations","Reserve requirement","Bank rate","Tax and public expenditure"],3,"Tax and public expenditure are tools of fiscal policy, controlled by government, not the central bank's monetary policy.","Medium",VP),
          Q("Inflation refers to",["a persistent rise in the general price level","a fall in the general price level","a fixed exchange rate","an increase in exports only"],0,"Inflation is a sustained increase in the average price level.","Easy"),
          Q("Which of these is NOT typically considered a function of money?",["Creating employment directly","Medium of exchange","Store of value","Unit of account"],0,"Money facilitates transactions; it doesn't directly create jobs.","Medium"),
          Q("When the Central Bank wants to increase the money supply through open market operations, it will typically",["purchase securities from the public through commercial banks","sell securities to the public","destroy old currency notes","raise the bank rate sharply"],0,"Buying back securities injects money into the banking system, increasing the money supply.","Hard",VP),
          Q("When the Central Bank instead wants to REDUCE the money supply through open market operations, it will typically",["sell government securities to the public","purchase securities from the public","reduce the bank rate sharply","print additional currency"],0,"Selling securities draws money out of public circulation, reducing the overall money supply.","Hard",VP),
          Q("If the Central Bank increases its bank rate, the most likely effect is that",["many banks will shut down their operations entirely","customers will be encouraged to borrow more from banks","the supply of money in the economy may be reduced","interest charges by commercial banks will fall"],2,"A higher bank rate raises borrowing costs throughout the banking system, which tends to reduce the overall money supply.","Hard",VP),
          Q("Inflation caused by rising production costs, such as a sudden increase in fuel prices, being passed on to consumers is known as",["cost-push inflation","demand-pull inflation","hyperinflation only","deflation"],0,"Cost-push inflation originates from rising production costs, not excess demand.","Medium"),
          Q("A person who has borrowed a fixed loan amount generally __ from unexpected inflation, since they repay with money worth less in real terms.",["benefits","loses","is entirely unaffected","must repay double the amount"],0,"Debtors often benefit from inflation, repaying loans with less valuable money than they originally borrowed.","Hard")
        ]
      },
      { id:"fininst", name:"Financial Institutions",
        hook:"Your local commercial bank, a mortgage bank helping a young couple buy their first home, and an insurance company protecting a shop owner against fire damage are all technically 'financial institutions', yet each plays a completely different role in keeping money actually moving through the economy.",
        obj:["Identify types of financial institutions and their functions","Explain the role of financial institutions in an economy","Distinguish commercial banks from development/merchant banks by their typical loan term","Explain the concept of 'near money' or quasi-money"],
        exp:[
          {t:"Types", b:"Beyond ordinary commercial banks, there are development banks funding long-term national projects, mortgage banks specifically for housing loans, merchant banks for business finance, and insurance companies spreading risk among many paying customers."},
          {t:"Commercial banks vs development/merchant banks - the term-length distinction", b:"Commercial banks mainly deal in everyday, SHORT-TERM banking: current and savings accounts, short-term loans, and day-to-day transactions for ordinary customers and businesses. Development and merchant banks instead specialise in LONG-TERM finance, funding major infrastructure projects or large business ventures that take years to pay off, money commercial banks generally aren't structured to lend for that long. This term-length distinction, not just 'one is for individuals, one is for business', is the more precise, testable difference."},
          {t:"'Near money' - assets that aren't quite cash, but almost", b:"'Near money' (or quasi-money) refers to assets that can be converted into actual cash fairly quickly and reliably, but aren't cash themselves, savings account balances, treasury bills, or short-term fixed deposits are classic examples. They matter in economics because they affect how much genuinely spendable money exists in an economy beyond just physical notes and coins in circulation."},

      { id:"publicfinance", name:"Public Finance and Taxation",
        hook:"Adaeze's family keeps a household budget: money coming in from her parents' jobs, money going out on school fees, feeding, and the occasional new laptop. Government runs on the exact same basic logic, just at a vastly bigger scale, collecting money mainly through taxes and spending it on things like roads, hospitals and teachers' salaries.",
        obj:["Distinguish types and structures of taxation","Explain sources of government revenue and expenditure"],
        exp:[
          {t:"Direct vs indirect tax", b:"A direct tax is paid straight from your income, like PAYE, no middleman involved. An indirect tax is hidden inside a price, like VAT on a purchase, so you pay it without ever having a separate 'tax' conversation at the till."},
          {t:"Progressive vs regressive", b:"A progressive tax takes a bigger bite as you earn more, like a taller student carrying a heavier school bag by design. A regressive tax effectively hits poorer people harder, since everyone pays the same flat amount regardless of how much, or little, they actually earn."},
          {t:"Government expenditure", b:"Recurrent expenditure is like Adaeze's family's monthly feeding budget, it repeats every single period. Capital expenditure is more like buying a new laptop, a one-off investment that keeps paying off well after the initial purchase."}
        ],
        err:["Assuming all taxes work the same way regardless of income level","Confusing recurrent expenditure with capital expenditure"],
        qs:[
          Q("M and Mrs Y pay $500.00 and $1,400.00 respectively as tax on earnings of $5,000.00 and $7,000.00. This system of taxation is called",["specific tax","proportional tax","regressive tax","progressive tax"],3,"500/5000=10% but 1,400/7,000=20% - the tax rate rises as income rises, which is progressive taxation.","Hard",VP),
          Q("A tax paid directly from a person's income, such as PAYE, is an example of",["a direct tax","an indirect tax","a tariff","a subsidy"],0,"Direct taxes are levied straight on income or wealth, with no intermediary.","Easy"),
          Q("Value Added Tax (VAT) added to the price of goods is an example of",["an indirect tax","a direct tax","a capital gains tax","a poll tax"],0,"Indirect taxes are built into the price of goods and services.","Easy"),
          Q("Government spending on salaries and routine running costs is classified as",["recurrent expenditure","capital expenditure","a budget surplus","a subsidy"],0,"Recurrent expenditure covers regular, repeating costs like wages.","Medium"),
          Q("A tax levied per unit of output, regardless of the value of that output, is called",["specific tax","value-added tax","ad-valorem tax","progressive tax"],0,"A specific tax is charged per unit, unlike ad-valorem tax which is based on value.","Medium",VP),
          Q("In a regressive tax system, as a person's income falls, the proportion of that income paid as tax",["rises","falls","stays exactly constant","becomes zero"],0,"Regressive taxation means the tax burden, as a proportion of income, is heavier on lower incomes.","Hard",VP)
        ]
      },
      { id:"devplan", name:"Economic Development and Planning",
        hook:"A town that builds a shiny new stadium but leaves its only hospital short of basic medicine hasn't necessarily improved anyone's actual life, even though something visibly bigger now exists. That gap between simply growing bigger and genuinely developing better is exactly what this topic studies.",
        obj:["Distinguish economic growth from economic development","Explain the purpose and problems of development planning","Explain the Human Development Index (HDI) as a specific, testable measure of development"],
        exp:[
          {t:"Growth vs development", b:"Economic growth is just a rise in output, GDP going up; economic development is broader, better living standards, health, education and reduced poverty, not just more money moving around, or one shiny new stadium."},
          {t:"Development planning", b:"A development plan sets out deliberate national goals and strategies over a period of years, prioritising things like that under-supplied hospital, rather than leaving a country's direction entirely to chance or short-term impulse."},
          {t:"The Human Development Index (HDI) - a specific, named measure", b:"Since GDP alone can't capture genuine development, the United Nations uses the Human Development Index, a composite score combining three specific dimensions: life expectancy (health), education (years of schooling), and income (standard of living), into a single number between 0 and 1. A country can have decent GDP but a comparatively low HDI if its health or education outcomes lag behind, exactly the 'growth without development' gap this topic is built around. WAEC sometimes asks students to NAME this specific index, not just describe development in general terms."}
        ],
        err:["Treating economic growth and economic development as the same thing","Assuming development plans always succeed once written","Being unable to name a specific measure (like HDI) beyond just describing development in vague terms"],

          Q("A national development plan is best described as",["a deliberate, structured strategy setting economic goals over a period","a random, unplanned set of policies","a single company's business plan","a plan created only by foreign investors"],0,"Development plans are structured national strategies.","Easy"),
          Q("A common problem of development planning in many countries is",["inadequate funding and poor implementation","too much available capital","an excess of skilled planners","no need for foreign assistance"],0,"Funding and implementation gaps commonly undermine development plans.","Medium"),
          Q("An economy where the majority of its labour force is engaged in the secondary and tertiary sectors, rather than agriculture, is generally best described as",["an advanced, developed or industrialised economy","a purely agrarian economy","an underdeveloped economy with no industry","a nomadic subsistence economy"],0,"A workforce concentrated in industry and services, rather than primary agriculture, is typically characteristic of a more advanced, industrialised economy.","Medium",VP),
          Q("The Human Development Index (HDI) combines which three specific dimensions into a single measure?",["life expectancy, education, and income","GDP, exports and imports","population, land area and rainfall","military spending, tax revenue and inflation"],0,"The HDI combines health (life expectancy), education, and standard of living (income) into one composite measure.","Hard")

      { id:"inttrade", name:"International Trade and Balance of Payments",
        hook:"Nigeria has abundant oil but not nearly enough heavy machinery; another country has plenty of machinery but limited oil of its own. Trading lets both countries end up with more of both than either could manage by trying to produce everything alone, which is the entire logic international trade is built on.",
        obj:["Explain the basis of international trade, including absolute vs comparative advantage","Explain the meaning and specific components of the balance of payments"],
        exp:[
          {t:"Comparative advantage", b:"It's smarter for a country to focus on producing what it's relatively best at, and trade for the rest, the same way a brilliant doctor who also happens to cook well still hires a chef, because their time is far better spent seeing patients than chopping onions."},
          {t:"Absolute vs comparative advantage - a pairing WAEC tests directly", b:"ABSOLUTE advantage means a country can produce a good using fewer resources than another country, outright, in absolute terms. COMPARATIVE advantage, the deeper and more useful idea, means a country should specialise in whatever it produces relatively MOST efficiently compared to its OWN alternatives, even if another country is absolutely better at producing everything. This is precisely why trade can still benefit a country that isn't the world's best at making anything, specialising in its own strongest relative area still pays off."},
          {t:"Balance of payments - the specific components", b:"It's a country's full financial scoreboard with the rest of the world, made up of specific named parts: the CURRENT ACCOUNT (trade in goods and services, plus income and transfers), the CAPITAL ACCOUNT (transfers of capital assets), and the FINANCIAL ACCOUNT (investments, loans, and reserve changes). A common exam trap is treating 'balance of payments' as identical to just the current account or just the trade balance, when it's actually this whole combined record."}
        ],
        err:["Confusing balance of trade with the full balance of payments","Assuming international trade only benefits richer countries","Confusing absolute advantage (best in the world) with comparative advantage (best relative to your own alternatives)"],
        qs:[
          Q("International trade mainly arises because",["countries have different resources and comparative advantages","all countries produce identical goods","trade is required by international law","countries want to reduce their population"],0,"Comparative advantage explains why countries specialise and trade.","Medium"),
          Q("A country's balance of trade is favourable when",["exports exceed imports","imports exceed exports","exports equal zero","imports equal zero"],0,"A trade surplus occurs when exports exceed imports.","Easy"),
          Q("The 'balance of payments' records",["a country's transactions with the rest of the world","only a company's internal accounts","only government tax revenue","only the price of one good"],0,"The balance of payments is a comprehensive record of international transactions.","Medium"),
          Q("Terms of trade is calculated as",["(Index of export prices ÷ Index of import prices) × 100","(Index of import prices ÷ Index of export prices) × 100","Export prices minus import prices","Export prices plus import prices"],0,"Terms of trade compares export price index to import price index, expressed as a ratio times 100.","Hard",VP),
          Q("An embargo refers to an outright ban, imposed by a government, on the",["import or export of a good or service","domestic production of a good","transportation of goods within a country","sale of a good in local markets only"],0,"An embargo is a government-imposed ban specifically on international trade (import or export) of a good or service.","Medium",VP),
          Q("In 2020, a country's index of export prices was 180 and its index of import prices was 150 (base year=100). Calculate the terms of trade for that year.",["120","150","180","100"],0,"Terms of trade = (180/150)×100 = 120.","Hard",VP),
          Q("In 2021, the same country's index of export prices fell to 160 while its index of import prices rose to 200. Compared with the terms of trade of 120 calculated for 2020, the 2021 position of 80 represents",["an unfavourable shift, since export earnings now buy fewer imports","a favourable shift, since exports became more valuable","no real change in the country's trading position","an improvement that benefits the country's consumers"],0,"Terms of trade fell from 120 to 80 - export earnings now buy proportionally less than before, an unfavourable shift.","Hard",VP),
          Q("Given that a country's index of export price is 180 and that of import price is 200, the terms of trade is",["0.09","2.00","90.00","380.00"],2,"Terms of trade = (180/200)×100 = 90.00.","Hard",VP),
          Q("Foreign investment and long-term securities in the balance of payments accounts are recorded as a",["current account transaction","capital account transaction","balance of trade transaction","invisible balance transaction"],1,"Long-term investment flows and securities belong in the capital account, distinct from the current account.","Hard",VP),
          Q("A country able to produce a good using fewer resources than any other country, in outright terms, is said to have",["an absolute advantage","a comparative advantage","a terms of trade surplus","a balance of payments surplus"],0,"Absolute advantage refers to outright superior efficiency, distinct from comparative advantage.","Medium"),
          Q("The current account of the balance of payments specifically records",["trade in goods and services, plus income and transfers","only long-term capital investment flows","only changes in foreign exchange reserves","only government tax revenue"],0,"The current account covers goods and services trade, income, and current transfers.","Hard")
        ]
      },

      { id:"natresources", name:"Major Natural Resources",

        exp:[

          {t:"'Dutch Disease' - the specific mechanism behind the resource curse", b:"Named after the Netherlands' experience following a 1960s natural gas discovery, 'Dutch Disease' describes a specific process: a resource export boom brings in large foreign currency earnings, which strengthens (appreciates) the national currency, which in turn makes the country's OTHER exports (like agriculture or manufacturing) more expensive and less competitive internationally. The resource sector booms while other sectors quietly wither, precisely the mechanism behind the broader 'resource curse' pattern this topic studies."},
          {t:"Negative effects", b:"Resource extraction can also bring environmental damage to nearby communities, conflict over who actually controls the resource, and neglect of other sectors like agriculture, a pattern sometimes called the 'resource curse'."}

      { id:"meaning", name:"Meaning and Scope of Government",
        hook:"When Tayo's grandfather talks about 'the government', he means the president and ministers currently in office. When Tayo's civics teacher talks about 'government', she sometimes means the ongoing daily business of running the country, and other times means the whole academic subject Tayo is revising for right now. All three uses are correct at once - Government the WAEC subject studies exactly these three angles.",
        obj:["Explain government as an institution, a process and an academic field"],
        exp:[
          {t:"Government as institution", b:"This is government as the actual body of people and offices, presidents, ministries, courts, that exercise authority over a state, the meaning Tayo's grandfather has in mind when he discusses politics on the news."},
          {t:"Government as process", b:"This is government as an ongoing ACTIVITY, the art and practice of governing, making decisions, and managing a country day to day, closer to what Tayo's teacher means when she describes how decisions actually get made, rather than simply who currently holds office."}
        ],
        err:["Assuming 'government' only ever means the institution, not the process or field of study"],
        qs:[
          Q("Government viewed as the actual offices and institutions exercising state authority is government as",["an institution of the state","a process","an academic field","a private company"],0,"This is government understood as an institution.","Easy"),
          Q("Government viewed as the ongoing activity of governing and managing a country is government as",["a process or art of governing","an institution only","a religion","a business"],0,"This is government understood as an ongoing process.","Easy"),
          Q("Studying Government as an academic field mainly involves",["analysing political institutions, processes and theories","running a country directly","collecting taxes","enforcing court judgments"],0,"As a field of study, Government analyses institutions and theory.","Medium")
        ]
      },
      { id:"concepts", name:"Basic Concepts and Principles of Government",
        hook:"During a heated class debate, one student insists a certain senior boy has real 'power' simply because other students are scared of him, while another argues a properly elected prefect has genuine 'authority' precisely because the principal appointed him fairly. Government as a subject takes that exact instinctive disagreement and gives it precise, exam-worthy definitions.",
        obj:["Distinguish power, authority, legitimacy and sovereignty","Explain political socialization"],
        exp:[
          {t:"Power vs authority", b:"Power is simply the ability to make people do something, even by force, like the feared senior boy. Authority is power that's recognised as rightful and legitimate, like a properly appointed prefect or a teacher in class, versus a bully's raw power that nobody actually respects underneath the fear."},
          {t:"Sovereignty", b:"Sovereignty is a state's supreme, independent authority over its own territory and affairs, free from outside control, the national-scale version of a school being free to set its own rules without a neighbouring school dictating them."}
        ],
        err:["Treating power and authority as identical concepts","Confusing sovereignty with mere physical size or population"],
        qs:[
          Q("The recognised, rightful right to exercise power is called",["authority","anarchy","sedition","apathy"],0,"Authority is power recognised as legitimate.","Easy"),
          Q("A state's supreme and independent authority over its own affairs, free from external control, is called",["sovereignty","federalism","socialization","nationalism"],0,"Sovereignty describes a state's independent supreme authority.","Medium"),
          Q("'Political socialization' is the process by which an individual",["acquires political attitudes, values and beliefs","becomes a government minister","pays taxes","votes in an election"],0,"This is the direct definition of political socialization.","Medium",VP),
          Q("A concept that defines a state's right to govern itself and maintain its territorial integrity without external interference is",["Alliance","Sovereignty","Interventionism","Self-determination"],1,"This is the standard definition of sovereignty.","Medium",VP),
          Q("The concept of social justice implies that the state must ensure",["sharing of political power","fairness to foreign nationals","equality of citizens","freedom of movement"],2,"Social justice is centrally about equality and fairness among citizens.","Medium",VP)
        ]

      { id:"constitutions", name:"Constitutions",
        hook:"When Efe's class drafts rules for their new debate club, they quickly realise unwritten 'everyone just knows' rules cause constant arguments, so they write everything down in one document that even the club president has to follow. That instinct, put everything in one binding document nobody can secretly bend, is exactly why constitutions exist at a national level.",
        obj:["Distinguish written from unwritten, and rigid from flexible constitutions","Explain the functions of a constitution"],
        exp:[
          {t:"Written vs unwritten", b:"A written constitution is set out in one formal codified document, like Nigeria's 1999 Constitution, the same instinct behind Efe's club writing its rules down properly. An unwritten constitution instead relies on scattered statutes, conventions and precedent, like the UK's, more like a club that runs on long-established tradition than one single rulebook."},
          {t:"Rigid vs flexible", b:"A rigid constitution is hard to amend, needing special procedures that protect it from casual change, the way Efe's club might require a two-thirds vote before any rule can be altered, rather than letting the president simply decide alone. A flexible one can be changed through ordinary legislative process instead."}
        ],
        err:["Assuming every country has a single written constitutional document","Confusing 'rigid' with simply 'old' or 'outdated'"],

          Q("A constitution that can only be amended through special, difficult procedures is described as",["rigid","flexible","unwritten","informal"],0,"Rigid constitutions require special amendment procedures.","Medium"),
          Q("One key function of a constitution is to",["establish how a country is governed and limit the power of its leaders","collect taxes directly","run elections personally","replace the judiciary"],0,"Constitutions establish governance structure and limit power.","Easy")
        ]
      },
      { id:"types", name:"Types/Forms of Government",
        hook:"Imagine one school where a single principal decides everything for every class, right down to seating arrangements, that's unitary. Now imagine a school where each class arm has its own class captain with real decision-making power over class matters, alongside the principal handling school-wide issues, that's federal. Government systems sit on exactly that same spectrum, just with a whole country instead of a school.",
        obj:["Distinguish unitary, federal and confederal systems","Identify features of democratic and autocratic governments","Distinguish absolute monarchy from constitutional monarchy"],
        exp:[
          {t:"Federal vs unitary", b:"In a federal system, power is deliberately shared and protected between the centre and the states, like siblings each getting their own room with a lock nobody else holds a key to. In a unitary system, one authority holds the master key to every room in the house."},
          {t:"Confederal - looser than federal, often missed", b:"A CONFEDERAL system is looser still than a federal one: member states retain even MORE independent sovereignty, often keeping the right to leave the union entirely, and the central authority exists mainly to coordinate a few shared matters (like defence or trade) rather than govern directly. Students often assume 'confederal' is just another word for 'federal', but the key difference is how much sovereignty member units actually keep, and whether they can walk away."},
          {t:"Democracy vs autocracy", b:"Democracy is a class electing its own class rep through an actual vote; autocracy is one person appointing themselves class rep forever, with no vote, no term limit, and no real way for classmates to remove them."},
          {t:"Absolute vs constitutional monarchy", b:"In an ABSOLUTE monarchy, the monarch's word is essentially final, with no real constitutional limit on royal power. In a CONSTITUTIONAL monarchy, a king or queen remains as head of state largely for ceremony and continuity, while real governing power sits with an elected parliament and prime minister, the monarch reigns, but doesn't actually rule."}
        ],
        err:["Confusing federalism with a unitary system that merely has local offices","Assuming all elected governments are automatically democratic in practice","Treating confederal and federal systems as identical, rather than differing in how much sovereignty member states retain"],
        qs:[
          Q("A system where power is constitutionally divided between central and regional governments is called",["Federal government","Unitary government","Confederal government","Monarchical government"],0,"Federalism divides power between central and state/regional levels.","Easy"),
          Q("A government in which citizens elect representatives to make decisions is called",["a representative democracy","an absolute monarchy","a military junta","a theocracy"],0,"Representative democracy involves electing officials to govern on citizens' behalf.","Easy"),
          Q("An autocratic government is characterised mainly by",["concentration of power in a ruler or small group without accountability","regular free and fair elections","division of power among branches","a written bill of rights"],0,"Autocracies lack meaningful checks on the ruler's power.","Medium"),
          Q("In which political system does the government control every aspect of a citizen's life?",["Communism","Dictatorship","Totalitarianism","Aristocracy"],2,"Totalitarianism specifically means total state control over all aspects of life, beyond ordinary dictatorship.","Medium",VP),
          Q("In which system of government does the legislature have the power to pass a vote of no confidence in the government?",["Federal","Cabinet","De jure","Monarchical"],1,"A vote of no confidence forcing a government to resign is a defining feature of the cabinet (parliamentary) system.","Medium",VP),
          Q("In a presidential system of government, the president is referred to as an 'executive president' mainly because he",["is elected indirectly by parliament","is both head of state and head of government, wielding real executive powers","has no real power over policy","shares power equally with a monarch"],1,"In a presidential system, the president combines the roles of head of state and head of government, giving the office genuine executive power.","Medium",VP),
