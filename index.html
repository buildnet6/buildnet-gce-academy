    topics:[
      { id:"comp", name:"Comprehension",
        hook:"Ngozi's best friend Blessing gives her a breathless, ten-minute gist about a fight that broke out at the market - jumping between who said what, who pushed who, and what the okada man shouted. When Ngozi later retells it to her mum in twenty seconds, she doesn't repeat every word Blessing said; she picks out the actual point (two traders arguing over change) and drops the noise. Without realising it, Ngozi has just done exactly what a WAEC comprehension question demands: find the real message buried inside a longer passage, and notice things the writer never says outright but clearly implies.",
        obj:["Identify the main idea and factual content of a passage","Make inferences and identify tone or attitude in a passage"],
        exp:[
          {t:"Main idea", b:"Every paragraph works a bit like a WhatsApp status - there's usually one central message the writer actually wants you to notice, even with extra details (the 'emojis') decorating it. If a paragraph describes rain, thunder, a leaking roof and a mother rushing to save her rice, the main idea probably isn't 'it rained' - it's how the family coped under sudden pressure."},
          {t:"Inference", b:"If your mum walks in, drops her bag hard, and sighs loudly without saying a word, you don't need her to announce 'I had a stressful day' - you read it from her actions. WAEC's inference questions test that exact same skill on paper: using small clues the writer scatters through the text (a hesitant pause, a clenched fist, an unfinished sentence) to work out something the passage never says directly."}
        ],
        err:["Answering from general knowledge instead of what the passage actually says","Missing the difference between the writer's tone and the characters' tone"],
        qs:[
          Q("In comprehension, the 'main idea' of a paragraph usually refers to",["the central point the writer is making","the last sentence of the paragraph","a minor supporting detail","the title of the passage"],0,"The main idea is the central point around which details are organised.","Easy"),
          Q("'Inference' in comprehension means",["a conclusion drawn from evidence in the passage, though not stated directly","a fact directly stated in the text","the title of the passage","a grammatical error"],0,"Inference requires reading between the lines using the clues given.","Medium"),
          Q("A recent WAEC comprehension passage described a student overwhelmed by pressure until 'the straw that broke the camel's back'. This idiom describes",["the final small event that finally makes a build-up of problems unbearable","a strictly literal event involving a camel","the very first problem a person faces","an event with no real significance"],0,"The idiom describes a last, seemingly minor addition that tips an already heavy burden over the edge.","Medium"),
          Q("Passage: 'Tobi had always been the quiet one in class, but that term he started arriving late, snapping at friends who used to make him laugh, and staring out of the window through lessons. His teacher, Mrs Bassey, noticed but said nothing at first, hoping it would pass. It didn't. One wet Tuesday, Tobi simply put his head on the desk and refused to lift it. It was only when Mrs Bassey quietly asked him to stay behind, and sat with him in silence rather than demanding an explanation, that Tobi finally admitted his parents had been arguing loudly every night for weeks, and he hadn't told anyone because he thought it was his job to hold the family together on his own.' What most likely caused Tobi's change in behaviour?",["Ongoing conflict at home that he felt he had to cope with alone","A disagreement with his classmates","Difficulty understanding his schoolwork","A dislike for Mrs Bassey specifically"],0,"The passage reveals his parents' nightly arguing, and his sense of needing to hold the family together, as the real cause behind his behaviour.","Medium"),
          Q("Using the same passage about Tobi, what does Mrs Bassey's approach of 'sitting with him in silence rather than demanding an explanation' suggest about effective support?",["Patient, non-pressuring presence can sometimes open someone up more than direct questioning","Teachers should never speak to troubled students","Silence is always the wrong response to a struggling student","Tobi wanted to be left completely alone"],0,"Her quiet, patient presence - not interrogation - is what allowed Tobi to eventually open up.","Medium")
        ]
      },
      { id:"summary", name:"Summary Writing",
        hook:"Tolu's little brother Dimeji begs him to explain an entire two-hour Nollywood movie before their mum gets home and catches them watching past bedtime. Tolu has thirty seconds. He can't describe every scene - he has to instantly decide what actually matters (the hero's mission, the betrayal, the final twist) and drop absolutely everything else (the songs, the extended market scene, the comic uncle). That ruthless editing under pressure, keeping only what the specific question needs, is precisely the skill WAEC's Summary section is built to test.",
        obj:["Extract relevant information from a passage","Present a concise summary within a specified word limit"],
        exp:[
          {t:"What to extract", b:"A strong summary answers exactly what was asked - nothing more. If the question asks for 'three reasons the character left home', hunting for a fourth interesting detail from the passage, however fascinating, actually works against you; it isn't what was requested and can cost time and marks."},
          {t:"Word limit discipline", b:"Going over a stated word limit isn't a small technicality - it's often penalised directly by the marking scheme. Practising the skill of trimming your own sentences down to their bones (turning 'due to the fact that' into simply 'because') is just as valuable as understanding the passage itself."}
        ],
        err:["Copying long sentences directly from the passage instead of paraphrasing","Including extra detail beyond what the specific question demands"],
        qs:[
          Q("A summary answer that copies long sentences directly from the passage is problematic mainly because it",["fails to demonstrate the student's own paraphrasing ability","is always factually incorrect","uses too few words","is required by WAEC's marking scheme"],0,"Summaries should be reworded in the student's own words, not lifted verbatim.","Medium"),
          Q("If a summary question asks for reasons within a strict word limit, exceeding that limit typically",["risks losing marks even if the content is correct","always earns bonus marks","has no consequence at all","is required for full marks"],0,"Word-limit instructions are part of the task; exceeding them can cost marks.","Easy"),
          Q("The first step in tackling a summary question should be to",["identify exactly what the question is asking for before writing","start writing immediately without reading fully","copy the entire passage","ignore the question and summarise everything"],0,"Understanding the specific instruction focuses the summary on what's actually required.","Easy")
        ]
      },
      { id:"lex", name:"Lexis and Vocabulary",
        hook:"During a school football commentary competition, two students describe the exact same goal. One keeps repeating 'the boy kicked the ball into the goal' four times in a row and sounds flat and boring. The other varies it - 'he struck it', 'he volleyed it home', 'he launched it past the keeper' - and instantly sounds like a real commentator. Lexis is precisely this: having a wide enough bank of the right words, including idioms and expressions, ready to reach for at exactly the right moment.",
        obj:["Use vocabulary accurately, including field-specific and idiomatic language","Recognise figurative usage and distinguish it from literal meaning","Apply a reliable strategy for 'opposite in meaning' and synonym questions","Distinguish denotation (dictionary meaning) from connotation (emotional shading)"],
        exp:[
          {t:"Word choice", b:"'Affect' and 'effect' behave like siblings who look almost identical but do completely different jobs around the house, 'affect' is usually the action, the verb doing the influencing ('the noise affected his sleep'), while 'effect' is usually the result, the noun left behind ('the noise had a bad effect on his sleep')."},
          {t:"Idioms", b:"An idiom's real meaning can't be worked out just by translating the individual words, a student who's never heard 'hook, line and sinker' before might picture actual fishing gear, when it really just means 'completely, without a shred of doubt'. Recognising idioms is really about recognising when English has stopped being literal and started painting a picture instead."},
          {t:"A reliable strategy for opposite/synonym questions", b:"Don't just react to the underlined word in isolation, read the WHOLE sentence first to understand the context, since many words change meaning depending on it ('sharp' pain vs a 'sharp' student vs a 'sharp' turn all need different opposites). Then eliminate options that are the wrong PART OF SPEECH first (if the underlined word is a verb, an adjective option can't be the answer), before comparing the remaining candidates for the closest or most opposite fit."},
          {t:"Denotation vs connotation - why 'thin' and 'skinny' aren't interchangeable", b:"Denotation is a word's plain dictionary meaning; connotation is the emotional shading it carries beyond that. 'Thin', 'slim', and 'skinny' all denote roughly the same body size, but 'slim' carries a positive connotation (attractive), while 'skinny' often carries a negative one (unhealthily so). WAEC's 'nearest in meaning' questions sometimes hinge on picking the option with the right connotation, not just the right dictionary definition."}
        ],
        err:["Confusing similar-sounding words, e.g. affect/effect","Interpreting an idiom literally instead of by its accepted figurative meaning","Picking an option that matches the dictionary meaning but carries the wrong emotional connotation for the context","Forgetting to check that a synonym/antonym option is even the same part of speech as the underlined word"],
        qs:[
          Q("The politician's speech did not ____ the outcome of the election.",["affect","effect","effected","affection"],0,"'Affect' is a verb meaning to influence.","Medium"),
          Q("Choose the word nearest in meaning to 'meticulous'.",["Careful","Careless","Hurried","Reluctant"],0,"Meticulous means showing great attention to detail.","Easy"),
          Q("Although 'stubborn' and 'determined' can both describe someone who won't change their mind, 'determined' carries a more positive connotation because it suggests",["admirable persistence toward a goal, rather than unreasonable inflexibility","a completely different dictionary meaning","a different part of speech entirely","no real difference at all between the two words"],0,"Both words share a similar denotation, but 'determined' has a positive connotation while 'stubborn' often has a negative one.","Medium"),
          Q("The idiom 'hook, line and sinker' means",["completely and without any doubt","partially and with suspicion","slowly and carefully","never at all"],0,"To believe something 'hook, line and sinker' means to believe it entirely.","Medium"),

          Q("The boy may be culpable, but his brother is surely _____.",["innocent","ignorant","accountable","honest"],0,"'Innocent' is the direct opposite of 'culpable' (guilty).","Medium",VP),
          Q("Our class teacher used to be rigid in his opinions, but he is now _____ of other people's views.",["critical","apprise","tolerant","wary"],2,"'Tolerant' is the opposite of being 'rigid' in one's opinions.","Medium",VP),
          Q("Some workers were quite affable at the meeting, but their leader was rather _____.",["guarded","cautious","suspicious","antagonistic"],3,"'Antagonistic' is the clearest opposite of 'affable' (friendly).","Medium",VP),
          Q("The driver believed he would be castigated by all the passengers, but he was _____.",["encouraged","exonerated","commended","released"],2,"'Commended' (praised) is the opposite of 'castigated' (criticised).","Medium",VP),
          Q("The manager was eulogized for his speech, while his assistant was _____.",["discouraged","appraised","criticized","denounced"],3,"'Denounced' is the opposite of 'eulogized' (praised).","Medium",VP),
          Q("Some people are generous towards strangers, while others are _____ towards them.",["indifferent","sympathetic","nasty","mean"],3,"'Mean' is the clearest direct opposite of 'generous'.","Medium",VP),
          Q("The baby who had all along been calm suddenly became _____.",["restless","hungry","angry","cheerful"],0,"'Restless' is the opposite of 'calm'.","Medium",VP),
          Q("Bakery is a prudent husband, while Musa is _____.",["mean","extravagant","thoughtful","mindless"],1,"'Extravagant' (wasteful) is the opposite of 'prudent' (careful with resources).","Medium",VP),

      { id:"structure", name:"Structure and Grammar",
        hook:"Uche writes a brilliant, imaginative story for his English homework, full of vivid vocabulary - but his teacher circles almost every sentence in red because half of them mix up 'he go' with 'he goes', or jump between past and present tense mid-paragraph. Great word choice can't rescue a sentence whose grammar is broken underneath it; structure is the invisible skeleton holding every good word you choose up straight.",
        obj:["Apply correct concord, tense and sentence patterns","Use structural words such as prepositions and conjunctions correctly","Convert correctly between direct and reported (indirect) speech","Distinguish commonly confused word pairs that WAEC tests repeatedly"],
        exp:[
          {t:"Concord", b:"If one person is doing something, the verb wears a matching 'singular' outfit - 'he goes', 'she has', 'it runs'. If several people are doing it, the verb switches to a 'plural' outfit - 'they go', 'we have', 'the students run'. A mismatched outfit, like 'he go' or 'the students runs', stands out to an examiner instantly, even inside an otherwise excellent sentence. Watch out for tricky subjects like 'each', 'everyone', and 'neither... nor', all of which take a SINGULAR verb even though they seem to describe more than one person."},
          {t:"Tense consistency", b:"Imagine telling a friend 'I walked to school, and then I see my cousin' - the sudden jump from past to present makes the timeline confusing, even though every word is spelled correctly. Keeping verbs consistently in one tense throughout a sentence, unless there's a genuine reason to shift, keeps the reader clear on exactly when events happened."},
          {t:"Direct to reported speech - the shift-back rule", b:"When you report what someone said, without quoting their exact words, tenses generally shift one step further into the past: 'will' becomes 'would', 'am/is/are' becomes 'was/were', 'have finished' becomes 'had finished'. He said, \"I will come tomorrow\" becomes He said (that) he would come the next day. Notice 'tomorrow' also changes to 'the next day' - time and place references shift too, not just verbs."},
          {t:"Prepositions and conjunctions - the connective glue", b:"Prepositions show relationships (in, on, at, by, since, for) and conjunctions join ideas (although, because, and, but, since). A sentence starting with a subordinate conjunction like 'Although' or 'Since' needs a comma before the main clause follows: 'Although it rained, the match continued.' Missing that comma is one of WAEC's most commonly tested punctuation errors."},
          {t:"Commonly confused word pairs", b:"WAEC repeatedly tests specific word-choice traps: 'redress' (correction/compensation sought legally) vs 'address' (to speak to, or a location); 'adjourned' (a meeting postponed/ended for now) vs 'dissolved' (permanently ended, like a parliament); 'margin' (the gap between winner and loser) vs 'surplus' (leftover amount). These aren't random vocabulary, they're words that sound similar in context but carry precisely different meanings."}
        ],
        err:["Subject-verb disagreement with collective nouns","Switching tense mid-sentence without a reason"],
        qs:[
          Q("Choose the correct sentence.",["Each of the students has submitted their assignment.","Each of the students have submitted their assignment.","Each of the student has submit their assignment.","Each of the students submitting their assignment."],0,"'Each' takes a singular verb: 'has submitted'.","Medium"),
          Q("Which sentence is correctly punctuated?",["Although it rained, the match continued.","Although it rained the match, continued.","Although, it rained the match continued.","Although it rained the match continued"],0,"A comma follows an introductory subordinate clause.","Medium"),
          Q("Choose the sentence with correct tense consistency.",["She finished her homework and went to bed.","She finished her homework and goes to bed.","She finish her homework and went to bed.","She finishing her homework and went to bed."],0,"Both verbs should stay consistently in the past tense.","Medium"),
          Q("He said that they _____ painting the house by then.",["will have finished","would have finished","will finish","would finish"],1,"Reported speech describing a future-in-the-past completed action uses 'would have finished'.","Hard",VP),
          Q("The incumbent chairman won the election by a _____ of twenty votes.",["surplus","margin","consensus","space"],1,"'Margin' is the standard word for describing a winning gap in votes.","Medium",VP),
          Q("Since all items on the agenda had been discussed, the meeting was _____.",["dismissed","suspended","adjourned","dissolved"],2,"A meeting that has finished its business is 'adjourned'.","Medium",VP),
          Q("The police explained that all the aggrieved persons should seek _____ in the court of law.",["redress","litigation","address","restoration"],0,"'Redress' means correction or compensation sought through legal means.","Medium",VP),
          Q("Our principal has a large _____ of cows.",["gang","herd","skein","flock"],1,"'Herd' is the correct collective noun for cows.","Easy",VP),
          Q("The first storey building in Nigeria stands as a historic _____.",["effigy","artefact","monument","edifice"],3,"'Edifice' refers to a large, imposing building, fitting this context well.","Hard",VP),
          Q("I returned from the vacation refreshed and _____.",["rejuvenated","revived","reloaded","remodelled"],0,"'Rejuvenated' fits idiomatically with feeling refreshed and renewed.","Medium",VP),
          Q("She was advised to see a _____ because she had an unusual skin disease.",["cardiologist","dermatologist","gynaecologist","ophthalmologist"],1,"A dermatologist specialises in treating skin conditions.","Easy",VP),
          Q("The doctor's _____ was that the patient was suffering from cancer.",["prediction","prescription","diagnosis","analysis"],2,"A doctor's determination of an illness is called a 'diagnosis'.","Medium",VP),
          Q("Tom's father gave him a valuable gift as an _____ to make him work harder in school.",["incentive","attraction","interest","offer"],0,"'Incentive' fits a reward meant to motivate harder effort.","Medium",VP),
          Q("We have not yet heard the weather _____.",["forecast","broadcast","prediction","announcement"],0,"'Weather forecast' is the standard collocation.","Easy",VP)
        ]

      { id:"essay", name:"Essay and Composition",
        hook:"Blessing wants her parents to raise her weekly allowance, and she knows shouting 'give me more money!' at dinner will get her nowhere. Instead, she calmly states what she wants, lists solid reasons (rising transport fares, a school trip coming up), and closes with a reasonable request for a specific new amount. Without realising it, Blessing has just built the exact skeleton of a WAEC argumentative essay - a clear position, solid supporting reasons, and a strong closing appeal - whichever of the five essay options a student eventually picks on exam day.",
        obj:["Write essays suited to a given purpose and audience","Structure an essay with introduction, body and conclusion"],
        exp:[
          {t:"Types of essays", b:"A narrative essay tells a story with a beginning, middle and end, the way you'd gist about your weekend. An argumentative essay picks a side on an issue and defends it with reasons, the way Blessing defended her allowance request. A descriptive essay paints such a vivid picture in words a reader could practically see the scene, while letters, speeches, reports and articles each follow their own expected format and tone."},
          {t:"Register", b:"Nobody texts their school principal the exact same way they text their best friend - one demands careful, formal language, the other allows slang and abbreviations. Register is choosing the right 'outfit' of language for the specific audience an essay question describes, and wearing the wrong outfit costs marks even when the grammar is perfect."}
        ],
        err:["Writing without a clear thesis or central argument","Mixing formal and informal register within the same essay"],
        qs:[
          Q("An essay that tries to convince the reader of a point of view is called",["an argumentative essay","a narrative essay","a descriptive essay","a formal letter"],0,"Argumentative essays present and defend a position.","Easy"),
          Q("Which register is most appropriate for a letter to a school principal?",["Formal","Casual","Slang-filled","Text-message style"],0,"Letters to authority figures require a formal register.","Easy"),
          Q("A well-structured essay conclusion should mainly",["restate the main points and offer a closing thought","introduce a brand-new argument","repeat the introduction word for word","end abruptly with no summary"],0,"Conclusions summarise and close the argument rather than introduce new points.","Medium")
        ]
      },
      { id:"oral", name:"Oral English: Vowels and Consonants",
        hook:"Twin sisters 'Seat' and 'Sit' - well, not really their names, but that's the joke their English teacher makes every year - sound almost identical when said quickly, yet they're actually built from two completely different vowel sounds. Training your ear to catch that tiny difference, the way a DJ trains their ear to catch a beat slightly off tempo, is exactly what Oral English's vowel and consonant questions are testing.",
        obj:["Distinguish vowel and consonant sounds, including diphthongs","Recognise rhyming word pairs","Read basic IPA (International Phonetic Alphabet) symbols with confidence","Identify silent letters, a classic WAEC trap"],
        exp:[
          {t:"Vowel sounds", b:"English vowels are far richer than the five letters A, E, I, O, U suggest, the very same letter 'a' sounds completely different in 'cat', 'car' and 'care'. WAEC's vowel questions are really asking whether your ear can catch these small but very real differences in sound, not just in spelling."},
          {t:"Consonant clusters", b:"Words like 'string' or 'thrift' stack two or three consonant sounds tightly together in one specific order, and swapping that order, or dropping a sound, changes the word entirely, 'string' said carelessly can start sliding toward 'sting'. Reading these clusters aloud slowly, sound by sound, trains your mouth and ear together."},
          {t:"Reading IPA symbols without panic", b:"The strange-looking symbols (/ɪ/, /iː/, /ʌ/, /æ/) aren't random, they're a standardised alphabet where each symbol always represents exactly one sound, unlike English spelling which is notoriously inconsistent. The colon-like mark ' ː ' simply means 'hold this vowel longer' - that's the entire difference between /ɪ/ (short, as in 'sit') and /iː/ (long, as in 'seat'). Learning even a handful of these symbols removes the guesswork from transcription questions entirely."},
          {t:"Silent letters - a classic trap", b:"Words like 'knife' (silent k), 'comb' (silent b), 'island' (silent s), and 'honest' (silent h) all contain letters that are written but never pronounced. WAEC likes testing these specifically because students who only look at spelling, rather than sound, get tricked into picking wrong rhyme or transcription answers based on letters that are never actually spoken."}
        ],
        err:["Confusing similar vowel sounds, e.g. /ɪ/ and /iː/","Dropping or reordering sounds within a consonant cluster","Judging rhyme or sound-matching questions by SPELLING instead of actual pronunciation","Forgetting that some letters in a word's spelling are completely silent"],
        qs:[
          Q("Which word contains the same vowel sound as 'seat'?",["Beat","Bit","Bet","But"],0,"'Seat' and 'beat' both contain the long vowel /iː/.","Medium"),
          Q("Which of these words contains a diphthong sound?",["'time' /aɪ/","'sit' /ɪ/","'bed' /e/","'put' /ʊ/"],0,"/aɪ/ is a diphthong - a glide between two vowel sounds.","Medium"),
          Q("Which pair of words rhyme?",["Cat / Hat","Cat / Cot","Cat / Cut","Cat / Coat"],0,"'Cat' and 'hat' share the same ending sound.","Easy"),
          Q("What is the correct phonetic transcription of the word 'hike'?",["/haɪk/","/hɪk/","/hiːk/","/hʌk/"],0,"'Hike' rhymes with 'bike' and is transcribed /haɪk/.","Medium",VP),
          Q("What is the correct phonetic transcription of the word 'purse'?",["/pɜːs/","/pʌs/","/pɔːs/","/piːs/"],0,"'Purse' rhymes with 'nurse' and is transcribed /pɜːs/.","Medium",VP),
          Q("What is the correct phonetic transcription of the word 'eye'?",["/aɪ/","/iː/","/eɪ/","/aʊ/"],0,"'Eye' is transcribed /aɪ/, the same diphthong as in 'time' or 'high'.","Easy",VP),
          Q("Which word contains a silent letter?",["Knife","Table","Pencil","Window"],0,"'Knife' has a silent 'k' - the word is pronounced /naɪf/.","Medium"),
          Q("The symbol ' ː ' after a vowel in IPA transcription indicates that the vowel sound should be",["held longer (a long vowel)","pronounced as a diphthong","completely silent","stressed with extra emphasis"],0,"The length mark ' ː ' signals a long vowel sound, distinguishing e.g. /iː/ from /ɪ/.","Medium"),
          Q("What is the correct phonetic transcription of the word 'tongue'?",["/tʌŋ/","/tɒŋ/","/toʊŋ/","/tuːŋ/"],0,"'Tongue' rhymes with 'young' and is transcribed /tʌŋ/.","Medium",VP),
          Q("What is the correct phonetic transcription of the word 'sergeant'?",["/sɑːdʒənt/","/sɜːdʒiːnt/","/sɛərdʒənt/","/sɜːgənt/"],0,"'Sergeant' has an irregular spelling but is pronounced like 'sarjent': /sɑːdʒənt/.","Hard",VP),
          Q("Which pair of words ends with the same sound?",["Mother and other","Mother and moth","Mother and motor","Mother and mode"],0,"'Mother' and 'other' both end in the same unstressed /ðə/ sound.","Medium",VP),
          Q("Which word contains the same vowel sound as the letter 'o' in 'money'?",["Coney","Bottle","Son","Port"],2,"'Money' has the vowel sound /ʌ/, matching 'son' /sʌn/.","Medium",VP),
          Q("Which word contains the same sound as 'our' in 'pour'?",["Ore","Favour","Hour","How"],0,"'Pour' ends in the sound /ɔː/, matching 'ore' /ɔː/.","Medium",VP),
          Q("Which word contains the same vowel sound as 'u' in 'put'?",["School","Cool","Fool","Wool"],3,"'Put' has the short vowel /ʊ/, matching 'wool' /wʊl/.","Medium",VP),
          Q("Which word contains the same sound as 'ai' in 'tailor'?",["Partake","Orchard","Dent","Torn"],0,"'Tailor' has the diphthong /eɪ/, matching 'partake' /pɑːteɪk/.","Medium",VP),
          Q("Which word contains the same vowel sound as 'a' in 'tale'?",["Said","Flat","Weight","Share"],2,"'Tale' has the diphthong /eɪ/, matching 'weight' /weɪt/.","Medium",VP)
        ]

      { id:"stress", name:"Oral English: Stress and Intonation",
        hook:"Try saying the sentence 'I never said she stole my money' seven times out loud, stressing a different single word each time - 'I never said...', 'I NEVER said...', 'I never SAID...' - and notice how the entire implied accusation shifts each time, even though not one word in the sentence has changed. That's emphatic stress quietly doing an enormous amount of work, and it's exactly the kind of subtlety WAEC's stress and intonation questions are built to test.",
        obj:["Identify word stress and shifts in stress between related words","Recognise the effect of sentence stress and intonation","Distinguish rising from falling intonation, and know when each is typically used","Apply the general noun/verb stress-shift pattern to unfamiliar word pairs"],
        exp:[
          {t:"Word stress shift", b:"Some English words secretly change their job depending purely on which syllable gets the stress, say 'IMport' (stress on the first part) and you mean the noun, goods brought into a country; say 'imPORT' (stress on the second part) and you mean the verb, the act of bringing them in. The spelling never changes; only the stress does, and that alone changes the meaning."},
          {t:"The general noun/verb pattern - a rule, not just isolated examples", b:"Many two-syllable English words follow a reliable pattern: as a NOUN, stress the FIRST syllable ('REcord', 'PREsent', 'CONtract'); as a VERB, stress the SECOND syllable ('re-CORD', 'pre-SENT', 'con-TRACT'). Knowing this general pattern lets you make an educated guess on an unfamiliar word pair in the exam, rather than needing to have memorised every single example in advance."},
          {t:"Emphatic/sentence stress", b:"Stressing a different word within an identical sentence changes what's really being emphasised or contrasted, even though the literal dictionary meaning of every word stays the same. 'I told HIM to go' quietly implies 'not someone else'; 'I told him to GO' implies 'not to stay', same six words, two very different unspoken messages."},
          {t:"Rising vs falling intonation - what each typically signals", b:"FALLING intonation (pitch drops toward the end) is the default for statements and most 'wh-' questions ('Where are you going?' ↘). RISING intonation (pitch climbs toward the end) is typical for yes/no questions ('Are you coming?' ↗) and for items in a list before the final one ('I bought rice↗, beans↗, and yam↘'). A rising tone at the end of an ordinary statement can even signal uncertainty or make it sound like a question by accident, which is exactly why WAEC tests recognising the difference."}
        ],
        err:["Placing stress on the wrong syllable in multi-syllable words","Assuming stress placement never changes meaning","Forgetting the general pattern that many noun/verb pairs stress the first syllable as a noun and the second as a verb","Confusing rising intonation (yes/no questions, list items) with falling intonation (statements, wh-questions)"],
        qs:[
          Q("In the word 'photograph', the primary stress falls on the",["first syllable","second syllable","third syllable","last syllable"],0,"PHO-to-graph carries stress on the first syllable.","Hard"),
          Q("In the word pair 'REcord' (noun) and 're-CORD' (verb), the difference is mainly one of",["stress placement","spelling","meaning only, with no sound change","number of syllables"],0,"Many English noun/verb pairs are distinguished purely by which syllable is stressed.","Medium"),
          Q("Saying 'I told HIM to go' (stressing 'him') versus 'I told him to GO' (stressing 'go') mainly changes the sentence's",["emphasis and implied contrast","grammatical tense","spelling","literal dictionary meaning of each word"],0,"Shifting stress changes what is being emphasised or contrasted, not the literal words.","Hard"),
          Q("Which of the following words is NOT stressed on the first syllable?",["Sketchy","Comma","Duty","Abrupt"],3,"'Abrupt' is stressed on the second syllable (a-BRUPT); the others are stressed on the first.","Medium",VP),
          Q("Which of the following words is NOT stressed on the second syllable?",["Humane","Purchase","Exchange","Request"],1,"'Purchase' is stressed on the first syllable (PUR-chase); the others are stressed on the second.","Medium",VP),
          Q("Which of the following words is stressed on the second syllable, unlike the others?",["Mango","Pepper","Bathroom","Cassette"],3,"'Cassette' is stressed on the second syllable (cas-SETTE); the others are stressed on the first.","Medium",VP),
          Q("Which of these words is stressed differently from 'window', 'table' and 'carpet', all of which are stressed on the first syllable?",["Kitchen","Enigma","Pencil","Ticket"],1,"'Enigma' is stressed on the second syllable (e-NIG-ma), unlike the other first-syllable-stressed words.","Hard",VP),
          Q("A yes/no question such as 'Are you coming?' is typically spoken with",["rising intonation toward the end","falling intonation toward the end","completely flat, unchanging pitch","no intonation pattern at all"],0,"Yes/no questions typically use rising intonation, unlike statements or wh-questions.","Medium"),
          Q("In the word pair 'PREsent' (noun, a gift) and 'pre-SENT' (verb, to give/show), the stress pattern follows the general rule that",["nouns often stress the first syllable, while the matching verb stresses the second","verbs always stress the first syllable","stress placement is random and unpredictable","both forms are always stressed identically"],0,"This word pair follows the common noun-first-syllable, verb-second-syllable stress pattern.","Medium"),
          Q("Which syllable of the word 'apathetic' carries the main stress?",["First","Second","Third","Fourth"],2,"'Apathetic' is stressed a-pa-THET-ic, on the third syllable.","Hard",VP),
          Q("In the sentence 'Thomas likes chocolate CAKE, not chocolate cookies,' the capitalised word CAKE receives emphatic stress mainly to",["contrast cake with cookies","indicate anger","ask a question","indicate a whisper"],0,"Emphatic stress here highlights the specific contrast being drawn between cake and cookies.","Medium",VP)
        ]
      }
    ]

      { id:"shakespeare", name:"Shakespeare (Antony and Cleopatra) and Unseen Passages",
        summary:[
          {t:"Antony and Cleopatra - the full story", b:"Mark Antony, one of the three rulers of Rome (alongside Octavius Caesar and Lepidus), has fallen deeply in love with Cleopatra, the Queen of Egypt, and spends most of his time in Egypt with her instead of attending to his duties in Rome. When war threatens and his wife Fulvia dies, Antony is pulled back to Rome, where he patches up his political alliance with Caesar by marrying Caesar's sister, Octavia - a marriage of convenience that devastates Cleopatra when she hears of it. Antony can't stay away from Egypt for long, though, and eventually abandons Octavia to return to Cleopatra, which Caesar treats as a declaration of war. In the decisive Battle of Actium, fought at sea, Cleopatra's ships flee the fighting, and Antony, unable to bear being apart from her, follows her instead of continuing the battle - a decision that costs him the war and much of his reputation as a soldier. As Caesar's forces close in on Egypt, Cleopatra, fearing Antony's rage after the defeat, sends him a false message that she has died. Believing this, and seeing no reason left to live, Antony falls on his own sword, only to be told the truth as he is dying and carried to Cleopatra to die in her arms. Rather than be captured and paraded through Rome as Caesar's trophy, Cleopatra kills herself by allowing a poisonous snake to bite her, choosing to die on her own terms as a queen rather than live as a conquered prisoner. Caesar, arriving too late to stop it, orders the two lovers buried together, acknowledging even in defeat the scale of their story. The play's key tension throughout is the pull between duty and desire - Rome's cold political discipline versus Egypt's passionate, sensory pleasure - and Antony is torn apart precisely because he can never fully choose one over the other."}
        ],
        hook:"Wemimo has exactly nine minutes left on the clock and three unanswered questions about a Shakespeare scene she's never actually memorised word for word. Instead of panicking, she does what every top scorer on this paper does: she looks at WHO is speaking, WHO they're speaking to, and what's happening around them in the scene - and suddenly the unfamiliar lines start making sense, because she isn't being tested on her memory, she's being tested on her understanding. That's the entire secret to Paper 1: it's built entirely on objective and context questions, so speed and sharp reading matter more here than deep essay-writing.",
        obj:["Answer context questions on the compulsory Shakespeare text","Apply general literary appreciation skills to unseen prose and poetry"],
        exp:[
          {t:"Context questions", b:"These test whether you understood WHO said something, WHEN in the story it happened, and WHY it matters - not whether you can recite the line word for word like a phone number. Imagine a friend forwards you a screenshot of a chat mid-conversation with no names attached - you can usually still tell who's speaking from tone and context alone, and that's exactly the instinct WAEC is testing here."},
          {t:"Unseen passages", b:"You genuinely cannot predict the exact unseen passage that will appear on exam day - but you CAN practise the underlying skill on any similar unfamiliar text: spot the theme, notice the tone, catch what's implied rather than stated outright. It's the same reading muscle a detective uses on a scene they've never visited before, applying a general skill to brand-new evidence."}
        ],
        err:["Trying to memorise the whole play word for word instead of understanding key scenes and relationships","Assuming an unseen passage matches a previously studied text exactly"],

          Q("A 'context question' in Literature mainly tests whether a student can",["identify who said a quoted line, when, and its significance","recite the whole play from memory","design a stage set","translate the play into another language"],0,"Context questions probe understanding of speaker, situation and significance.","Medium"),

      { id:"africandrama", name:"African Drama: Once Upon an Elephant & The Marriage of Anansewa",
        summary:[
          {t:"Once Upon an Elephant - the full story", b:"In a Yoruba kingdom, the reigning king grows old and ill without a clear, undisputed heir. Olaniyonu, his illegitimate son by a lesser wife, wants the throne badly, but by tradition he has a weak claim compared to other princes. The ambitious kingmaker Serubawon sees an opportunity to gain power for himself by backing Olaniyonu's claim, manipulating the sacred kingmaking rituals and sidelining respected elders like Odejimi and Ogundele who sense something is wrong but are outmanoeuvred. Once installed on the throne, Olaniyonu adopts the praise-name Ajanaku, meaning 'Elephant' - a name meant to suggest strength, but which quickly comes to describe his rule instead: heavy-footed, destructive, and crushing anyone in his path. He becomes increasingly tyrannical, ruling through fear rather than wisdom, ignoring the counsel of elders, and abusing traditional authority for personal gain, with Serubawon continuing to manipulate events from behind the scenes for his own benefit. Ordinary voices in the community, especially the elderly Iya Agba, who represents those with no formal power but plenty of moral authority, begin speaking out against the injustice. Over time, the accumulated resentment, the elders' quiet resistance, and the community's growing courage combine to destabilise Olaniyonu's grip on power, and his tyrannical reign eventually collapses. The play is essentially a cautionary tale about how power obtained through manipulation and illegitimate means, rather than genuine merit and tradition, tends to be exercised badly - and about how even ordinary people, acting together, can eventually resist a tyrant."},
          {t:"The Marriage of Anansewa - the full story", b:"Ananse, a poor and widowed father modelled on the trickster spider of West African folklore, cannot afford even his daughter Anansewa's school fees. Spotting an opportunity, he writes flattering, exaggerated letters to four wealthy chiefs in different towns, secretly proposing marriage between each of them and Anansewa, and collecting expensive gifts from each suitor as a show of good faith - all without any of the chiefs knowing about the others. His plan works beautifully at first, with gifts flowing in from every direction, but it spirals into chaos the moment several of the chiefs decide, around the same time, to actually travel to collect their bride. Suddenly faced with multiple suitors arriving to claim the same daughter, Ananse is forced into an increasingly frantic series of lies and improvisations to avoid being exposed and to avoid offending any of the powerful men involved. His boldest move is faking Anansewa's sudden death, hoping to buy time and quietly settle which suitor will 'discover' she is actually alive and marry her once the others have been sent away disappointed. Through a combination of nerve, quick thinking, and comic timing, Ananse's scheme, chaotic as it is, eventually resolves in Anansewa's favour, and the play closes on a note of triumph for the trickster rather than punishment. Structured in the storytelling tradition of Ananse folktales (Anansesem), the play uses comedy to explore serious themes: the pressures of poverty, the commodification of marriage and women within it, and the cunning survival tactics of someone with very little real power in a rigid, hierarchical society."}
        ],
        hook:"Two class debate teams once prepared for a school competition, each expecting a different topic - but on the actual day, only ONE topic was drawn from the hat, and the team that had split its attention evenly between both topics arrived far less sharp than the team that had gone deep on just one. That's exactly the trap to avoid with African Drama: 'Once Upon an Elephant' and 'The Marriage of Anansewa' are both on the list, but any one class studies only one of them, and going genuinely deep on that single play always beats a shallow, split understanding of both.",
        obj:["Discuss character, theme and structure in the studied African Drama text","Analyse the play as a work intended for the stage"],
        exp:[
          {t:"Choosing a focus", b:"Since only ONE African Drama question needs answering on exam day, most students focus deeply on whichever of the two plays their class actually studied, rather than thinly covering both at once - depth wins over breadth here, exactly like the debate team that prepared for one topic properly."},
          {t:"Once Upon an Elephant (Bosede Ademilua-Afolayan)", b:"Olaniyonu, the illegitimate son of an ailing king, is helped onto the throne by the scheming kingmaker Serubawon, against the objections of respected elders like Odejimi and Ogundele. Once crowned, Olaniyonu takes the fitting nickname Ajanaku - 'Elephant' - and rules exactly like one: heavy-handed, destructive and increasingly out of control. It takes ordinary community voices, especially the elder Iya Agba speaking up for people with no other power, to eventually help bring his tyrannical reign crashing down. Theme: the abuse of power, and how a community can eventually resist tyranny."},
          {t:"The Marriage of Anansewa (Efua Sutherland)", b:"Ananse is broke, widowed, and can't even afford his daughter Anansewa's school fees - so he comes up with a scheme worthy of his folklore namesake, the trickster spider: he writes exaggerated letters to four wealthy chiefs, each one secretly promised Anansewa's hand in marriage, hoping to profit from their competing gifts. The plan spirals hilariously out of control once more than one chief is ready to actually marry her, forcing Ananse into an increasingly desperate string of lies - including faking his own daughter's death - until his cunning somehow pulls off a happy ending anyway. Theme: greed and trickery around marriage in a changing, post-colonial society, told through the comic spirit of Ananse folktales (Anansesem)."},
          {t:"Reading drama as performance", b:"Imagine watching a movie with the subtitles on but the sound completely off - you'd miss the tone of voice, the pause before a big reveal, the character storming out mid-sentence. Stage directions in a play script are exactly that missing soundtrack; a simple direction like '(quietly, not looking at her father)' can completely change the emotional meaning of the words that follow it."}
        ],
        err:["Trying to study both prescribed African Drama texts equally instead of going deep on one","Ignoring stage directions when analysing a scene's mood"],
        qs:[
          Q("Candidates answering the African Drama section on Paper 2 are required to answer",["one question, on the text they studied","both prescribed texts fully","no question in this section","a question about Non-African Drama instead"],0,"Only one question per section is required, and only one text needs to be studied.","Easy"),
          Q("'The Marriage of Anansewa' is written by",["Efua Sutherland","Bosede Ademilua-Afolayan","Wole Soyinka","J. B. Priestley"],0,"Efua Sutherland is the playwright behind this text.","Easy"),
          Q("When studying a play rather than a novel, it's especially important to pay attention to",["stage directions and how lines are meant to be performed","chapter numbers","footnotes only","the publisher's preface exclusively"],0,"Drama's meaning often depends on performance cues beyond the dialogue itself.","Medium"),
          Q("In 'Once Upon an Elephant', Olaniyonu's rise to the throne is made possible mainly through the scheming of",["Serubawon","Iya Agba","Odejimi","Ogundele"],0,"Serubawon manipulates the kingmaking process to install Olaniyonu against tradition.","Medium"),
          Q("Olaniyonu earns the nickname 'Ajanaku' (Elephant) mainly because of his",["heavy-handed, destructive style of rule once in power","physical size","love of hunting","great wealth before becoming king"],0,"Like an elephant, his reign is powerful but destructive and hard to control.","Medium"),
          Q("In 'The Marriage of Anansewa', Ananse's central scheme involves",["promising his daughter's hand in marriage to multiple wealthy chiefs at once","refusing all of his daughter's suitors","marrying off his aunt Ekuwa instead","selling the family farm"],0,"Ananse writes to four chiefs, each unaware of the others, hoping to profit from their gifts.","Medium"),
          Q("The crisis in 'The Marriage of Anansewa' peaks when Ananse is forced to pretend that",["Anansewa has died","he himself is a chief","Anansewa is already married","he has no daughter"],0,"Ananse fakes Anansewa's death to manage the chiefs' competing claims without offending them.","Medium")
        ]

      { id:"drama", name:"Non-African Drama: An Inspector Calls & A Man for All Seasons",
        summary:[
          {t:"An Inspector Calls - the full story", b:"The wealthy Birling family is celebrating their daughter Sheila's engagement to Gerald Croft when a police inspector, Inspector Goole, arrives unannounced to investigate the suicide of a young working-class woman, Eva Smith. One by one, the Inspector reveals that every single person in the room played a part in Eva's downward spiral: Mr Birling fired her from his factory for organising a pay protest; Sheila had her fired from a shop out of jealous spite; Gerald had an affair with her, then abandoned her; Mrs Birling, running a charity, refused to help her when she came asking for aid while pregnant and desperate; and the Birlings' son Eric, it turns out, was the father of that child, having gotten her pregnant and stolen money to support her. As each character's connection is exposed, they react very differently - Sheila and Eric are genuinely horrified and take real responsibility, while Mr and Mrs Birling stay defensive and dismissive, more worried about scandal than about the girl who died. After the Inspector leaves, the family discovers there is no official record of an 'Inspector Goole' on the police force, and no hospital has any dead girl matching the description - leading the older Birlings to conclude it was all an elaborate hoax and that they can simply forget the whole uncomfortable evening. Their relief is shattered by a final phone call: an actual police inspector is on his way to the house to investigate the actual suicide of a young woman, exactly as described. The play is a tight moral thriller built around collective social responsibility - the idea that in an interconnected society, our individual choices ripple outward and genuinely affect the lives of others, whether or not we're ever caught or made to answer for it."},
          {t:"A Man for All Seasons - the full story", b:"Sir Thomas More, a respected lawyer and devout Catholic serving as Lord Chancellor of England, finds himself caught between his loyalty to King Henry VIII and his religious conscience when the King wants to divorce his wife, Catherine of Aragon, in order to marry Anne Boleyn - a divorce the Catholic Church, and the Pope specifically, refuses to grant. Henry breaks from the Catholic Church entirely, establishes the Church of England with himself at its head, and demands that his officials publicly swear an oath recognising this new arrangement and his authority over it. More, unwilling to violate his own conscience by swearing to something he believes is religiously false, tries to protect himself through careful legal silence - refusing to either support or publicly oppose the King's actions, reasoning that silence cannot legally be treated as treason. This strategy holds for a while, costing him his position and wealth, and putting real strain on his family, who don't always understand why he won't simply compromise to keep them safe. Eventually the King's officials manufacture a way around his silence: Richard Rich, a young man More once refused to help advance his career, is bribed into perjuring himself, falsely testifying that More spoke treasonous words in private. On this false evidence, More is convicted and sentenced to death, going to his execution calmly and with his integrity fully intact, choosing to die rather than betray his own conscience. The play is essentially a study of moral integrity under extreme political pressure - the question of what a person owes to their own conscience when it collides directly with the demands of power, and what it costs to hold that line all the way to the end."}
        ],
        hook:"Imagine a stranger walks into your family dinner and, one by one, reveals a secret each person has been hiding - and by the end, everyone realises they played a part in someone else's downfall. That eerie, tense dinner is basically the plot of 'An Inspector Calls', one of two prescribed Non-African Drama options. The other option, 'A Man for All Seasons', trades the dinner table for a royal court, where a quietly stubborn man risks everything rather than say something he doesn't believe - same exam skills, completely different setting.",
        obj:["Analyse character motivations in the studied Non-African Drama text","Discuss the play's central themes"],
        exp:[
          {t:"The Inspector's role (An Inspector Calls)", b:"He isn't investigating like a normal detective - think of him more like a mirror the playwright holds up so the family, and the audience, see their own selfishness reflected back at exactly the moment they'd rather look away."},
          {t:"The alternative text (A Man for All Seasons)", b:"Robert Bolt's play dramatises Sir Thomas More's real historical conflict of conscience with King Henry VIII - a man quietly refusing to say something he doesn't believe, even as the pressure to simply go along with power grows unbearable. If your class studied this instead, the same exam-answering principles (theme, character motivation, structure) still apply."}
        ],
        err:["Confusing the playwright's message with a single character's opinion","Ignoring stage directions when analysing mood"],
        qs:[
          Q("'An Inspector Calls' was written by",["J. B. Priestley","Arthur Miller","Robert Bolt","George Bernard Shaw"],0,"The play is by J. B. Priestley.","Easy"),
          Q("The Inspector in the play primarily functions to",["expose the family's collective guilt and prompt reflection on social responsibility","serve as comic relief","arrest a suspect for a minor crime","act as a family friend with no wider purpose"],0,"Inspector Goole is a symbolic device probing the family's conscience.","Medium"),
          Q("'A Man for All Seasons' by Robert Bolt centres on the conflict between Sir Thomas More and",["King Henry VIII","the French monarchy","the Roman Senate","a fictional dictator"],0,"The play dramatises More's real historical clash with Henry VIII over conscience and loyalty.","Medium"),
          Q("The play 'An Inspector Calls' is structured mainly around",["a single evening in one setting","several years across multiple settings","a courtroom trial","a flashback narrated by a child"],0,"The play unfolds in real time in the Birling dining room.","Easy")
        ]
      },
      { id:"apoetry", name:"African Poetry (2026-2030 set: Okara, Kamara, Soyinka, Osundare, Afriyie-Vidza, Cheney-Coker)",
        summary:[
          {t:"What ties these six poems together", b:"Each poem on this list wrestles with a different piece of the African experience, but nearly all of them share one thread: the tension between something being lost (innocence, tradition, safety, an old way of speaking or living) and something new taking its place, not always for the better. Reading them side by side, rather than in isolation, makes each individual poem's argument much clearer."},
          {t:"Okara - 'Once Upon a Time'", b:"An older man speaks directly to his son, mourning how adulthood and 'modern' social life have taught him to smile with his mouth while his eyes stay cold, to shake hands while hiding his heart, and to say one thing while meaning another - a complete loss of the genuine warmth he remembers from childhood. He ends by asking his son to teach him how to be his real self again, the way children still are, since he's forgotten how."},
          {t:"Kamara - 'New Tongue'", b:"Written in free verse across several uneven stanzas and told in the third person ('they'), the poem describes a new generation that speaks a 'new tongue', dances new dances, and lets its minds 'turn inwards, only inwards' toward individualism. Family and friendship ties are 'loosened, broken, burnt', their remains pictured as ashes scattered into the sea while indifferent fish swim past, 'careless of the loss'. The poem never blames any single person, it simply observes a slow, generational drift away from heritage, and the tone stays somber and reflective rather than angry, more grief than accusation."},
          {t:"Soyinka - 'Night'", b:"Using night as an extended image, the poem explores how darkness can be simultaneously peaceful and threatening, a time of rest but also of hidden danger, reflecting the complicated, double-edged nature of the world it describes."},
          {t:"Osundare - 'Not My Business'", b:"The speaker repeatedly insists that other people's suffering, disappearances and persecutions under an oppressive regime are 'not his business', keeping his head down for his own safety, until the trouble finally arrives at his own door, and there is no one left to speak up for him. It's a sharp warning against staying silent while injustice happens to others."},
          {t:"Afriyie-Vidza - 'Hearty Garlands'", b:"A panegyric (formal praise poem) written for an elder's 85th birthday, structured across seven five-line stanzas. The speaker describes the celebrant's long life as one that 'blooms into stark beauty', where even failures left no 'trite, crippling regrets'. Vivid images like a 'mahogany chest' beaten in pride capture his strength and resilience, while personified Hope and Heart are said to 'nod' rather than nag. The poem insists 85 isn't an ending either, it says 'higher tasks still' remain for the celebrant to accomplish, treating old age as continued purpose, not retirement from it."},
          {t:"Cheney-Coker - 'The Breast of the Sea'", b:"Across three free-verse stanzas totalling around 20 lines, the poem pictures the sea 'groaning under its weight, somewhere between breasts and anus', a jarring image holding nurture and waste in the same body. The sea has witnessed everything: Noah's Ark, the Middle Passage, the Titanic, and closer to home, Sierra Leone's own civil war and Nigeria's before it. The poem's real question, whether this same sea can finally heal the wounds it has witnessed for centuries, is never confidently answered; it closes on uncertainty rather than hope, suggesting true justice and healing remain just out of reach."}
        ],
        hook:"Efe's grandmother never once opens a textbook to teach a lesson - instead she tells a short, vivid story about a foolish tortoise, and somehow the whole family remembers the point about greed for years afterward. That's the oral tradition quietly running underneath several of these African poems: wisdom carried through vivid images, rhythm and repetition rather than a direct lecture, exactly the way it's been passed down for generations, long before anyone wrote a single word of it in a textbook.",
        obj:["Discuss the theme and central idea of each of the 6 prescribed African poems","Identify poetic devices and how they support meaning in each poem"],
        exp:[
          {t:"Okara - Once Upon a Time", b:"A father tells his son how adults have learned to fake warmth - smiling with only their teeth, shaking hands without real feeling - and quietly hopes to unlearn that fakeness and recover his child's honesty. Theme: lost sincerity in adult life, and the hope of reclaiming it."},
          {t:"Kamara - New Tongue", b:"A poem about a younger generation adopting a new language and culture so completely that ties to family and tradition are quietly cut loose, pictured as ashes scattered into the sea while indifferent fish swim past. Theme: cultural erosion and generational disconnection, told with sadness rather than anger."},
          {t:"Soyinka - Night", b:"A dense, image-heavy poem where night is felt almost as a physical, oppressive force pressing in on the speaker, mixed with unsettling sea imagery. Theme: dread and being overwhelmed by darkness, read both literally and symbolically."},
          {t:"Osundare - Not My Business", b:"People around the speaker are taken away or lose their jobs one by one, and each time he shrugs it off as none of his business - until the trouble finally reaches his own door. Theme: the danger of staying silent about injustice done to others."},
          {t:"Afriyie-Vidza - Hearty Garlands", b:"A warm birthday tribute (panegyric) to an elderly, accomplished figure turning 85, celebrating a life that 'blooms into stark beauty' and insisting real purpose, not retirement, still lies ahead. Theme: honouring elders and a life of achievement."},
          {t:"Cheney-Coker - The Breast of the Sea", b:"The sea is pictured as both nurturing 'breast' and waste-filled 'anus' in the same image, a silent witness to centuries of human history and suffering, from Noah's Ark and the Middle Passage to Sierra Leone's own civil war, and is asked whether it can also heal the wounds of a nation scarred by conflict. The poem closes without a confident answer. Theme: history, suffering and the uncertain search for healing."}
        ],
        err:["Reading these poems only literally, missing the proverbial or cultural layers","Discussing only one poem's theme when a question expects comparison across two"],
        qs:[
          Q("In Okara's 'Once Upon a Time', the father mainly regrets that adults have learned to",["show warmth and friendliness they don't genuinely feel","speak too many local languages","spend too much time working","travel too often"],0,"The poem laments how adult social gestures - smiles, handshakes - have become insincere.","Medium"),
          Q("Kamara's 'New Tongue' is primarily concerned with",["a younger generation cutting ties with family tradition in favour of a new culture and language","a war between two nations","a celebration of a wedding","the beauty of nature in springtime"],0,"The poem mourns a generation's disconnection from inherited language and tradition.","Medium"),
          Q("Osundare's 'Not My Business' uses a repeated refrain mainly to",["highlight the speaker's growing, then broken, indifference to others' suffering","list types of food","celebrate a festival","describe a landscape"],0,"The refrain tracks the speaker's detachment until injustice finally reaches him personally.","Medium"),
          Q("Afriyie-Vidza's 'Hearty Garlands' is best described as a",["celebratory tribute poem for an elder's birthday","a lament for a fallen soldier","a satire on politicians","a nursery rhyme"],0,"It is a warm, celebratory birthday tribute honouring a long, accomplished life.","Easy"),
          Q("In Cheney-Coker's 'The Breast of the Sea', the sea is mainly presented as",["a witness to centuries of human history and suffering","a source of comic relief","an entirely healed, untroubled place","a minor, unimportant background detail"],0,"The poem reflects on the sea's long memory of historical suffering, including its inability to fully heal Sierra Leone's wounds.","Hard"),
          Q("In Elizabeth Kamara's 'New Tongue', the phrase 'new tongue' primarily refers to",["a child learning to speak for the first time","the adoption of a foreign language and culture","a newly discovered tribal dialect","the physical loss of the ability to speak"],1,"'New tongue' symbolises the new generation embracing foreign language and culture in place of their own.","Medium",VP),
          Q("'New Tongue' by Elizabeth Kamara is mainly narrated from which point of view?",["First person, 'I'","Second person, 'you'","Third person, 'they'","An omniscient narrator addressing the reader directly"],2,"The poem consistently describes the new generation using the third-person pronoun 'they'.","Medium",VP),
          Q("In 'New Tongue', the image of ashes 'strewn into the bottomless sea' while fish swim by 'careless of the loss' mainly suggests",["the new generation's indifference to the loss of their cultural ties","a literal fishing expedition","a religious burial ceremony","environmental pollution of the ocean"],0,"The scattered ashes represent broken family and heritage ties, and the indifferent fish mirror the generation's own carelessness about that loss.","Hard",VP),
          Q("'Hearty Garlands' by S.O.H. Afriyie-Vidza is written to celebrate",["a national independence day","an elder's 85th birthday","a wedding ceremony","a graduation ceremony"],1,"The poem is a birthday tribute marking the celebrant's 85th year.","Easy",VP),
          Q("The poem 'Hearty Garlands' is best classified as a",["panegyric (formal praise poem)","elegy (poem mourning a death)","satire mocking old age","love poem to a spouse"],0,"A panegyric is a poem of formal praise, exactly matching this birthday tribute's purpose and tone.","Medium",VP),
          Q("The image of life 'blooming into stark beauty' despite failures giving no 'trite, crippling regrets' suggests that the celebrant",["regrets most of the decisions made in his life","has lived a fulfilling life without being crushed by past failures","has never experienced any failure at all","is bitter about growing old"],1,"The imagery celebrates a life that stayed beautiful and purposeful despite setbacks, without being weighed down by regret.","Hard",VP),
          Q("Cheney-Coker's 'The Breast of the Sea' draws on historical references including",["Noah's Ark, the Middle Passage, and Sierra Leone's civil war","only Ancient Egyptian history","only 21st century events","entirely fictional, invented events"],0,"The poem spans biblical, transatlantic slave trade, and recent West African historical references.","Hard",VP),
          Q("The poem's closing tone toward the possibility of the sea healing history's wounds is best described as",["confidently triumphant","ambiguous and uncertain, leaning pessimistic","angrily dismissive of the idea entirely","purely comic"],1,"The poem questions whether true healing and justice are achievable, ending without a confident resolution.","Hard",VP)
        ]
      },
      { id:"npoetry", name:"Non-African Poetry (2026-2030 set: Byron, Chaucer, Heaney, Angelou, Adcock, Gibson)",
        summary:[
          {t:"What ties these six poems together", b:"These six poems span different centuries and countries, but most circle around a private emotional moment, grief, love, a shock, a memory, examined closely and personally rather than as a grand public statement. Reading each one as 'what is this speaker feeling, right now, and why' unlocks most of what WAEC will ask."},
          {t:"Byron - 'She Walks in Beauty'", b:"The speaker admires a woman's beauty, comparing it to the peaceful blending of light and darkness in a clear night sky, and argues that her outward physical harmony reflects a calm, good, virtuous character within - beauty here is a sign of inner goodness, not just physical appeal."},
          {t:"Chaucer - an extract from The Canterbury Tales", b:"Chaucer's writing offers a vivid, often gently satirical portrait of medieval characters and society, using sharp observation and wit to reveal personality and social type through small, telling details of appearance and behaviour."},
          {t:"Heaney - a poem of memory and place", b:"Seamus Heaney's poetry typically roots itself in specific, closely observed rural or personal detail, memories of family, land, and labour, using these concrete images to reach toward larger reflections on identity, loss, or belonging."},
          {t:"Angelou - a poem of resilience", b:"Maya Angelou's poetry often speaks with a strong, defiant first-person voice, addressing oppression or hardship directly and asserting the speaker's unbroken dignity and determination to rise above it."},
          {t:"Adcock - 'The Telephone Call'", b:"A speaker receives an exciting phone call informing her she's won a wonderful prize, only for the call to reveal, step by step, that it's actually a strange promotional trick, the 'prize' being nothing more than the manufactured experience of almost winning. It's a sharp, wry poem about false hope and manipulation dressed up as good news."},
          {t:"Gibson - 'The Stone'", b:"A stonecutter is approached by a young woman asking him to carve a gravestone, and as their conversation unfolds, it becomes clear she is grieving her lover, who died in a quarry accident, using restrained, quiet dialogue to convey the weight of sudden, senseless loss."}
        ],
        hook:"Calling your best friend 'a rock' when they've supported you through a hard week isn't literally true - nobody is made of stone - but the image instantly captures something plain words alone couldn't say as quickly. Poets lean on exactly this trick constantly, and this set of six poems ranges from a scam phone call to a grieving stonemason, each one testing your eye for exactly how a poet builds a picture instead of simply stating a fact.",
        obj:["Discuss the theme and central idea of each of the 6 prescribed non-African poems","Identify figures of speech and their effects in each poem"],
        exp:[
          {t:"Byron - She Walks in Beauty", b:"A tribute to a woman whose outward beauty is presented as a perfect balance of light and dark, mirroring an inner goodness and peace of mind. Theme: ideal beauty as a reflection of inner virtue."},
          {t:"Chaucer - The Nun's Priest's Tale (shortened)", b:"Introduces a poor widow and her prized rooster, described in exaggerated, almost royal language that comically clashes with her humble farmyard life - a classic mock-heroic technique. Theme: gentle satire through inflated language describing ordinary life."},
          {t:"Heaney - Digging", b:"The poet watches his father dig in the garden and remembers his grandfather's skilled labour cutting turf, then resolves to 'dig' in his own way - with his pen - carrying the family's work ethic into a different craft. Theme: honouring inherited labour while choosing a different path."},
          {t:"Angelou - Still I Rise", b:"A defiant, celebratory poem asserting unbreakable resilience and pride in the face of oppression and historical pain. Theme: resilience, dignity and rising above attempts to diminish you."},
          {t:"Adcock - The Telephone Call", b:"A satirical narrative about a caller who is told she's won a huge cash prize, only to discover the 'prize' is just the emotional experience itself, with no real money at all. Theme: satire of scams and empty commercial promises."},
          {t:"Gibson - The Stone", b:"A grieving young woman asks a stonemason to carve her dead lover's name on a gravestone; her silent, unmoving grief is portrayed through repetition and restrained, quiet detail. Theme: the quiet, consuming nature of grief."}
        ],
        err:["Confusing which poem a described technique or theme belongs to","Missing the ironic/satirical tone in Chaucer's or Adcock's poem and reading them too literally"],
        qs:[

      { id:"africanprose", name:"African Prose: So the Path Does Not Die & Redemption Road",
        summary:[
          {t:"So the Path Does Not Die - the full story", b:"Finaba, known as Fina, grows up in the village of Talaba in Sierra Leone, where as a young girl her community attempts to carry out her female circumcision as a rite of passage into womanhood. Her father unexpectedly intervenes and stops the ceremony midway, an act the community considers a deep insult to tradition, and one that quietly shapes how Fina is seen by her community for years afterward, caught between having gone through part of the ritual and not having completed it in the community's eyes. As she grows up, Fina moves to Freetown for school and later to Koidu for work, gradually building a life that increasingly pulls her away from the traditions of her childhood village. Eventually, with the help of Meredith, a Peace Corps volunteer turned close friend and mentor, Fina emigrates to the United States, building a new career and a new sense of self far from Talaba. She becomes engaged to Cammy, a Trinidadian doctor, but their relationship is tested when her circumcision, and her complicated feelings about it, becomes an issue between them, forcing Fina to confront how much of her past she has actually resolved versus simply left behind. The novel eventually brings Fina back to Sierra Leone to face her history directly, exploring whether it is possible to genuinely reconcile the traditional world she came from with the modern, diasporic life she has built, and what 'home' really means for someone who no longer fully belongs to either place."},
          {t:"Redemption Road - the full story", b:"Bendu Lewis is a survivor of Liberia's brutal civil war, during which she was captured and held by a rebel commander known as Commander Cobra, experiencing trauma that has shaped the rest of her life. Years after the war ends, Bendu works in Monrovia as a counsellor, helping other war survivors process their own trauma, having built a career out of the very pain she herself experienced. Her carefully rebuilt life is thrown into turmoil when she discovers that Commander Cobra is still alive, now living under a new identity as a respected community figure named Moses Varney, having successfully hidden his violent past from almost everyone around him. Bendu is forced to decide whether to pursue justice and publicly expose him, a path that would mean reopening her own deepest wounds and risking her hard-won stability, or to let the past stay buried for the sake of her own peace. Around her, the novel follows an entire family and community also grappling with their own unresolved wartime experiences, showing that Bendu's personal struggle mirrors a much larger, national reckoning with Liberia's violent recent history. The novel builds toward a confrontation between Bendu and Moses Varney, testing whether genuine justice, forgiveness, or some uneasy combination of both is truly possible after such profound harm. Its central argument is that 'redemption' is never a single clean, triumphant moment, but a long, difficult, and uneven process each person and each community has to work through in their own time and their own way."}
        ],
        hook:"Tolani's cousin visits from another school and insists her own book, 'Redemption Road', is definitely the harder one on the syllabus, while Tolani argues 'So the Path Does Not Die' has trickier themes. The truth is neither opinion matters much on exam day, because WAEC only ever asks about the ONE African Prose text a student's own class actually studied - depth beats debate every time. Both novels follow young people navigating enormous pressure, from tradition and modernity in Sierra Leone to Liberia's civil war, and both reward a student who tracked exactly how the protagonist changes from the first page to the last.",
        obj:["Discuss character, theme and structure in the studied African Prose text","Trace how setting shapes events in the studied novel"],
        exp:[
          {t:"Choosing a focus", b:"As with drama, only ONE African Prose question needs answering - depth on your studied text beats shallow familiarity with both."},
          {t:"So the Path Does Not Die (Pede Hollist)", b:"Finaba 'Fina' Marah's story begins on the night her community tries to carry out her circumcision in her home village of Talaba - an interruption by her father that the community considers unforgivable. That single night sets Fina on a lifelong journey through school in Freetown, a job in Koidu, and eventually a new life in America, helped by her boss and friend Meredith, as she tries to work out what 'home' really means once she no longer fully belongs to either place. Her engagement to Cammy, a Trinidadian doctor, later forces the same question back into her life, since their very different attitudes to her circumcision become a genuine test of whether two people from different worlds can truly understand each other."},
          {t:"Redemption Road (Elma Shaw)", b:"Bendu Lewis survived Liberia's brutal civil war, but survival isn't the same as healing. Years later, working as a counsellor for other war survivors in Monrovia, she comes face to face with the very warlord who once held her captive - now going by a new name, Moses Varney. Bendu must decide whether pursuing justice against him is worth reopening her own most painful secret from the war. Around her, an entire family and community work through their own private reckonings with the past, reinforcing the novel's real argument: redemption isn't a single triumphant moment, but a long, uneven process each person has to find their own way through."},
          {t:"Reading prose analytically", b:"Track how the protagonist changes across the novel - most exam questions revolve around character development, conflict, and how setting shapes events."}
        ],
        err:["Trying to study both prescribed African Prose texts equally instead of going deep on one","Summarising plot without analysing character development or theme"],
        qs:[
          Q("Candidates answering the African Prose section on Paper 3 are required to answer",["one question, on the text they studied","questions on both prescribed novels","no question at all","a question on Shakespeare instead"],0,"Only one question per prose section is required.","Easy"),
          Q("'So the Path Does Not Die' is written by",["Pede Hollist","Elma Shaw","Harper Lee","Susanne Bellefeuille"],0,"Pede Hollist is the author of this African Prose text.","Easy"),
          Q("'Redemption Road' by Elma Shaw is set against the backdrop of",["Liberia's civil war era","Ancient Rome","Victorian England","World War II Europe"],0,"The novel is set during Liberia's civil war period.","Medium"),
          Q("In 'So the Path Does Not Die', Fina's move to the United States is made possible mainly through the help of",["her boss and friend Meredith","her fiancé Cammy","her mother Nabou","her grandmother Baramusu"],0,"Meredith helps Fina immigrate and start a new life in America.","Medium"),
          Q("Fina's engagement to Cammy in 'So the Path Does Not Die' is complicated mainly by their differing attitudes toward",["her past experience with female circumcision","his career as a doctor","where they should live","his family's wealth"],0,"Their contrasting views on her circumcision threaten their impending marriage.","Hard"),
          Q("In 'Redemption Road', Bendu's pursuit of justice is triggered by the reappearance of",["Commander Cobra, now living under the name Moses Varney","her missing daughter","her grandmother, Granny May","her ex-husband Terrance"],0,"Bendu recognises her former captor, now going by a new identity, and resolves to hold him accountable.","Medium"),
          Q("A theme running through both 'So the Path Does Not Die' and 'Redemption Road' is",["the long, difficult process of healing and finding belonging after trauma","the celebration of arranged marriage","the benefits of colonial education","the superiority of urban over rural life"],0,"Both novels centre on protagonists working through trauma toward healing and a sense of home.","Medium")
        ]
