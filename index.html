      </div>`;
    }).join("");

    return `
    <div class="guardian-child-card">
      <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
        <div style="flex-shrink:0;">${weekRingSVG(c.last_7_days, c.studied_today, c.username)}</div>
        <div style="flex:1;min-width:200px;">
          <div style="font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--ink);">${c.username}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Joined ${new Date(c.joined).toLocaleDateString()}</div>
          ${c.studied_today
            ? `<div style="font-size:13px;color:#166534;">✅ Studied today: <b>${(c.subjects_today||[]).map(sid=>{const s=findSubject(sid);return s?s.name:sid;}).join(", ")}</b></div>`
            : `<div style="font-size:13px;color:#92400E;">🕒 Hasn't opened a subject yet today.</div>`}
          ${weakest.length ? `<div style="font-size:12.5px;margin-top:8px;color:var(--ink-soft);">Needs attention: <b style="color:var(--ink);">${weakest.map(s=>s.name).join(", ")}</b></div>` : ""}
          ${strongest.length ? `<div style="font-size:12.5px;color:var(--ink-soft);">Doing well in: <b style="color:var(--ink);">${strongest.map(s=>s.name).join(", ")}</b></div>` : ""}
          ${untouched.length ? `<div style="font-size:12.5px;color:#92400E;">Never opened: <b>${untouched.map(s=>s.name).join(", ")}</b></div>` : ""}
        </div>
      </div>
      <div style="margin-top:14px;">${subjRows}</div>
    </div>`;
  }).join("");

  return `
  <div class="admin-dash">
    <div class="admin-head">
      <h2>👪 ${state.guardianUsername}'s Guardian Dashboard</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="ghost-btn" onclick="guardianToggleLinkForm()">➕ Link a child</button>
        <button class="ghost-btn" onclick="guardianRefresh()" ${state.guardianBusy?"disabled":""}>${state.guardianBusy?"Refreshing...":"↻ Refresh"}</button>
        <button class="ghost-btn" onclick="guardianLogout()">Log out</button>
      </div>
    </div>
    ${state.guardianError ? `<div class="auth-error">${state.guardianError}</div>` : ""}
    ${linkForm}
    ${children.length ? childCards : `
      <div class="section-block" style="text-align:center;padding:40px 20px;">
        <p style="color:var(--ink-soft);">No children linked yet. Click "Link a child" above to start monitoring their progress.</p>
      </div>`}
    <div class="ai-grading-disclaimer">This dashboard shows real, live data. Refresh any time for the latest.</div>
  </div>`;
}

function renderSubjectView(){

  const lastMock = mocks.length ? mocks[mocks.length-1] : null;

  const toc = s.topics.map(t=>{
    const st = topicStat(s.id, t.id);
    const acc = st.attempted ? Math.round((st.correct/st.attempted)*100) : null;
    return `<div class="toc-item" onclick="go('topic',{subjectId:'${s.id}',topicId:'${t.id}'})">

  const cov = UPLOAD_COVERAGE[s.id];
  const ov = SUBJECT_OVERVIEWS[s.id];
  const overviewBlock = ov ? `

    <div class="subject-overview-art">${ov.art}</div>

  const examFormatBlock = s.examFormat ? `
    <div class="subject-panel" style="margin-top:18px;">
      <h4>OFFICIAL WAEC EXAM FORMAT</h4>
      <p class="big-note">${s.examFormat}</p>
    </div>` : "";

  const checklistBlock = s.syllabusChecklist ? `

      <summary style="cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--purple);">FULL OFFICIAL SYLLABUS CHECKLIST (click to expand) 📋</summary>

      ${s.syllabusChecklist.map(sec=>`<h4 style="margin-top:14px;">${sec.section}</h4><ul class="bullets">${sec.items.map(i=>`<li>${i}</li>`).join("")}</ul>`).join("")}

function renderTheoryAttempt(){
  if(!theoryAttempt){ return renderTheoryList(); }
  const s = findSubject(theoryAttempt.subjectId);
  const q = theoryAttempt.question;

  if(theoryAttempt.grading){
    return `
    <div class="crumbs"><button onclick="go('home')">Subjects</button> / <button onclick="go('subject',{subjectId:'${s.id}'})">${s.name}</button> / <button onclick="go('theorylist',{subjectId:'${s.id}'})">Theory &amp; Essay</button> / Grading</div>
    <div class="theory-prompt-card"><div class="tp-marks">${q.marks} MARKS</div><p>${q.q}</p>${q.diagram?`<div class="q-diagram" style="background:#fff;margin-top:14px;">${q.diagram}<div class="q-diagram-note">Diagram - not drawn to scale</div></div>`:""}</div>
    <div class="grading-status">📖 Reading your answer and grading it against the marking guide…</div>
    `;
  }

  if(theoryAttempt.result){
    const r = theoryAttempt.result;
    const resultHtml = r.raw ? `<div class="grade-section"><p>${r.text}</p></div>` : `
      <div class="grade-score-badge">${r.score}/${r.maxMarks}</div>
      <div class="grade-section"><h4>WHAT YOU DID WELL</h4><p>${r.strengths}</p></div>
      <div class="grade-section"><h4>WHAT TO IMPROVE</h4><p>${r.improve}</p></div>
      ${r.note && r.note.toLowerCase()!=="none" ? `<div class="grade-note">📝 <b>Note:</b> ${r.note}</div>` : ""}
    `;
    return `

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

function renderQuiz(){
  const quiz = state.quiz;
  const q = quiz.questions[quiz.index];
  const picked = quiz.picks[quiz.index];
  const revealed = !!quiz.revealed[quiz.index];

  const dots = quiz.questions.map((qq,i)=>{
    let cls="dot";
    if((quiz.mode==="topic"||quiz.mode==="mastery") && quiz.revealed[i]){ cls += (quiz.picks[i]===qq.c) ? " correct" : " incorrect"; }
    else if(quiz.picks[i]!==undefined){ cls += " answered"; }
    return `<div class="${cls}"></div>`;
  }).join("");

  const optionsHtml = q.o.map((opt,i)=>{
    let cls="opt";
    if(quiz.mode==="topic" || quiz.mode==="mastery"){
      cls += " clickable";
      if(revealed){ if(i===q.c) cls += " reveal-correct"; else if(i===picked) cls += " reveal-incorrect"; }
      else if(picked===i){ cls += " selected"; }
    } else {
      cls += " clickable";
      if(picked===i) cls += " selected";
    }
    const clickable = quiz.mode==="mock" || !revealed;
    return `<div class="${cls}" ${clickable?`onclick="pickOption(${quiz.index},${i})"`:""}>
      <span class="oletter">${String.fromCharCode(65+i)}.</span><span>${opt}</span>
    </div>`;
  }).join("");

  let feedback = "";
  if((quiz.mode==="topic" || quiz.mode==="mastery") && revealed){
    const isCorrect = picked===q.c;
    feedback = `<div class="feedback ${isCorrect?'ok':'bad'}"><b>${isCorrect?"Correct.":"Not quite."}</b> ${q.e}</div>`;
  }
  let nextBtn = "";
  if(quiz.mode==="topic" || quiz.mode==="mastery"){
    nextBtn = revealed ? `<button class="primary-btn" onclick="quizNext()">${quiz.index<quiz.questions.length-1?"Next question":"See my results"}</button>` : `<span></span>`;
  } else {
    nextBtn = quiz.index<quiz.questions.length-1 ? `<button class="primary-btn" onclick="quizNext()">Next question</button>` : `<button class="stampbtn" onclick="submitMock()">SUBMIT READINESS CHECK</button>`;
  }
  const prevBtn = quiz.index>0 ? `<button class="ghost-btn" onclick="quizPrev()">Back</button>` : `<span></span>`;
  const label = q.src ? `✓ VERIFIED PAST-PAPER STYLE` : `AI-GENERATED PRACTICE ITEM`;

  return `
  <div class="quiz-top">
    <div class="quiz-progress">${dots}</div>
    ${quiz.timedSeconds!=null ? `<div class="timer" id="timerDisplay">--:--</div>` : `<div></div>`}
  </div>
  <div class="qcard">
    <div class="qlabel ${q.src?'verified':''}">${quiz.mode==="mock"?"READINESS CHECK":(quiz.mode==="mastery"?"🎯 MASTERY CHECK":"TOPIC PRACTICE")} · QUESTION ${quiz.index+1} OF ${quiz.questions.length} · ${q.d.toUpperCase()} · ${label}</div>
    <div class="qtext">${q.q}</div>
    ${q.diagram ? `<div class="q-diagram">${q.diagram}<div class="q-diagram-note">Diagram - not drawn to scale</div></div>` : ""}
    ${optionsHtml}
    ${feedback}
  </div>
  <div class="quiz-nav">${prevBtn}${nextBtn}</div>
  `;
}

function confettiHTML(){
  const colors = ["#FF4FA3","#7C3AED","#FFCB3D","#17C3B2","#4D96FF","#FF8A3D"];
  let spans = "";
  for(let i=0;i<26;i++){
    const left = Math.random()*100;
    const delay = (Math.random()*0.5).toFixed(2);
    const color = colors[i % colors.length];
    const rot = Math.floor(Math.random()*360);
    spans += `<span style="left:${left}%;background:${color};animation-delay:${delay}s;transform:rotate(${rot}deg);"></span>`;
  }
  return `<div class="confetti">${spans}</div>`;
}

function renderResults(){
  const r = state.lastResult;
  if(!r) return renderHome();
  const s = findSubject(r.subjectId);
  const pct = Math.round((r.correct/r.total)*100);
  const celebrate = pct>=80 ? confettiHTML() : "";

  if(r.mode==="topic"){
    const t = findTopic(r.subjectId, r.topicId);
    const weakHere = pct < 70;
    return `
    <div class="crumbs"><button onclick="go('home')">Subjects</button> / <button onclick="go('subject',{subjectId:'${s.id}'})">${s.name}</button> / Practice Result</div>
    <div class="result-hero">
      ${celebrate}
      <div class="score-stamp">${pct}%</div>
      <div class="result-meta"><div>${r.correct} of ${r.total} correct on <b>${t.name}</b></div><div class="rlabel mono">${labelFun(readinessLabel({attempted:r.total, accuracy:pct}))}</div></div>
    </div>
    ${weakHere ? `
    <div class="recommend" style="background:linear-gradient(135deg,#FFE3E3,#FFE8F3);">
      <b>🎯 LET'S STRENGTHEN THIS BEFORE MOVING ON</b>
      ${pct}% suggests this topic hasn't quite clicked yet - completely normal on a first pass. A quick recap plus a focused mastery check (aiming for 90%+) usually fixes this fast.
    </div>
    <div class="topic-actions">
      <button class="primary-btn" onclick='startRemediation("${s.id}", ["${t.id}"])'>🎯 Start targeted practice on this topic</button>
      <button class="ghost-btn" onclick="startTopicPractice('${s.id}','${t.id}')">Just practise again</button>
    </div>` : `
    <div class="topic-actions">
      <button class="primary-btn" onclick="startTopicPractice('${s.id}','${t.id}')">Practise again</button>
      <button class="ghost-btn" onclick="go('topic',{subjectId:'${s.id}',topicId:'${t.id}'})">Back to topic guide</button>
      <button class="ghost-btn" onclick="go('subject',{subjectId:'${s.id}'})">Back to ${s.name}</button>
    </div>`}
    `;
  }

  const topicRows = Object.keys(r.topicBreak).map(tid=>{
    const b = r.topicBreak[tid]; const p = Math.round((b.c/b.t)*100);
    const barClass = p<50 ? "low" : (p>=80 ? "high" : "");
    return `<div class="bar-row"><span>${b.name}</span><div class="bar-track"><div class="bar-fill ${barClass}" style="width:${p}%"></div></div><span class="mono">${p}%</span></div>`;
  }).join("");
  const diffRows = ["Easy","Medium","Hard"].map(d=>{
    const b = r.diffBreak[d]; if(!b.t) return "";
    const p = Math.round((b.c/b.t)*100); const barClass = p<50 ? "low" : (p>=80 ? "high" : "");
    return `<div class="bar-row"><span>${d}</span><div class="bar-track"><div class="bar-fill ${barClass}" style="width:${p}%"></div></div><span class="mono">${p}%</span></div>`;
  }).join("");

  let weakest = null;
  Object.keys(r.topicBreak).forEach(tid=>{ const b = r.topicBreak[tid]; const p = b.c/b.t; if(!weakest || p < weakest.p) weakest = {name:b.name, tid, p}; });
  const recommendation = weakest
    ? `Revise <b>${weakest.name}</b> before attempting another full readiness check - it was your weakest area this time (${Math.round(weakest.p*100)}%). Open that topic's study guide and ask the AI study buddy for a simpler explanation before trying again.`
    : `Solid, even performance across topics. Keep up mixed practice to stay sharp.`;

  const weakTopicIds = Object.keys(r.topicBreak).filter(tid => (r.topicBreak[tid].c/r.topicBreak[tid].t) < 0.7);
  const weakBlock = weakTopicIds.length ? `
  <div class="recommend" style="background:linear-gradient(135deg,#FFE3E3,#FFE8F3);">
    <b>🎯 TARGETED PRACTICE RECOMMENDED</b>
    You scored below 70% on ${weakTopicIds.length} topic${weakTopicIds.length>1?"s":""}: ${weakTopicIds.map(tid=>r.topicBreak[tid].name).join(", ")}. Let's fix these properly - a quick recap, then a focused mastery check (aiming for 90%+) on each, one at a time, before your next full readiness check.
  </div>
  <div class="topic-actions">
    <button class="primary-btn" onclick='startRemediation("${s.id}", ${JSON.stringify(weakTopicIds)})'>🎯 Start targeted practice</button>
  </div>` : "";

  const reviewItems = r.questions.map((q,i)=>{
    const picked = r.picks[i];
    const isCorrect = picked === q.c;
    return `<div class="review-item ${isCorrect?"review-correct":"review-incorrect"}">
      <div class="review-head"><span>${isCorrect?"✅":"❌"} Q${i+1}. ${q.q}</span></div>
      ${!isCorrect ? `<div class="review-your">Your answer: ${picked!=null ? q.o[picked] : "(no answer given)"}</div>` : ""}
      <div class="review-correctans">Correct answer: ${q.o[q.c]}</div>
      <div class="review-explain">${q.e}</div>
    </div>`;
  }).join("");

  return `
  <div class="crumbs"><button onclick="go('home')">Subjects</button> / <button onclick="go('subject',{subjectId:'${s.id}'})">${s.name}</button> / Readiness Check Result</div>
  <div class="result-hero">
    ${celebrate}
    <div class="score-stamp">${pct}%</div>
    <div class="result-meta"><div>${r.correct} of ${r.total} correct - <b>${s.name}</b> readiness check</div><div class="rlabel mono">${labelFun(readinessLabel({attempted:r.total, accuracy:pct}))}</div></div>
  </div>
  <div class="breakdown-title">TOPIC PERFORMANCE</div>${topicRows}
  <div class="breakdown-title">DIFFICULTY PERFORMANCE</div>${diffRows}
  <div class="recommend"><b>RECOMMENDED NEXT STEP</b>${recommendation}</div>
  ${weakBlock}
  <div class="topic-actions">
    <button class="primary-btn" onclick="startMock('${s.id}')">Take another readiness check</button>
    <button class="ghost-btn" onclick="go('subject',{subjectId:'${s.id}'})">Back to ${s.name}</button>
    <button class="ghost-btn" onclick="go('dashboard')">View dashboard</button>
  </div>
  <div class="section-block">
    <button class="ghost-btn" onclick="toggleReview()">${state.reviewOpen?"Hide":"📋 Show"} full answer review (${r.total} questions)</button>
    ${state.reviewOpen ? `<div class="review-list">${reviewItems}</div>` : ""}
  </div>
  `;
}

function renderRemediation(){
  const rem = state.remediation; if(!rem) return renderHome();
  const s = findSubject(rem.subjectId);
  const t = findTopic(rem.subjectId, rem.currentTopicId);
  const remaining = rem.queue.length;

  const recap = `
  <div class="hookbox"><div class="hooklabel">QUICK RECAP</div><p>${t.hook}</p></div>
  <div class="section-block">
    ${t.exp.slice(0,2).map(e=>`<div class="explain-card"><div class="etitle">${e.t.toUpperCase()}</div><p>${e.b}</p>${e.diagram?`<div class="q-diagram" style="background:#fff;margin-top:12px;">${e.diagram}</div>`:""}</div>`).join("")}
  </div>`;

  if(rem.stage === "passed"){
    return `
    <div class="crumbs"><button onclick="go('subject',{subjectId:'${s.id}'})">${s.name}</button> / Targeted Practice</div>
    <div class="result-hero"><div class="score-stamp">${rem.lastScore}%</div>
      <div class="result-meta"><div>${rem.lastCorrect} of ${rem.lastTotal} correct on <b>${t.name}</b> - mastery check passed! 🎉</div></div>
    </div>
    <p style="color:var(--ink-soft);max-width:60ch;">Nice work - that topic is cleared. ${remaining>1 ? "Let's move on to the next flagged topic." : "That was your last flagged topic - you're all caught up!"}</p>
    <div class="topic-actions">
      <button class="primary-btn" onclick="nextRemediationTopic()">${remaining>1?"Continue to next weak topic":"Finish - back to "+s.name}</button>
    </div>`;
  }

  if(rem.stage === "retry"){
    return `
    <div class="crumbs"><button onclick="exitRemediation()">${s.name}</button> / Targeted Practice</div>
    <div class="theory-prompt-card" style="background:linear-gradient(135deg,#FFE3E3,#FFF3D6);"><p style="margin:0;">You scored <b>${rem.lastScore}%</b> (${rem.lastCorrect}/${rem.lastTotal}) on <b>${t.name}</b> - we're aiming for at least 90% before moving on. That's totally normal on a first pass - let's go over the key ideas again, then try another mastery check.</p></div>
    ${recap}
    <div class="topic-actions">
      <button class="primary-btn" onclick="beginMasteryCheck()">Try the mastery check again</button>
      <button class="ghost-btn" onclick="go('topic',{subjectId:'${s.id}',topicId:'${t.id}'})">Open the full topic guide</button>
      <button class="ghost-btn" onclick="exitRemediation()">Exit targeted practice</button>
    </div>`;
  }

  return `
  <div class="crumbs"><button onclick="exitRemediation()">${s.name}</button> / Targeted Practice</div>
  <h2>🎯 Let's strengthen: ${t.name}</h2>
  <p style="color:var(--ink-soft);max-width:60ch;">This topic was flagged from your last readiness check (below 70%). Quick recap below, then a focused mastery check - aim for 90%+ before moving on.${remaining>1?" ("+remaining+" topics queued)":""}</p>
  ${recap}
  <div class="topic-actions">
    <button class="primary-btn" onclick="beginMasteryCheck()">Start the mastery check (${Math.min(10,t.qs.length)} questions)</button>
    <button class="ghost-btn" onclick="go('topic',{subjectId:'${s.id}',topicId:'${t.id}'})">Open the full topic guide first</button>
    <button class="ghost-btn" onclick="exitRemediation()">Exit targeted practice</button>
  </div>
  `;
}

function renderDashboard(){
  const rows = SUBJECTS.map(s=>{
    const agg = subjectAggregate(s.id); const label = readinessLabel(agg);
    const mocks = state.progress[s.id].mocks; const lastMock = mocks.length ? mocks[mocks.length-1] : null;
    const lastMockText = lastMock ? Math.round(lastMock.score/lastMock.total*100)+"%" : "-";
    const barClass = agg.accuracy<50 ? "low" : (agg.accuracy>=80 ? "high" : "");
    return `<div class="dash-row">
      <span class="sname">${s.name}</span>
      <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${agg.accuracy}%"></div></div>
      <span class="mono">${agg.accuracy}%</span>
      <span class="readiness-chip ${readinessClass(label)}">${labelFun(label)} ${lastMock?"· last check "+lastMockText:""}</span>
    </div>`;
  }).join("");

  let weakTopics = [];
  SUBJECTS.forEach(s=>{ s.topics.forEach(t=>{ const st = topicStat(s.id, t.id); if(st.attempted>0){ weakTopics.push({subject:s.name, subjectId:s.id, topicId:t.id, name:t.name, acc: Math.round((st.correct/st.attempted)*100), attempted:st.attempted}); } }); });
  weakTopics.sort((a,b)=>a.acc-b.acc);
  const weakHtml = weakTopics.slice(0,5).map(w=>`<div class="weak-item"><span>${w.name} <span class="wsubj">· ${w.subject}</span></span><span class="mono">${w.acc}%</span></div>`).join("") ||
    `<div class="weak-item"><span>No practice attempts recorded yet. Open a subject and start a topic to build your profile.</span></div>`;

  return `
  <div class="crumbs"><button onclick="go('home')">Subjects</button> / Readiness Dashboard</div>
  <h2>Readiness Dashboard</h2>
  <p style="color:var(--ink-soft);max-width:60ch;margin-top:6px;">Overall accuracy per subject, based on every topic practice attempt and readiness check you've completed.</p>
  <div style="margin-top:18px;">${rows}</div>
  <div class="weak-list"><div class="breakdown-title">WEAKEST TOPICS ACROSS ALL SUBJECTS</div>${weakHtml}</div>
  `;
}

(async function init(){
  if(typeof window !== "undefined" && window.location && window.location.hash === "#admin"){
    state.view = "admin";
    render();
    return;
  }
  if(typeof window !== "undefined" && window.location && window.location.hash === "#guardian"){
    state.view = "guardian";
    render();
    return;
  }
  state.usernameField = await loadLastUsername();
  render();
})();
</script>
