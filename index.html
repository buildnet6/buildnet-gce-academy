    topics:[
      { id:"ot1", name:"The Sovereignty of God, His Covenant and Early Leadership",
        hook:"Think about a promise your grandfather made years ago that somehow still shapes decisions in your family today, passed down and quietly reshaped with each new generation - that's exactly the pattern running through Genesis and Exodus, from creation to Abraham to Moses, a single covenant stretching across centuries.",
        obj:["Explain the theme of God's sovereignty in creation","Discuss God's covenant with Abraham, including its specific sign","Narrate Joseph's full journey from betrayal to becoming Egypt's saviour-administrator","Explain the significance of God's name revealed to Moses at the burning bush"],
        exp:[
          {t:"Sovereignty & Creation", b:"The account presents humanity as made deliberately 'in God's image', and God as controller of the universe, not an accident, but intentional and significant. This deliberateness is the theological point WAEC tests most: creation isn't presented as random or accidental in the text, it's presented as a purposeful act by a sovereign God."},
          {t:"The Covenant, and its specific sign", b:"A covenant is an unbreakable family promise, God commits to Abraham's descendants and land, generation after generation, even when the humans involved make mistakes. The covenant had a specific, physical SIGN: circumcision (Genesis 17:10-14), a permanent, bodily mark distinguishing Abraham's descendants as covenant people. Students often remember the PROMISE (descendants, land) but forget the sign, which WAEC has tested directly."},
          {t:"Joseph's full arc - betrayal to saviour", b:"Joseph's story is a complete narrative students should know beat by beat: sold into slavery by his own jealous brothers, falsely accused by Potiphar's wife and imprisoned despite his innocence, correctly interprets Pharaoh's dreams predicting seven years of plenty then seven of famine, is elevated to oversee Egypt's grain storage as a direct result, and eventually reunites with and forgives the very brothers who betrayed him. The arc from betrayal to forgiveness is the theme WAEC essay questions usually target."},
          {t:"The burning bush - why God's name matters here", b:"When Moses asks God's name at the burning bush (Exodus 3:14), God answers 'I AM WHO I AM', a name (YHWH) suggesting self-existence and eternal presence, not dependent on anything else for existence. This isn't just a label, it's God's answer to Moses's real fear of returning to Egypt: I am the same God who was with your ancestors, and I will be present with you too. Understanding this connects the 'sovereignty' theme directly to Moses's leadership call."}
        ],
        err:["Treating the patriarchal narratives as unconnected separate stories","Overlooking the covenant theme linking the Genesis and Exodus narratives","Forgetting circumcision was the specific, physical SIGN of the Abrahamic covenant, not just an abstract promise","Skipping the theological weight of God's name ('I AM') revealed to Moses"],
        qs:[
          Q("According to the Genesis creation account, humans were made in",["the image and likeness of God","the image of angels","no particular likeness","the image of animals"],0,"Genesis 1:27 states that humanity was created in God's image.","Easy"),
          Q("God's covenant with Abraham primarily promised him",["numerous descendants and a land","immediate kingship","freedom from all hardship","a written law code"],0,"God promised Abraham descendants and the land of Canaan (Genesis 12, 15).","Medium"),
          Q("Moses was called by God to lead Israel out of bondage in",["Egypt","Babylon","Assyria","Rome"],0,"Moses led the Israelites out of slavery in Egypt (Exodus).","Easy"),
          Q("According to the Genesis 1 creation account, which was created first?",["Light, on the first day","Land vegetation, on the first day","The sun and moon, before light existed","Human beings, before any plant life"],0,"Genesis 1 places light on Day 1, well before land vegetation (Day 3) and the sun and moon (Day 4).","Medium",VP),
          Q("When the twelve spies returned from scouting Canaan, the report that Israel could not defeat the people there represented the view of",["the Nephilim themselves","all twelve spies equally","the majority (ten) of the spies","only Joshua and Caleb"],2,"Numbers 13:31 records that ten of the twelve spies discouraged the people, while only Joshua and Caleb urged faith.","Hard",VP),
          Q("God's instruction, 'You shall invest him with some of your authority, that all the congregation of Israel may obey,' concerned the",["appointment of Eleazar as high priest","appointment of Aaron as Moses' spokesman","commissioning of Joshua to succeed Moses","election of Eleazar to succeed Aaron"],2,"Numbers 27:20 records God's instruction to Moses regarding Joshua's commissioning as his successor.","Hard",VP),
          Q("According to Joshua 1:8, God told Joshua that success would come through",["following Moses' footsteps exactly","humbling himself before the people","praying continuously","meditating on the book of the law day and night"],3,"Joshua 1:8 ties Joshua's success directly to meditating on and obeying the book of the law.","Medium",VP),
          Q("The specific physical sign of God's covenant with Abraham was",["circumcision","baptism","fasting","a burnt offering"],0,"Genesis 17:10-14 establishes circumcision as the sign of the Abrahamic covenant.","Medium",VP),
          Q("When Moses asked for God's name at the burning bush, God's answer, 'I AM WHO I AM', primarily conveys the idea of",["God's self-existent, eternal presence, unchanging across generations","a secret code Moses was told to keep hidden","God's physical location in the wilderness","a temporary name used only once"],0,"The name emphasises God's eternal, self-existent nature, the same God present with Israel's ancestors and now with Moses.","Hard",VP)
        ]
      },
      { id:"ot2", name:"God's Care, Parental Responsibility and Saul's Disobedience",
        hook:"A student who ignores a teacher's very specific instructions rarely gets away with it quietly, even if their overall intentions were good - Saul's story is the Old Testament's sharpest lesson in how disobedience to God's specific instruction unravelled even a promising reign, not because Saul lacked ability, but because he chose not to fully obey.",
        obj:["Discuss examples of God's care and guidance for His people, with specific reference to the wilderness journey","Explain the theme of parental responsibility using Eli's household as the central case study","Narrate the full circumstances of Saul's disobedience in 1 Samuel 15, not just its outcome","Explain the theological principle 'to obey is better than sacrifice' and why it mattered so much"],
        exp:[
          {t:"God's care in the wilderness", b:"For forty years in a desert that could not naturally support them, the Israelites had food (manna, appearing fresh every morning except the Sabbath), water (from rock at Massah and Meribah), and their clothing and sandals reportedly didn't even wear out (Deuteronomy 8:4). The point WAEC tests here isn't the miracles individually, it's the pattern: God's care was continuous and responsive to specific needs, not a one-off rescue followed by abandonment."},
          {t:"Eli's household - a specific, cautionary case study", b:"Eli was a good priest personally, but his sons Hophni and Phinehas abused their office, demanding meat before it was properly offered and behaving disgracefully at the tabernacle entrance. Eli knew and rebuked them verbally ('why do you do such things?'), but never actually stopped them or removed them from office. That gap, between knowing something is wrong and actually acting to correct it, is exactly what cost Eli's entire household its priestly future. It's a specific warning about parental authority: awareness without enforcement isn't real correction."},
          {t:"What Saul actually did wrong, in detail", b:"In 1 Samuel 15, God's instruction through Samuel was total and specific: destroy the Amalekites completely, sparing nothing. Saul instead spared King Agag alive and kept the best sheep and cattle, only destroying what was 'despised and worthless'. When confronted, Saul insisted the animals were kept 'to sacrifice to the LORD' - technically religious-sounding, but still a direct violation of an explicit command. This detail matters: Saul didn't reject God outright, he substituted his own judgment for a specific instruction while dressing it up as devotion."},
          {t:"'To obey is better than sacrifice' - the key line", b:"Samuel's response to Saul's excuse became one of the most quoted lines in the Old Testament: obedience matters more than religious ritual performed instead of obedience. This wasn't Samuel dismissing sacrifice itself, sacrifice was a legitimate, commanded practice, it was Samuel rejecting the idea that performing ONE right religious action can substitute for skipping a DIFFERENT direct instruction. This is precisely the kind of quotable theological principle WAEC likes to test as its own standalone question."}
        ],
        err:["Confusing the roles of prophets with those of kings","Assuming Saul's failure was about ability rather than obedience","Thinking Saul's excuse (sacrificing the animals) made his disobedience acceptable, since the instruction never allowed for sparing anything at all","Forgetting that Eli's failure was a failure to ACT, not a failure to notice or disapprove"],
        qs:[
          Q("God's provision of manna to the Israelites in the wilderness is an example of",["God's care and provision for His people","a punishment for disobedience","a covenant with Abraham","a parable of Jesus"],0,"Manna (Exodus 16) demonstrates God's provision for Israel's needs.","Medium"),
          Q("Saul's disobedience to God's instruction, delivered through Samuel, ultimately led to",["the loss of his kingship","a doubling of his territory","his appointment as high priest","peace with all his enemies"],0,"Saul's disobedience cost him God's favour and eventually his kingship.","Medium"),
          Q("Eli's failure as recorded in 1 Samuel is primarily linked to",["failing to properly restrain his sons' misconduct","losing a military battle","building a false idol","refusing to anoint a king"],0,"Eli's sons' misconduct, and his failure to restrain them, is central to this narrative.","Medium"),
          Q("According to 1 Samuel 2, Eli's sons Hophni and Phinehas were condemned mainly for",["treating the Lord's offerings with contempt and abusing their priestly office","refusing to serve as priests at all","openly worshipping foreign gods","attacking the Philistines without permission"],0,"The sons demanded raw meat before the fat was burned and slept with women serving at the tent of meeting, treating the Lord's offerings with contempt.","Hard",VP),
          Q("Eli's sons refused to heed their father's warning to stop their evil deeds mainly because",["they derived great pleasure from their evil deeds","they benefited financially from the offerings","their father's views were considered outdated","it was already the LORD's will to put them to death"],3,"1 Samuel 2:25 states plainly that they did not listen to their father, 'for it was the will of the LORD to put them to death.'","Hard",VP),
          Q("The underlying reason for Israel's request for a king in 1 Samuel 8 was",["the old age of Eli and the conduct of his sons","the old age of Samuel and the corrupt conduct of his sons","the failure of both Samuel and Eli to correct their sons","the need to fight other nations who had kings"],1,"1 Samuel 8:5 records that the elders asked for a king because Samuel was old and his sons did not follow his ways.","Medium",VP),
          Q("In 1 Samuel 15, Saul justified sparing the best of the Amalekites' animals by claiming he intended to",["sacrifice them to the Lord","sell them for profit","give them to the poor","train them for battle"],0,"Saul claimed a religious purpose for his disobedience, which Samuel still rejected as unacceptable.","Hard",VP),
          Q("Samuel's statement 'to obey is better than sacrifice' was made in direct response to",["Saul's excuse for sparing the Amalekites' livestock","David's sin with Bathsheba","Solomon's request for wisdom","Elijah's contest with the prophets of Baal"],0,"This is Samuel's judgment on Saul's disobedience in 1 Samuel 15:22.","Medium",VP)
        ]
      },
      { id:"ot3", name:"David's Heart for God, Solomon's Decisions and the Danger of Greed",
        hook:"Think about a brilliant student who makes a serious mistake but is remembered fondly for owning up to it honestly, versus one who's naturally gifted but slowly makes worse choices despite the talent. Three Old Testament figures capture exactly that contrast: one remembered for genuine repentance despite serious failure, one for legendary wisdom that still went astray, and two supporting figures remembered mainly for what greed cost them.",
        obj:["Narrate David's sin with Bathsheba and Nathan's confrontation in detail","Explain what specifically made David's repentance genuine, not just his getting caught","Discuss Solomon's specific unwise policies and their long-term political consequences","Narrate Gehazi's specific act of greed and its consequence"],
        exp:[
          {t:"David - the actual sin and confrontation", b:"David's failure has real specifics: he committed adultery with Bathsheba while her husband Uriah was away at war, then arranged for Uriah to be killed in battle to cover it up. The prophet Nathan confronted him indirectly, telling a parable about a rich man stealing a poor man's only lamb, and when David reacted with outrage at the injustice, Nathan delivered the famous line: 'You are the man!' David's repentance (recorded in Psalm 51) came only after being confronted, not from voluntarily confessing first, which is worth noting precisely, since it shows genuine repentance isn't about never needing correction, it's about how you respond once corrected."},
          {t:"Solomon's decisions - wisdom to unwise policy, specifically", b:"Solomon's early wisdom (famously shown in judging between two mothers, 1 Kings 3) later gives way to specific unwise policies: marrying many foreign wives (1 Kings 11 records 700 wives and 300 concubines) for political alliances, which drew him into worshipping their foreign gods, and imposing heavy taxation and forced labour on his own people to fund his building projects. This second policy specifically fuelled the resentment that caused the kingdom to split in two right after his death (1 Kings 12)."},
          {t:"Greed (Ahab, Gehazi) - both stories in specific detail", b:"Ahab's greed for Naboth's vineyard led to Naboth's judicial murder (arranged by Jezebel) so Ahab could seize the land, a crime Elijah confronted directly with God's judgment. Gehazi, Elisha's own servant, lied to chase after Naaman (the healed Syrian commander) to secretly collect payment Elisha had explicitly refused, and was punished by contracting the very leprosy Naaman had just been healed of (2 Kings 5). Both stories make the same point from different angles: greed corrupts judgment, and consequences follow even when the greedy act seems to succeed at first."}
        ],
        err:["Assuming David's title 'man after God's own heart' means he never sinned","Confusing Solomon's wisdom narrative with his later unwise policies","Forgetting David's repentance came only AFTER Nathan's confrontation, not as a voluntary first move","Mixing up which specific unwise policy (foreign wives vs. forced labour) caused which specific consequence (idolatry vs. the kingdom's later split)"],
        qs:[
          Q("David is described as 'a man after God's own heart' mainly because of his",["genuine repentance and submission to God despite his failures","perfect, sinless record","military conquests alone","wealth and possessions"],0,"David's genuine repentance, not sinlessness, earns him this description.","Medium"),
          Q("Solomon's wisdom is most famously illustrated in his",["judgment between two women both claiming the same baby","victory over Goliath","construction of the Ark of the Covenant","escape from Egypt"],0,"Solomon's famous judgment (1 Kings 3) demonstrates his wisdom.","Easy"),
          Q("Ahab's greed for Naboth's vineyard ultimately led to",["Naboth's unjust death and God's judgment on Ahab's house","a peaceful land exchange","Ahab's abdication","Naboth becoming a prophet"],0,"1 Kings 21 recounts Naboth's unjust death and the judgment that followed.","Hard"),
          Q("When David found Saul asleep in his camp (1 Samuel 26), he refused to kill him mainly because",["Saul was 'the Lord's anointed'","David was too weak to fight","Saul's soldiers were awake and watching","David had already made peace with Saul"],0,"David repeatedly cites Saul's status as the Lord's anointed as his reason for sparing him.","Hard",VP),
          Q("In 1 Kings 5, King Hiram of Tyre agreed to supply Solomon with cedar and cypress timber for the temple mainly in exchange for",["an annual supply of wheat and oil for his household","gold and silver","control over part of Jerusalem","Solomon's daughter in marriage"],0,"Solomon paid Hiram in food supplies (wheat and oil) year by year for the timber and labour.","Hard",VP),
          Q("The prophet Nathan confronted David about his sin with Bathsheba by",["telling a parable about a rich man stealing a poor man's only lamb","publicly denouncing him before the army","refusing to speak to him at all","reciting a psalm of praise"],0,"Nathan's parable of the ewe lamb led David to unknowingly condemn himself before Nathan revealed 'You are the man!'","Hard",VP),
          Q("Gehazi, Elisha's servant, was punished with leprosy specifically because he",["lied to Naaman to secretly collect payment Elisha had refused","refused to serve Elisha any longer","worshipped a foreign idol","stole from the king's treasury"],0,"2 Kings 5 records Gehazi's deceit for personal gain, resulting in him contracting Naaman's leprosy.","Hard",VP),
          Q("Solomon's imposition of heavy taxation and forced labour on his own people is most directly linked in scripture to",["the kingdom of Israel splitting in two shortly after his death","his marriage to the Queen of Sheba","the building of the first Temple's altar alone","his friendship with King Hiram"],0,"1 Kings 12 records that resentment over these burdens directly fuelled the kingdom's division under Solomon's son Rehoboam.","Hard",VP),
          Q("David's servants feared to tell him that his and Bathsheba's child had died mainly because they worried he might",["go mad with grief","kill them in anger","harm himself","punish the entire household"],2,"2 Samuel 12:18 records the servants' fear that David 'may do himself some harm' if told while the child was still critically ill.","Hard",VP),
          Q("According to 1 Kings 3:14, God's condition for lengthening Solomon's days was that Solomon should",["offer regular burnt offerings","pray daily without fail","sacrifice faithfully to the Lord","walk in God's ways, keeping His statutes and commandments"],3,"God told Solomon at Gibeon that walking in His ways and keeping His commandments would lengthen his days.","Hard",VP)
        ]
      },
      { id:"ot4", name:"The Supremacy of God, Religious Reform and Concern for the Nation",
        hook:"Imagine a school assembly where two rival claims about who's really in charge get publicly tested in front of everyone, with no room left for doubt afterward. Elijah's dramatic showdown on Mount Carmel wasn't just theatre, it was exactly that kind of public test of whose God was actually real, and it set a pattern for later reformers and nation-builders who confronted their own society's drift.",
        obj:["Discuss Elijah's demonstration of God's supremacy at Mount Carmel in detail","Explain Josiah's specific religious reforms, not just the discovery that triggered them","Discuss Nehemiah's specific strategy against real, active opposition","Explain Ezra's specific reform concerning mixed marriages"],
        exp:[
          {t:"The Supremacy of God (Elijah)", b:"At Mount Carmel, Elijah publicly tests whose God can answer by fire, a dramatic, public settling of religious tension in Israel."},
          {t:"Religious Reform (Josiah) - the specific actions, not just the discovery", b:"Josiah discovers a neglected law book and responds with sweeping, specific reforms: destroying altars and idols dedicated to Baal and Asherah throughout Judah, removing corrupt priests who served foreign gods, and restoring the celebration of Passover, which the text notes hadn't been properly observed 'since the days of the judges' (2 Kings 23:22), meaning for centuries. That Passover detail matters: it shows the reform wasn't symbolic, it actively revived a specific, long-abandoned religious practice."},
          {t:"Nehemiah - real opposition, real strategy", b:"Nehemiah's wall-rebuilding faced active, organised opposition from Sanballat and Tobiah, who mocked the project, plotted an armed attack, and later tried to lure Nehemiah into a trap outside the city. Nehemiah's actual response was practical, not just prayerful: he armed half his workforce while the other half continued building, posted guards, and refused repeated invitations to leave the project unattended. This combination of faith and practical strategy is exactly the kind of detail WAEC essay questions reward."},
          {t:"Ezra's specific reform - mixed marriages", b:"Ezra's central concern for the nation focused on a specific problem: many Israelites, including leaders, had intermarried with surrounding peoples who worshipped other gods, threatening the community's distinct faithfulness. Ezra responded with public grief, prayer, and leading the community through a difficult process of addressing these marriages, restoring the community's religious identity. This is a distinct, specific reform from Nehemiah's wall-building, even though both men share the 'concern for the nation' theme."}
        ],
        err:["Confusing Elijah's Mount Carmel contest with a different miracle story","Treating Nehemiah's and Ezra's work as identical rather than complementary","Describing Josiah's reform only as 'finding a book' without naming what he actually DID afterward","Forgetting Nehemiah faced organised, active opposition (Sanballat and Tobiah), not just general difficulty"],
        qs:[
          Q("Elijah's contest at Mount Carmel was primarily meant to demonstrate",["the supremacy of God over the prophets of Baal","a military victory","a new law code","a covenant renewal ceremony"],0,"1 Kings 18 recounts Elijah's public demonstration of God's supremacy.","Medium"),
          Q("Josiah's religious reform was triggered mainly by",["the discovery of a neglected book of the law","a military defeat","a famine","a visit from a foreign king"],0,"2 Kings 22 records the discovery of the law book prompting Josiah's reform.","Medium"),
          Q("Nehemiah's central concern for his nation was primarily shown through",["rebuilding the walls of Jerusalem despite opposition","building the Temple","defeating the Philistines","writing the Psalms"],0,"Nehemiah is remembered for rebuilding Jerusalem's walls.","Easy"),
          Q("In the contest on Mount Carmel (1 Kings 18), the prophets of Baal failed to receive any answer from their god despite",["crying out loudly and cutting themselves from morning until evening","offering perfect, unblemished sacrifices","having the support of the prophet Elijah","praying only once, briefly"],0,"The Baal prophets cried out, danced around the altar, and cut themselves with swords and spears, yet received no answer, no voice, no one paying attention.","Hard",VP),
          Q("Elijah's mocking cry, 'Cry aloud, for he is a god; either he is musing, or he has gone aside...' was directed at the prophets of",["Ashtoreth","Asherah","Baal","Molech"],2,"1 Kings 18:27 records Elijah's taunt directed at the prophets of Baal during the Mount Carmel contest.","Hard",VP),
          Q("Nehemiah viewed the ruined, broken-down walls of Jerusalem mainly as a",["challenge to be overcome quickly","military threat to the city","personal surprise","reproach (disgrace) upon his people"],3,"Nehemiah 2:17 records Nehemiah describing Jerusalem's ruined state as a reproach he was determined to remove.","Medium",VP),
          Q("Among the specific actions Josiah took as part of his religious reform was",["restoring the celebration of Passover, unobserved for centuries","building a new royal palace","declaring war on Egypt","abolishing the priesthood entirely"],0,"2 Kings 23:22 notes the Passover had not been properly kept since the days of the judges, until Josiah restored it.","Hard",VP),

          Q("Ezra's central reform effort specifically addressed the problem of",["Israelites intermarrying with peoples who worshipped other gods","the walls of Jerusalem being in ruins","a famine affecting Judah","a foreign invasion of the temple"],0,"Ezra confronted the specific issue of mixed marriages threatening the community's religious identity.","Hard",VP)
        ]
      },
      { id:"ot5", name:"Faith Under Pressure, God's Message and the Call to Social Justice",
        hook:"Think about the difference between a student who stands firm on their values even when mocked for it, one who avoids an uncomfortable task they've been assigned, and one who calls out unfairness even when it's socially awkward. Daniel refusing the king's food, Jonah running from a divine assignment, and Amos confronting comfortable religious hypocrisy are three very different responses to pressure, and only one of them fully models what faithful courage looks like.",
        obj:["Discuss Daniel's faith under pressure, including the food test and dream interpretations","Explain Jonah's full story arc, including his reaction AFTER Nineveh repents","Explain Hosea's marriage as a living metaphor for God's relationship with Israel","Explain the call to social justice in Amos and Hosea"],
        exp:[
          {t:"Faith in God (Daniel) - more than just the lions' den", b:"Daniel and his friends maintain their convictions even under threat of death, faith tested by real, immediate danger rather than comfortable theory. Before the lions' den, Daniel's very first recorded stand was refusing the king's rich food and wine, requesting only vegetables and water for ten days instead, a deliberate test that proved his group healthier than those eating the royal diet. Daniel is also remembered for interpreting Nebuchadnezzar's troubling dreams and later reading the mysterious 'writing on the wall' at Belshazzar's feast, using genuine spiritual insight in moments of real political danger."},
          {t:"The message of God (Jonah) - the full arc, including the twist ending", b:"Jonah initially runs from his assignment to warn Nineveh, is swallowed by a great fish, and after three days is given a second chance and finally preaches, leading to the city's dramatic repentance. The part students most often miss is what happens NEXT: Jonah becomes angry that God showed mercy to Nineveh rather than destroying it, revealing his real problem was never fear, it was resentment that God's compassion extended even to Israel's enemies. This twist is often exactly what an essay question is really asking about."},
          {t:"Hosea - a marriage as a living sermon", b:"God instructs Hosea to marry Gomer, a woman who proves unfaithful to him, making Hosea's own painful marriage a lived-out metaphor for Israel's unfaithfulness to God through idolatry. Despite Gomer's repeated unfaithfulness, Hosea is told to keep pursuing and redeeming her, mirroring God's persistent, patient love for an unfaithful Israel. This personal, uncomfortable metaphor is what makes Hosea's message distinct from Amos's more direct social critique."},
          {t:"Social Justice and True Religion (Amos, Hosea)", b:"Amos insists that empty religious ritual means nothing without real justice for the poor, worship and social fairness are treated as inseparable."}
        ],
        err:["Assuming Jonah delivered his message willingly from the start","Reducing Amos's message to ritual practice alone, missing the justice component","Missing that Jonah's real problem, revealed after Nineveh's repentance, was resentment at God's mercy toward Israel's enemies, not just fear of the mission","Treating Hosea's marriage to Gomer as incidental background rather than the central metaphor of his message"],
        qs:[
          Q("Daniel's faith under pressure is most famously illustrated by his",["survival in the lions' den after refusing to stop praying to God","victory over Goliath","escape from Egypt","building of the Temple"],0,"Daniel 6 recounts Daniel's faith tested in the lions' den.","Easy"),
          Q("Jonah's initial response to God's instruction to preach to Nineveh was to",["flee in the opposite direction","obey immediately without question","argue directly with God in the city","refuse and be punished by exile"],0,"Jonah 1 records his attempt to flee to Tarshish instead of Nineveh.","Medium"),
          Q("Amos's message on social justice mainly criticised",["empty religious ritual alongside injustice to the poor","the building of the Temple","foreign military alliances","the practice of sacrifice itself"],0,"Amos condemned hollow religious observance that ignored social injustice.","Hard"),
          Q("Amos was told not to prophesy at Bethel, since it was 'the king's sanctuary,' by",["Jeroboam himself","Amaziah, the priest of Bethel","Rehoboam","Solomon"],1,"Amos 7:10-13 records Amaziah, priest of Bethel, ordering Amos to flee and stop prophesying there.","Medium",VP),
          Q("Before facing the lions' den, Daniel's first recorded stand of faith was",["refusing the king's rich food and wine, requesting only vegetables and water instead","refusing to serve the king at all","leading a military rebellion","building an altar to a foreign god"],0,"Daniel 1 records Daniel's refusal of the royal food, choosing vegetables and water for ten days instead.","Medium",VP),
          Q("After Nineveh repented and God spared the city, Jonah's reaction was one of",["anger and resentment that God showed mercy to Israel's enemies","joyful celebration alongside the Ninevites","immediate return to preaching in Israel","gratitude that his mission was finally over"],0,"Jonah 4 reveals his anger at God's mercy toward Nineveh, exposing his underlying resentment rather than simple fear.","Hard",VP),
          Q("God instructed Hosea to marry Gomer specifically to",["serve as a living metaphor for Israel's unfaithfulness and God's persistent love","fulfil a political alliance","provide him with wealth","test his obedience unrelated to his message"],0,"Hosea's marriage to the unfaithful Gomer mirrors Israel's unfaithfulness and God's continuing pursuit of restoration.","Hard",VP)
        ]
      },
      { id:"ot6", name:"Divine Love, Holiness and Hope Beyond Judgment",
        hook:"Even the strictest parent's warning usually comes wrapped in some form of 'but I still love you and want better for you' - and that's exactly the pattern running through the Old Testament's harshest warnings of judgment, almost always paired with a promise of restoration, a reminder that judgment was never meant to be the whole story.",
        obj:["Discuss the theme of divine love in Hosea","Explain Isaiah's specific vision and Ezekiel's call as 'watchman'","Explain Jeremiah's 'new covenant' promise, and how it points beyond his own time"],
        exp:[
          {t:"Divine Love (Hosea)", b:"Hosea's own difficult marriage becomes a living illustration of God's persistent love for an unfaithful people, love that pursues even after betrayal."},
          {t:"Isaiah's specific vision - the exact details matter", b:"Isaiah 6 describes seraphim (winged heavenly beings) calling 'Holy, holy, holy' around God's throne, and Isaiah, overwhelmed by his own uncleanness in this presence, has a burning coal touched to his lips as a symbol of cleansing before he can accept the call to prophesy. This specific ritual detail, the coal touching his lips, is the exact image WAEC sometimes asks students to identify."},
          {t:"Ezekiel's distinctive call as 'watchman'", b:"Ezekiel's call includes a striking image: he is told to eat a scroll containing words of lament, which tastes 'sweet as honey' despite its difficult content, and he is specifically appointed a 'watchman' for Israel, responsible for warning the people of coming danger, with real personal accountability if he fails to warn them. This 'watchman' title is a distinctive feature of Ezekiel's call, different from Isaiah's or Jeremiah's."},
          {t:"Punishment and Hope (Jeremiah), including the 'new covenant'", b:"Jeremiah delivers hard warnings of coming judgment, but consistently pairs them with genuine hope of eventual restoration. His most forward-looking promise (Jeremiah 31) is of a 'new covenant', one written on people's hearts rather than only on stone tablets, a promise of internal transformation rather than mere external rule-following. This specific promise is often noted for how directly it anticipates New Testament themes."}
        ],
        err:["Reading Hosea's marriage story only literally, missing its symbolic purpose","Assuming judgment prophecies never include any note of hope","Confusing Isaiah's 'burning coal' cleansing image with Ezekiel's 'eating the scroll' image - they are different prophets' distinct call experiences"],
        qs:[
          Q("Hosea's own marriage is used in the book mainly to illustrate",["God's persistent love for an unfaithful people","a legal requirement of the law","a purely historical marriage record","a warning against marriage itself"],0,"Hosea's marriage symbolically illustrates God's steadfast love despite unfaithfulness.","Medium"),
          Q("Isaiah's call to prophesy (Isaiah 6) follows directly from",["an overwhelming vision of God's holiness","a military victory","a famine in the land","a request from the king"],0,"Isaiah 6 records his vision of God's holiness immediately before his call.","Medium"),
          Q("Jeremiah's prophecies are notable for combining warnings of judgment with",["genuine hope of eventual restoration","a complete absence of hope","praise with no warning at all","only military strategy"],0,"Jeremiah pairs judgment with hope of future restoration.","Medium"),
          Q("In Isaiah's vision (Isaiah 6), his sense of uncleanness before God's holiness was symbolically dealt with by",["a burning coal touched to his lips","a scroll he was told to eat","a river he was told to bathe in","a sacrifice he personally offered"],0,"Isaiah 6 describes a seraph touching his lips with a burning coal as a symbol of cleansing.","Hard",VP),
          Q("Ezekiel's call specifically appointed him as a",["watchman for the house of Israel, responsible for warning the people","king over Israel","high priest in the temple","military commander"],0,"Ezekiel is distinctively called a 'watchman', responsible for warning Israel of coming danger.","Hard",VP),
          Q("Jeremiah's promise of a 'new covenant' (Jeremiah 31) is distinctive because it describes a covenant",["written on people's hearts, rather than only on stone tablets","that replaces the need for God entirely","only for foreign nations","that abolishes all previous promises to Abraham"],0,"The new covenant promise emphasises internal transformation, written on the heart, rather than merely an external law.","Hard",VP)
        ]
      },
      { id:"gospels1", name:"The Birth, Baptism, Temptation of Jesus and Discipleship",
        hook:"Before a new team captain ever plays their first real match, they usually have to prove themselves first, through trial, testing, and clear confirmation from those who selected them. Jesus' baptism and wilderness temptation serve a similar purpose right before his public ministry properly begins, publicly affirming who he is and testing his resolve before the real work starts.",
        obj:["Discuss the birth, baptism and temptation of Jesus, including the SPECIFIC content of each temptation","Explain the call and demands of discipleship, including its most radical sayings"],
        exp:[
          {t:"Birth, baptism, temptation", b:"Jesus' baptism publicly affirms his identity, and his wilderness temptation shows him resisting shortcuts to power and glory before his ministry properly begins."},
          {t:"The three temptations, specifically, each targeting something different", b:"Satan's first temptation (turn stones to bread) targets physical NEED, tempting Jesus to misuse his power for personal comfort after forty days of fasting. The second (throw himself from the temple) targets testing GOD's faithfulness rather than trusting it. The third (worship Satan in exchange for all the kingdoms of the world) targets a shortcut to POWER and glory without the cross. Jesus answers each with a specific scripture quotation rather than his own reasoning, modelling how he expected his own followers to resist temptation."},
          {t:"Discipleship - the radical, costly sayings", b:"Jesus calls ordinary fishermen and a tax collector to leave their livelihoods and follow him, discipleship demands real, costly commitment, not casual interest. His most radical sayings make this explicit: telling a would-be follower that 'foxes have holes... but the Son of Man has nowhere to lay his head', and responding to someone wanting to first bury their father with 'let the dead bury their own dead', deliberately shocking language emphasising that following him takes priority over even the most basic, expected family obligations."}
        ],
        err:["Treating the temptation narrative as a minor detail rather than a defining test","Assuming discipleship in the Gospels required no real personal cost","Being unable to name what EACH of the three specific temptations targeted (need, testing God, power)"],
        qs:[
          Q("Jesus was born in",["Bethlehem","Jerusalem","Nazareth","Rome"],0,"The Gospels record Jesus' birth in Bethlehem (Matthew 2, Luke 2).","Easy"),
          Q("At Jesus' baptism, the voice from heaven and the Spirit's descent primarily served to",["confirm Jesus' identity as God's Son","punish John the Baptist","end Jesus' ministry","warn the crowd to leave"],0,"The baptism scene publicly affirms Jesus' identity.","Medium"),
          Q("Jesus' call to His first disciples, such as Peter and Andrew, required them to",["leave their fishing livelihoods to follow him","pay a fee to join","first complete religious training","remain in their previous occupations unchanged"],0,"The call to discipleship involved leaving their former livelihood entirely.","Easy"),
          Q("According to Matthew's account, the correct sequence of Jesus' temptation in the wilderness was",["temple - wilderness","wilderness - temple - mountain","mountain - temple - wilderness","wilderness - mountain - temple"],1,"Matthew 4:1-11 records the order as wilderness, then the temple pinnacle, then the mountain.","Hard",VP),
          Q("Satan's temptation for Jesus to turn stones into bread specifically targeted",["Jesus' physical need after fasting for forty days","Jesus' desire for political power","a test of God's faithfulness","a shortcut to worldwide glory"],0,"The bread temptation targeted physical hunger after Jesus' extended fast.","Hard",VP),
          Q("Jesus' statement to a would-be follower, 'Foxes have holes... but the Son of Man has nowhere to lay his head', was mainly meant to",["emphasise the real, costly sacrifice discipleship demands","describe his literal homelessness as a complaint","discourage all followers from joining him","boast about his travels"],0,"This saying stresses the genuine cost and sacrifice involved in following Jesus.","Hard",VP)
        ]
      },
      { id:"gospels2", name:"The Miracles and Parables of Jesus",
        hook:"Think about a teacher who explains a difficult idea two completely different ways, once through a dramatic demonstration, once through a simple relatable story, so that different students each grasp it in their own way. Jesus consistently used both dramatic miracles and simple parables to reveal exactly the same underlying message about God's kingdom.",
        obj:["Discuss the significance of Jesus' nature and healing miracles","Explain the meaning of key parables of the Kingdom, including the mustard seed and leaven","Narrate the Parable of the Prodigal Son and its specific meaning"],
        exp:[
          {t:"Miracles", b:"Nature miracles (like stilling the storm) demonstrate authority over creation itself; healing miracles restore people the community had often given up on, like lepers and the demon-possessed."},
          {t:"Kingdom parables - mustard seed and leaven, specifically", b:"The Parable of the Mustard Seed compares the Kingdom of God to the smallest of seeds that grows into a large tree, illustrating how the Kingdom starts small and seemingly insignificant but grows into something substantial. The Parable of the Leaven makes a related point differently: a small amount of yeast works invisibly through an entire batch of dough, illustrating the Kingdom's quiet, pervasive influence, working through a community from the inside rather than announcing itself loudly."},
          {t:"The Prodigal Son - a specific, detailed parable of grace", b:"A younger son demands his inheritance early, squanders it in reckless living, and returns home in desperate poverty rehearsing an apology, only to find his father running to meet him while he's still far off, restoring him fully before he even finishes speaking. The often-overlooked second half involves the older, dutiful son's resentment at this generous welcome, adding a second layer to the parable: grace offends those who feel they've earned their standing, which is exactly why this parable is frequently tested for its FULL two-part structure, not just the younger son's return."},
          {t:"Parables", b:"A parable is a short, relatable story used to smuggle a deep spiritual lesson past people's defences, the Sower, for instance, is really about how different people respond to God's message."}
        ],
        err:["Treating miracles purely as displays of power, missing their compassionate purpose","Reading parables only literally, missing their spiritual meaning","Describing the Prodigal Son parable only as the younger son's story, missing the older brother's resentment as an equally important second half"],
        qs:[
          Q("Jesus stilling the storm on the lake is an example of a",["nature miracle","healing miracle","parable","prophecy"],0,"Stilling the storm demonstrates authority over nature.","Easy"),
          Q("The Parable of the Sower primarily illustrates",["different responses people have to God's message","farming techniques","the punishment of the wicked","the building of the Temple"],0,"The Sower parable is about how different soils/people receive the message.","Medium"),
          Q("Jesus' healing of the leper demonstrates mainly his",["compassion and power to restore an outcast to community life","military strength","wealth and status","preference for wealthy followers"],0,"Healing the leper shows compassion for a socially outcast individual.","Medium"),
          Q("'I desire mercy, and not sacrifice; for I came not to call the righteous, but sinners.' Jesus said this when",["He called the first disciples by the sea","the Sadducees accused Him of eating with sinners","the Pharisees accused Him of eating with sinners","He healed the woman with the issue of blood"],2,"Matthew 9:9-13 records the Pharisees objecting to Jesus dining with tax collectors and sinners.","Hard",VP),
          Q("The Parable of the Mustard Seed mainly illustrates that",["the Kingdom of God starts small but grows into something substantial","farming requires patience","God only rewards the wealthy","seeds should be planted in groups"],0,"The mustard seed's small start and large growth mirrors the Kingdom's own growth pattern.","Medium",VP),
          Q("In the Parable of the Prodigal Son, the older brother's reaction to his younger brother's welcome home reveals",["resentment at the father's generous grace toward someone who, in his view, hadn't earned it","joyful celebration alongside his father","complete indifference to the situation","a plan to leave home himself"],0,"The older brother's resentment forms an important second half of the parable, illustrating how grace can offend those who feel entitled by their own faithfulness.","Hard",VP)
        ]
      },
      { id:"gospels3", name:"The Sermon on the Mount, Mission of the Disciples and the Transfiguration",
        hook:"A coach doesn't train the star player forever without letting the whole team eventually play matches themselves, applying what they've learned. Jesus doesn't just perform and teach alone forever either; at some point he sends his own followers out to do similar work, and reveals a glimpse of his true glory to just three of them on a mountain.",
        obj:["Explain the key demands of the Sermon on the Mount, including the specific paradox of the Beatitudes","Distinguish the mission of the twelve from the mission of the seventy","Discuss the significance of the Transfiguration"],
        exp:[
          {t:"Sermon on the Mount - the Beatitudes' specific paradox", b:"Beginning with the Beatitudes, this sermon lays out radical standards for kingdom living, including teaching on worldly possessions that challenges comfortable priorities. The Beatitudes themselves work through a deliberate paradox: they call people BLESSED precisely for qualities the world doesn't usually celebrate, being poor in spirit, mourning, being meek, being merciful, being persecuted, turning ordinary human expectations about who is 'fortunate' upside down."},
          {t:"The twelve vs the seventy - a distinction worth knowing", b:"Jesus sends out the twelve disciples first (Luke 9), giving them authority to heal and preach specifically to Israel. Later, he separately sends out seventy (or seventy-two, depending on the manuscript) others in pairs (Luke 10), extending the same preaching and healing mission more broadly ahead of his own travels. These are two distinct sending events with different scale and timing, not the same event described twice, a detail worth getting precisely right."},
          {t:"Mission & Transfiguration", b:"Jesus sends his disciples out to extend his own ministry, and later reveals his divine glory to Peter, James and John on the mountain, a preview of who he truly is."}
        ],
        err:["Assuming the Sermon on the Mount is only about ethical rules with no deeper spiritual meaning","Confusing the Transfiguration with the Ascension","Treating the mission of the twelve and the mission of the seventy as the exact same event"],
        qs:[
          Q("Jesus delivered the Sermon on the Mount, which includes the",["Beatitudes","Ten Commandments","creation account","Book of Psalms"],0,"The Beatitudes open the Sermon on the Mount in Matthew 5.","Medium"),
          Q("The mission of the twelve disciples, as sent out by Jesus, mainly involved",["extending his ministry of preaching and healing","collecting taxes for Rome","building synagogues","translating Scripture"],0,"The twelve were sent to preach and heal, extending Jesus' own ministry.","Medium"),
          Q("At the Transfiguration, Jesus revealed his divine glory to",["Peter, James and John","all twelve disciples","the entire crowd","only Judas"],0,"Only Peter, James and John witnessed the Transfiguration.","Medium"),
          Q("'I do not say to you seven times, but seventy times seven.' By this, Jesus meant that forgiveness",["must be done only seven times","takes place only where there is a plea","is exercised only when offence is repeated severally","does not need to have any limitation"],3,"The point of 'seventy times seven' is that forgiveness should be without limit.","Medium",VP),
          Q("According to Jesus, one of the major things Christians should do to merit God's forgiveness is",["pray without ceasing","fellowship together","offer sacrifices to God","forgive people who offend them"],3,"Jesus explicitly links receiving forgiveness to forgiving others (Matthew 6:14-15).","Medium",VP),
          Q("The Beatitudes are notable for declaring people 'blessed' specifically for qualities that",["are not usually celebrated by ordinary worldly standards, such as meekness or mourning","guarantee immediate wealth","only apply to religious leaders","were already widely admired in Jewish society"],0,"The Beatitudes deliberately overturn ordinary expectations about who counts as fortunate.","Hard",VP),
          Q("Compared to the mission of the twelve, Jesus' later mission of the seventy (or seventy-two)",["was a separate, later sending of a larger group in pairs, extending the same preaching and healing work more broadly","was the exact same event, just described twice","involved sending them to foreign nations only","replaced the twelve's mission entirely"],0,"Luke 10 records a distinct, later sending of seventy(-two) disciples, separate from the earlier mission of the twelve.","Hard",VP)
        ]
      },
      { id:"gospels4", name:"The Triumphal Entry, Trials and Death of Christ",
        hook:"Think about how a season can turn dramatically in just one final week, from celebration to sudden crisis. Within the space of one week, Jesus goes from being celebrated with palm branches to being formally tried and executed, and the Gospels slow right down here, giving this final week more detail than almost any other period of his life.",
        obj:["Discuss the significance of the Triumphal Entry and Cleansing of the Temple","Explain the trials and death of Christ"],
        exp:[
          {t:"Triumphal Entry & Cleansing", b:"Jesus enters Jerusalem to public acclaim, then dramatically confronts corrupt commercial practice in the Temple - both events set up the conflict with religious authorities that follows."},
          {t:"Trials and death", b:"Jesus faces both religious (Sanhedrin) and Roman (Pilate) proceedings before his crucifixion - a sequence that raises questions of justice, political pressure and religious authority."}
        ],
        err:["Confusing the religious trial before the Sanhedrin with the Roman trial before Pilate","Treating the Cleansing of the Temple as an isolated event unrelated to Jesus' growing conflict with authorities"],
        qs:[
          Q("Jesus' Triumphal Entry into Jerusalem was followed shortly by his",["cleansing of the Temple","baptism","temptation in the wilderness","birth in Bethlehem"],0,"The Cleansing of the Temple follows the Triumphal Entry in the Gospel accounts.","Medium"),
          Q("Jesus was tried before both Jewish religious authorities and",["the Roman governor Pilate","the Egyptian Pharaoh","King David","the prophet Elijah"],0,"Jesus faced trials before both the Sanhedrin and Pontius Pilate.","Easy"),
          Q("The primary religious charge brought against Jesus before the Sanhedrin concerned",["his claims about his own identity, seen as blasphemy","tax evasion","theft","a property dispute"],0,"Jesus' claims about his identity were treated as blasphemous by the religious authorities.","Hard"),
          Q("'My soul is very sorrowful, even to death; remain here and watch with me.' Where was this remark made?",["In the garden of Gethsemane","When he was in the palace of Caiaphas","On the way to Golgotha","When he was sent to Herod"],0,"This is Jesus' words in the garden of Gethsemane before his arrest (Matthew 26:38).","Medium",VP)
        ]
      },
      { id:"gospels5", name:"The Resurrection and Jesus' Teaching About Himself",
        hook:"After a devastating loss, a team's story doesn't simply end there if something unexpected turns it all around. After the devastation of the crucifixion, the Gospels pivot sharply to report an empty tomb and multiple appearances, and in John's Gospel especially, Jesus had already described exactly who he was using striking, everyday images long before that moment came.",
        obj:["Discuss the resurrection and appearances of Jesus","Explain Jesus' 'I am' teachings about himself in John's Gospel"],
        exp:[
          {t:"Resurrection & appearances", b:"The Synoptic Gospels report the empty tomb and multiple post-resurrection appearances, forming the central claim the early church was built on."},
          {t:"Jesus' teaching about himself", b:"In John, Jesus describes himself using vivid images - the Good Shepherd, the Light of the World, the True Vine - each explaining a different aspect of who he is and does for his followers."}
        ],
        err:["Assuming all four Gospels record identical resurrection details","Treating John's 'I am' sayings as purely symbolic with no theological weight"],
        qs:[
          Q("The Synoptic Gospels report that after his death, Jesus' tomb was found",["empty","undisturbed with the body still present","destroyed by soldiers","never located at all"],0,"All Synoptic accounts report an empty tomb.","Easy"),
          Q("In John's Gospel, Jesus describes himself as the 'Good Shepherd' to illustrate his",["care and protection for his followers","physical strength","royal lineage","wealth"],0,"The Good Shepherd image conveys Jesus' caring, protective role.","Medium"),
          Q("Jesus' description of himself as 'the resurrection and the life' was made in the context of",["the raising of Lazarus","the Sermon on the Mount","the Triumphal Entry","his baptism"],0,"This declaration appears in John 11, before raising Lazarus.","Hard"),
          Q("'O foolish men, and slow of heart to believe all that the prophets have spoken!' Which people were being addressed?",["the two men travelling to Emmaus","the seventy disciples Jesus sent out","the twelve apostles of Jesus","the women who went to the tomb of Jesus"],0,"The risen Jesus said this to the two disciples on the road to Emmaus (Luke 24:25).","Hard",VP)
        ]
      },
      { id:"gospels6", name:"Love, the Ascension, Pentecost and the Early Church's Mission",
        hook:"Once a respected coach steps away for good, a team either falls apart or someone steps up to keep things running, guided by everything they were taught. Once Jesus physically leaves, the story doesn't end either; it hands off to the Holy Spirit and a rapidly growing community that had to figure out how to actually live out love and mission without Jesus physically present.",
        obj:["Discuss John's teaching on love","Explain the significance of the Ascension, Pentecost and the Church's early mission, including opposition"],
        exp:[
          {t:"Love (John)", b:"John repeatedly frames love for one another as the clearest evidence of genuinely following Jesus, not just correct belief alone."},
          {t:"Ascension, Pentecost & mission", b:"Jesus' ascension marks his departure; Pentecost marks the Spirit's arrival, empowering the disciples to boldly begin the Church's mission - even amid early opposition and persecution."}
        ],
        err:["Confusing the Ascension with the Resurrection","Assuming the early church faced no meaningful opposition"],
        qs:[
          Q("According to John's Gospel and letters, the clearest evidence of following Jesus is",["genuine love for one another","wealth and possessions","political power","academic knowledge"],0,"John repeatedly emphasises love for one another as key evidence of true discipleship.","Medium"),
          Q("The event where the Holy Spirit descended on the disciples is called",["Pentecost","Passover","the Transfiguration","the Ascension"],0,"Pentecost, recorded in Acts 2, marks the coming of the Holy Spirit.","Easy"),
          Q("The early church, as recorded in Acts, faced opposition mainly from",["religious authorities threatened by its growing influence","foreign armies invading Judea","a famine","internal disagreement alone"],0,"Acts records repeated opposition from Jewish religious authorities.","Medium")
        ]
      },
      { id:"acts1", name:"Fellowship in the Early Church and Mission to the Gentiles",
        hook:"Think about a small group project that starts among just a few close friends but somehow grows into something the whole school gets involved in. A small group of believers pooling their possessions to make sure no one went without is a striking picture of the earliest church's fellowship, and that same movement soon had to decide whether its message was for one nation or the whole world.",
        obj:["Discuss communal living in the early church, and the SPECIFIC sin of Ananias and Sapphira","Narrate the events of Pentecost and their significance","Explain Peter's vision and the conversion of Cornelius as the first Gentile convert","Explain the conversion of Saul and the mission to the Gentiles"],
        exp:[
          {t:"Fellowship", b:"Acts 2 and 4 describe believers sharing possessions and eating together, an early model of radical community care, though not without its own internal problems (like Ananias and Sapphira's deception)."},
          {t:"Ananias and Sapphira - the SPECIFIC sin, precisely stated", b:"A common misreading is assuming their sin was simply keeping back some money for themselves. Peter's own words in Acts 5:4 clarify this precisely: the property and the proceeds from selling it were entirely theirs to keep or give as they chose, their sin was specifically LYING to the Holy Spirit by claiming they'd given the FULL amount when they hadn't. The punishment (sudden death for both) responded to deceit, not to imperfect generosity, a distinction worth getting exactly right."},

      { id:"epistles1", name:"Justification by Faith, Law, Grace and New Life in Christ",

          {t:"Abraham - Paul's chosen proof case", b:"Paul's sharpest argument in Romans 4 uses Abraham specifically: Abraham was declared righteous by God BEFORE the law of Moses even existed, purely through faith and trust in God's promise. Paul's point is precise and deliberate: if Abraham, the very father of the Jewish nation, was justified by faith centuries before the law was given, then justification was never really about law-keeping in the first place, faith was always the real basis."},

async function supabaseRPC(fn, params){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,

function weekRingSVG(last7Days, studiedToday, uid){
  uid = uid || Math.random().toString(36).slice(2,8);
  const n = 7, gap = 5, segAngle = 360/n, cx=70, cy=70, r=56;
  function polar(angleDeg){ const rad=(angleDeg-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; }
  function arcPath(start,end){
    const [x1,y1]=polar(end), [x2,y2]=polar(start);
    const largeArc = (end-start)>180 ? 1 : 0;
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 0 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  }
  const dayLabels = ["S","M","T","W","T","F","S"];
  let segs = "";
  (last7Days||[]).forEach((d,i)=>{
    const start = i*segAngle + gap/2, end = (i+1)*segAngle - gap/2;
    const color = d.active ? `url(#weekGrad-${uid})` : "#E9E6F5";
    segs += `<path d="${arcPath(start,end)}" stroke="${color}" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  });
  const centerIcon = studiedToday
    ? `<text x="70" y="64" text-anchor="middle" font-size="26">✅</text><text x="70" y="88" text-anchor="middle" font-size="10.5" fill="#166534" font-weight="700">Studied today</text>`

/* ======================= GAMIFICATION ======================= */
const LEVELS = [
  {min:0,    title:"Fresh Starter",     emoji:"🌱"},
  {min:150,  title:"Rising Learner",    emoji:"📚"},
  {min:400,  title:"Sharp Thinker",     emoji:"🧠"},
  {min:800,  title:"Exam Warrior",      emoji:"⚔️"},
  {min:1400, title:"Knowledge Hunter",  emoji:"🎯"},
  {min:2200, title:"Scholar",           emoji:"🎓"},
  {min:3200, title:"Master Strategist", emoji:"👑"},
  {min:4500, title:"GCE Legend",        emoji:"🏆"}
];

function computeXP(){
  let xp = 0, totalCorrect = 0, totalAttempted = 0, totalMocks = 0, perfectTopics = 0, subjectsTouched = 0;
  SUBJECTS.forEach(s=>{
    const p = state.progress[s.id];
    if(!p) return;
    let touchedThisSubject = false;
    Object.values(p.topics||{}).forEach(t=>{
      if(t.attempted>0) touchedThisSubject = true;
      totalCorrect += (t.correct||0);
      totalAttempted += (t.attempted||0);
      if(t.attempted>=3 && t.correct===t.attempted) perfectTopics++;
    });
    (p.mocks||[]).forEach(m=>{ totalMocks++; xp += 30; if(m.correct===m.total) xp += 40; });
    if(touchedThisSubject) subjectsTouched++;
  });
  xp += totalCorrect*10 + perfectTopics*20;
  return { xp, totalCorrect, totalAttempted, totalMocks, perfectTopics, subjectsTouched };
}

function levelForXP(xp){
  let current = LEVELS[0], next = LEVELS[1];
  for(let i=0;i<LEVELS.length;i++){
    if(xp >= LEVELS[i].min){ current = LEVELS[i]; next = LEVELS[i+1] || null; }
  }
  return { current, next };
}

function computeBadges(stats, streak){
  const badges = [
    {id:"first_steps", name:"First Steps", emoji:"👣", desc:"Complete your first topic practice", earned: stats.totalAttempted>0},
    {id:"century", name:"Century Club", emoji:"💯", desc:"Answer 100 questions in total", earned: stats.totalAttempted>=100},
    {id:"perfect", name:"Perfect Score", emoji:"⭐", desc:"Score 100% on a topic (3+ questions)", earned: stats.perfectTopics>=1},
    {id:"perfectionist", name:"Perfectionist", emoji:"🌟", desc:"Score 100% on 3 different topics", earned: stats.perfectTopics>=3},
    {id:"explorer", name:"Subject Explorer", emoji:"🧭", desc:"Try practice in all 7 subjects", earned: stats.subjectsTouched>=7},
    {id:"mock1", name:"Mock Debut", emoji:"📝", desc:"Complete your first readiness check", earned: stats.totalMocks>=1},
    {id:"mock5", name:"Exam-Ready", emoji:"🎯", desc:"Complete 5 readiness checks", earned: stats.totalMocks>=5},
    {id:"streak3", name:"Streak Starter", emoji:"🔥", desc:"Study 3 days in a row", earned: streak>=3},
    {id:"streak7", name:"On Fire", emoji:"🔥🔥", desc:"Study 7 days in a row", earned: streak>=7},

/* ======================= QUIZ ENGINE ======================= */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Re-shuffles a question's answer options every time it's presented, so the
   correct answer's letter position is randomised per attempt rather than
   fixed in the data. Keeps the same option text and correctness, just
   reorders where each one lands (A/B/C/D). */
function shuffleQuestionOptions(q){
  const order = shuffle(q.o.map((_,i)=>i));
  const newOptions = order.map(i=>q.o[i]);
  const newCorrect = order.indexOf(q.c);
  return {...q, o:newOptions, c:newCorrect};
}

function startTopicPractice(subjectId, topicId){
  const topic = findTopic(subjectId, topicId);
  const questions = shuffle(topic.qs.map((q,i)=>shuffleQuestionOptions({...q, topicId, topicName:topic.name, qIndex:i})));
  state.quiz = { mode:"topic", subjectId, topicId, questions, index:0, picks:{}, revealed:{}, timedSeconds:null };
  go("quiz", {subjectId, topicId});
}
window.startTopicPractice = startTopicPractice;

function startMock(subjectId){
  const subject = findSubject(subjectId);
  const pool = shuffle(allSubjectQuestions(subject));
  const size = Math.min(15, pool.length);
  const questions = pool.slice(0, size).map(shuffleQuestionOptions);
  const seconds = size * 75;
  state.quiz = { mode:"mock", subjectId, questions, index:0, picks:{}, revealed:{}, timedSeconds:seconds, secondsLeft:seconds };
  go("quiz", {subjectId});
  timerHandle = setInterval(()=>{
    if(!state.quiz) { clearInterval(timerHandle); return; }
    state.quiz.secondsLeft--;
    if(state.quiz.secondsLeft <= 0){ clearInterval(timerHandle); submitMock(); return; }
    updateTimerDisplay();
  }, 1000);
}

  const el = document.getElementById("timerDisplay"); if(!el || !state.quiz) return;
  const s = state.quiz.secondsLeft; const m = Math.floor(s/60), sec = s%60;

function pickOption(qIdx, optIdx){
  const quiz = state.quiz; if(quiz.revealed[qIdx]) return;
  quiz.picks[qIdx] = optIdx;
  if(quiz.mode === "topic" || quiz.mode === "mastery"){
    quiz.revealed[qIdx] = true;
    const q = quiz.questions[qIdx]; const correct = optIdx === q.c;
    if(quiz.mode === "topic"){ recordAnswer(quiz.subjectId, q.topicId, correct); saveProgress(quiz.subjectId); }
  }
  render();
}

function quizNext(){
  const quiz = state.quiz;
  if(quiz.index < quiz.questions.length - 1){ quiz.index++; render(); }
  else if(quiz.mode === "topic"){ finishTopicPractice(); }
  else if(quiz.mode === "mastery"){ finishMasteryCheck(); }
}

function finishTopicPractice(){
  const quiz = state.quiz; let correct=0;
  quiz.questions.forEach((q,i)=>{ if(quiz.picks[i]===q.c) correct++; });
  state.lastResult = { mode:"topic", subjectId:quiz.subjectId, topicId:quiz.topicId, total:quiz.questions.length, correct, questions:quiz.questions, picks:quiz.picks };
  go("results", {subjectId:quiz.subjectId, topicId:quiz.topicId});
}
function submitMock(){
  clearInterval(timerHandle);
  const quiz = state.quiz; if(!quiz) return;
  let correct=0; const topicBreak = {}; const diffBreak = {Easy:{c:0,t:0}, Medium:{c:0,t:0}, Hard:{c:0,t:0}};
  quiz.questions.forEach((q,i)=>{
    const isCorrect = quiz.picks[i] === q.c; if(isCorrect) correct++;
    if(!topicBreak[q.topicId]) topicBreak[q.topicId] = {c:0,t:0,name:q.topicName};
    topicBreak[q.topicId].t++; if(isCorrect) topicBreak[q.topicId].c++;
    diffBreak[q.d].t++; if(isCorrect) diffBreak[q.d].c++;
    recordAnswer(quiz.subjectId, q.topicId, isCorrect);
  });
  const record = { date:new Date().toISOString(), score:correct, total:quiz.questions.length, topicBreak, diffBreak };
  state.progress[quiz.subjectId].mocks.push(record); saveProgress(quiz.subjectId);
  state.lastResult = { mode:"mock", subjectId:quiz.subjectId, total:quiz.questions.length, correct, topicBreak, diffBreak, questions:quiz.questions, picks:quiz.picks };
  const sid = quiz.subjectId; state.quiz = null;
  go("results", {subjectId:sid});
}

function startRemediation(subjectId, topicIds){
  state.remediation = { subjectId, queue: topicIds.slice(), currentTopicId: topicIds[0], stage:"restudy", attempts:0, lastScore:null, lastCorrect:0, lastTotal:0 };
  go("remediate", {subjectId});
}
window.startRemediation = startRemediation;

function beginMasteryCheck(){
  const rem = state.remediation; if(!rem) return;
  const subjectId = rem.subjectId, topicId = rem.currentTopicId;
  const topic = findTopic(subjectId, topicId);
  const size = Math.min(10, topic.qs.length);
  const questions = shuffle(topic.qs.map((q,i)=>shuffleQuestionOptions({...q, topicId, topicName:topic.name, qIndex:i}))).slice(0, size);
  state.quiz = { mode:"mastery", subjectId, topicId, questions, index:0, picks:{}, revealed:{}, timedSeconds:null };
  go("quiz", {subjectId, topicId});
}
window.beginMasteryCheck = beginMasteryCheck;

function finishMasteryCheck(){
  const quiz = state.quiz; let correct=0;
  quiz.questions.forEach((q,i)=>{ if(quiz.picks[i]===q.c) correct++; });
  const total = quiz.questions.length;
  const pct = Math.round((correct/total)*100);
  const passed = pct >= 90;
  const rem = state.remediation;
  rem.lastScore = pct; rem.lastCorrect = correct; rem.lastTotal = total;
  if(passed){
    if(!state.progress[quiz.subjectId].mastered) state.progress[quiz.subjectId].mastered = {};
    state.progress[quiz.subjectId].mastered[quiz.topicId] = true;
    saveProgress(quiz.subjectId);
    rem.stage = "passed";
  } else {
    rem.attempts = (rem.attempts||0) + 1;
    rem.stage = "retry";
  }
  state.quiz = null;
  go("remediate", {subjectId: quiz.subjectId});
}

function nextRemediationTopic(){
  const rem = state.remediation; if(!rem) return;
  rem.queue.shift();
  if(rem.queue.length){
    rem.currentTopicId = rem.queue[0]; rem.stage = "restudy"; rem.attempts = 0;
    go("remediate", {subjectId: rem.subjectId});
  } else {
    const sid = rem.subjectId;
    state.remediation = null;
    go("subject", {subjectId: sid});
  }
}
window.nextRemediationTopic = nextRemediationTopic;

function exitRemediation(){
  const sid = state.remediation ? state.remediation.subjectId : state.subjectId;
  state.remediation = null;
  go("subject", {subjectId: sid});
}

/* ======================= AI STUDY BUDDY ======================= */
function chatKey(sid,tid){ return sid+":"+tid; }
function getChatSession(sid,tid){
  const k = chatKey(sid,tid);
  if(!chatSessions[k]) chatSessions[k] = { messages: [], busy:false };
  return chatSessions[k];
}
function buildSystemPrompt(subject, topic){
  const objs = topic.obj.join("; ");
  const concepts = topic.exp.map(e=>e.t).join(", ");
  return "You are a warm, patient WAEC GCE study buddy helping a private-candidate student in Nigeria understand the topic '" + topic.name + "' in " + subject.name + ". " +
    "Learning objectives for this topic: " + objs + ". Key ideas involved: " + concepts + ". " +
    "Explain things using simple, fun, relatable, real-life analogies a 10-year-old could follow, then connect the analogy back to how WAEC actually tests it. " +
    "Keep replies short and conversational (roughly 80-150 words) unless the student clearly asks for more depth. Be encouraging, never condescending. " +
    "If the student pastes a specific exam-style question, help them reason through it step by step rather than just stating the final answer outright. " +
    "If the student asks something unrelated to this subject or to WAEC exam preparation, gently steer the conversation back to this topic.";
}
function renderChatChips(){
  const chips = ["Explain this like I'm 10","Give me a fun real-life example","Why does WAEC test this?","I'm still confused, try again simpler"];
  return chips.map(c=>`<button class="chip" onclick="sendChat(${JSON.stringify(c)})">${c}</button>`).join("");
}
async function sendChat(presetText){
  const sid = state.subjectId, tid = state.topicId;
  const session = getChatSession(sid, tid);
  if(session.busy) return;
  const inputEl = document.getElementById("chatInput");
  const text = (presetText!==undefined ? presetText : (inputEl ? inputEl.value.trim() : ""));
  if(!text) return;
  session.messages.push({role:"user", content:text});
  session.busy = true;
  if(inputEl) inputEl.value = "";
  render();
  scrollChatToBottom();
  try{
    const subject = findSubject(sid), topic = findTopic(sid, tid);
    const sys = buildSystemPrompt(subject, topic);
    const apiMessages = session.messages.map(m=>({role:m.role, content:m.content}));
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:600, system: sys, messages: apiMessages })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type==="text").map(b=>b.text);
    const reply = textBlocks.join("\n").trim() || "Sorry, I couldn't come up with a reply just now - try asking again.";
    session.messages.push({role:"assistant", content:reply});
  }catch(err){
    session.messages.push({role:"assistant", content:"__ERROR__Something went wrong reaching the study buddy. Please check your connection and try again."});
  }
  session.busy = false;
  render();
  scrollChatToBottom();
}
window.sendChat = sendChat;
function scrollChatToBottom(){
  setTimeout(()=>{ const log = document.getElementById("chatLog"); if(log) log.scrollTop = log.scrollHeight; }, 30);
}

let theoryAttempt = null; // { subjectId, index, question, typedAnswer, images:[{data,mediaType}], grading:false, result:null, error:null }

function startTheoryAttempt(subjectId, index){
  const list = THEORY_QUESTIONS[subjectId] || [];
  const question = list[index];
  if(!question) return;
  theoryAttempt = { subjectId, index, question, typedAnswer:"", images:[], grading:false, result:null, error:null };
}

function addTheoryImages(fileInput){
  if(!theoryAttempt) return;
  const files = Array.from(fileInput.files || []);
  let remaining = files.length;
  if(remaining===0) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const dataUrl = e.target.result; // "data:image/jpeg;base64,AAAA..."
      const match = /^data:(image\/[a-zA-Z+]+);base64,(.*)$/.exec(dataUrl);
      if(match){
        theoryAttempt.images.push({ mediaType: match[1], data: match[2] });
      }
      remaining--;
      if(remaining===0){ render(); }
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = "";
}
window.addTheoryImages = addTheoryImages;

function removeTheoryImage(idx){
  if(!theoryAttempt) return;
  theoryAttempt.images.splice(idx,1);
  render();
}
window.removeTheoryImage = removeTheoryImage;

function updateTheoryTyped(el){
  if(!theoryAttempt) return;
  theoryAttempt.typedAnswer = el.value;
}
window.updateTheoryTyped = updateTheoryTyped;

function buildGradingSystemPrompt(subjectName, q){
  return "You are an experienced, fair and encouraging WAEC examiner grading a student's PRACTICE " + subjectName + " theory/essay answer. " +
    "This is for self-study only, not an official result. " +
    "Question: " + q.q + " " +
    "Maximum marks: " + q.marks + ". " +
    "Marking guide (key points an examiner would look for): " + q.guide.join("; ") + ". " +
    "If the student's answer is provided as one or more images, carefully read the handwriting first. If any part is genuinely illegible, say so honestly in your NOTE rather than guessing or inventing content. " +
    "Grade fairly against the marking guide: award credit for valid points even if phrased differently from the guide, and do not penalise imperfect handwriting itself, only the actual content. " +
    "Respond in EXACTLY this format, with no extra commentary before or after:\n" +
    "SCORE: <number>/" + q.marks + "\n" +
    "STRENGTHS: <2-3 specific things the student did well>\n" +
    "IMPROVE: <2-3 specific, actionable things to improve>\n" +
    "NOTE: <any handwriting legibility issues, or 'None'>";
}

function parseGradingResponse(text, maxMarks){
  const scoreMatch = /SCORE:\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/i.exec(text);
  const strengthsMatch = /STRENGTHS:\s*([\s\S]*?)(?=IMPROVE:|$)/i.exec(text);
  const improveMatch = /IMPROVE:\s*([\s\S]*?)(?=NOTE:|$)/i.exec(text);
  const noteMatch = /NOTE:\s*([\s\S]*)$/i.exec(text);
  if(!scoreMatch){
    return { raw:true, text: text };
  }
  return {
    raw:false,
    score: scoreMatch[1],
    maxMarks: scoreMatch[2] || maxMarks,
    strengths: strengthsMatch ? strengthsMatch[1].trim() : "",
    improve: improveMatch ? improveMatch[1].trim() : "",
    note: noteMatch ? noteMatch[1].trim() : "None"
  };
}

async function submitTheoryAnswer(){
  if(!theoryAttempt || theoryAttempt.grading) return;
  const hasTyped = theoryAttempt.typedAnswer && theoryAttempt.typedAnswer.trim().length > 0;
  const hasImages = theoryAttempt.images.length > 0;
  if(!hasTyped && !hasImages){
    theoryAttempt.error = "Type your answer or upload at least one photo of your handwritten answer before submitting.";
    render();
    return;
  }
  theoryAttempt.error = null;
  theoryAttempt.grading = true;
  theoryAttempt.result = null;
  render();

  try{
    const subject = findSubject(theoryAttempt.subjectId);
    const sys = buildGradingSystemPrompt(subject.name, theoryAttempt.question);
    const contentBlocks = [];
    theoryAttempt.images.forEach(img=>{
      contentBlocks.push({ type:"image", source:{ type:"base64", media_type: img.mediaType, data: img.data } });
    });
    let textPrompt = "Please grade my answer above." ;
    if(hasTyped){
      textPrompt = "Here is my typed answer to grade:\n\n" + theoryAttempt.typedAnswer;
    } else {
      textPrompt = "Here is a photo (or photos) of my handwritten answer. Please read it carefully and grade it.";
    }
    contentBlocks.push({ type:"text", text: textPrompt });

    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:900,
        system: sys,
        messages: [{ role:"user", content: contentBlocks }]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type==="text").map(b=>b.text);
    const reply = textBlocks.join("\n").trim();
    if(!reply){ throw new Error("empty response"); }
    theoryAttempt.result = parseGradingResponse(reply, theoryAttempt.question.marks);
  }catch(err){
    theoryAttempt.error = "Something went wrong grading your answer - please check your connection and try again.";
  }
  theoryAttempt.grading = false;
  render();
}
window.submitTheoryAnswer = submitTheoryAnswer;

function retryTheoryAttempt(){
  if(!theoryAttempt) return;
  theoryAttempt.result = null;
  theoryAttempt.error = null;
  theoryAttempt.typedAnswer = "";
  theoryAttempt.images = [];
  render();
}
window.retryTheoryAttempt = retryTheoryAttempt;

      </div>

    </div>`;
  }

  const children = state.guardianData || [];

  const linkForm = state.guardianShowLinkForm ? `
    <div class="section-block" style="background:#FFF9EE;">
      <h4>LINK A CHILD'S PROFILE</h4>
      <p style="font-size:12.5px;color:var(--ink-soft);">You'll need your child's own username AND their 4-digit passkey to link - ask them for it. This confirms you have their consent to monitor their account.</p>
      ${state.guardianLinkMsg ? `<div class="${state.guardianLinkMsg.type==='error'?'auth-error':'admin-stat-row'}" style="${state.guardianLinkMsg.type==='success'?'color:#166534;background:#DCFCE7;padding:10px 14px;border-radius:10px;':''}">${state.guardianLinkMsg.text}</div>` : ""}

        <button class="primary-btn" onclick="guardianLinkChild()" ${state.guardianBusy?"disabled":""}>${state.guardianBusy?"Linking...":"Link this child"}</button>
      </div>
    </div>` : "";

  const childCards = children.map(c=>{
    // Cover every subject, not just ones the child has touched - a guardian needs to see gaps too.
    const allSubjectStats = SUBJECTS.map(subj=>{
      const sid = subj.id;
      const topics = (c.progress[sid]&&c.progress[sid].topics)||{};
      let attempted=0, correct=0;
      Object.values(topics).forEach(t=>{ attempted+=(t.attempted||0); correct+=(t.correct||0); });
      const pct = attempted ? Math.round(100*correct/attempted) : null;
      return {sid, name: subj.name, attempted, correct, pct, touchedToday: (c.subjects_today||[]).includes(sid)};
    });
    const touched = allSubjectStats.filter(s=>s.attempted>0);
    const untouched = allSubjectStats.filter(s=>s.attempted===0);
    const ranked = [...touched].sort((a,b)=>(a.pct??100)-(b.pct??100));
    const weakest = ranked.slice(0,3);
    const strongest = ranked.slice(-2).reverse();

    const subjRows = allSubjectStats.map(s=>{
      if(s.attempted===0){
        return `<div class="admin-stat-row">
          <span style="color:var(--ink-soft);">${s.name}</span>
          <b style="color:var(--ink-soft);font-weight:600;">⚪ Never started</b>
